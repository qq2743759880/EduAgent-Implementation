[project]
name = "edu-agent"
version = "0.3.0"
description = "EduAgent - 面向教育培训行业的企业级AI agent平台"
# readme = "README.md"  # 占位文件不存在，暂时注释以免构建失败
requires-python = ">=3.11,<3.12"
dependencies = [
    # ── Web / 框架 ──
    "fastapi>=0.110,<0.142",
    "python-multipart>=0.0.9,<1.0",
    "uvicorn[standard]>=0.29,<0.53",
    "sse-starlette>=2.0,<3.5",
    "langgraph>=1.2,<1.3",
    "langchain-core>=1.5,<2.0",
    "langchain-openai>=1.4,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "email-validator>=2.1,<3.0",
    # ── 存储驱动 ──
    "pymilvus>=3.0,<3.1",
    "motor>=3.4,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "asyncmy>=0.2.9,<0.3",
    "pymysql>=1.1,<2.0",
    "minio>=7.2,<8.0",
    "neo4j>=5.0,<6.0",
    # ── 缓存（Phase 1：Redis 异步客户端 + C 解析器） ──
    "redis[hiredis]>=5.0,<6.0",
    # ── 工具库 ──
    "httpx>=0.27,<0.29",
    "jinja2>=3.1,<4.0",
    "pyyaml>=6.0,<7.0",
    "python-docx>=1.1,<1.3",
    "loguru>=0.7,<0.8",
    "prometheus-client>=0.19,<0.22",
    # ── 可观测性（TB2b：分层 span → Jaeger 真瀑布） ──
    # SDK 生成 spanId 并维护父子关系；OTLP/HTTP exporter 直发 Jaeger 的 /v1/traces。
    # 说明：这几个包在本机 .venv 里**原本就已存在**（手写 envelope 时代 otlp.py 就在用），
    # 但一直没写进声明文件 —— 换机重建 venv 会缺包、OTel 埋点静默降级 no-op（极难排查）。
    # TB2b 一并将「实际在用」的依赖补成声明，消除隐式依赖。
    "opentelemetry-api>=1.20,<2.0",
    "opentelemetry-sdk>=1.20,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20,<2.0",
    "sqlglot>=23.0,<24.0",
    "sqlparse>=0.5,<1.0",
    "alembic>=1.13,<2.0",
    "jieba>=0.42,<1.0",
    "rank-bm25>=0.1,<1.0",
    # ── 鉴权 ──
    "bcrypt>=4.1,<6.0",
    "pyjwt>=2.8,<3.0",
    "ipykernel>=7.3.0",
]
[project.optional-dependencies]
gpu = [
    "torch==2.11.0+cu128",
    "flagembedding>=1.4,<2.0",
    "transformers>=5.0,<6.0",
    "sentence-transformers>=5.7,<6.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<0.24",
    "respx>=0.21,<0.22",
    "ruff>=0.4,<0.7",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "services", "scripts"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: 端到端集成测试，需 VM 基础设施在线",
    "unit: 单元测试",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.23.8",
    "pytest-cov>=7.1.0",
]
