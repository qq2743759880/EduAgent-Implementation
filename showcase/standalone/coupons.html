<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/*
 * Bili-Study Clay Theme, Gate A frozen tokens
 *
 * Icon usage (Phosphor fill, local sprite):
 * <svg class="ic" aria-hidden="true"><use href="#ic-book-open"></use></svg>
 * For an icon-only control, put the accessible name on the control (aria-label or visible text).
 *
 * Token reference, one variable per line:
 * --bg-app: purple-tinted near-white application canvas.
 * --bg-raised: highest neutral surface reserved for dialogs and toasts.
 * --bg-input: subtly tinted recessed input surface.
 * --clay-primary: semantic alias for the approved main clay surface.
 * --clay-moss: approved primary moss green; #2E2A3F contrast is 8.84:1.
 * --clay-lavender: demoted secondary lavender, never the default surface.
 * --clay-sky: course and learning surface.
 * --clay-mint: success, completion, and progress surface.
 * --clay-peach: practice and quiz surface.
 * --clay-pink: favorites and community surface.
 * --clay-lemon: warm accent for reminders and pending work.
 * --cta-coral: the single saturated primary action color per screen.
 * --cta-text: primary action text; #2E2A3F on #FF7A6B is 5.43:1.
 * --status-active: active and successful state color.
 * --status-pending: pending state color.
 * --status-archived: archived and inactive state color.
 * --status-danger: destructive and error state color.
 * --text-strong: primary ink; intentionally not pure black.
 * --text-muted: secondary ink for supporting text.
 * --text-on-dark: text used on the dark code surface.
 * --surface-code: Markdown code block surface.
 * --focus-ring: high-contrast keyboard focus indicator.
 * --radius-card: L1 card radius.
 * --radius-btn: primary and secondary button radius.
 * --radius-input: input and compact control radius.
 * --radius-pill: pill and badge radius.
 * --radius-icon-tile: icon tile radius.
 * --space-1: 4px spacing unit.
 * --space-2: 8px spacing unit.
 * --space-3: 12px spacing unit.
 * --space-4: 16px spacing unit and minimum clay-to-clay gap.
 * --space-6: 24px spacing unit.
 * --space-8: 32px spacing unit.
 * --space-12: 48px spacing unit.
 * --control-min: minimum 44px interaction target.
 * --control-primary: 54px primary button height within the approved 52-56px range.
 * --motion-fast: 140ms tactile state duration.
 * --ease-clay: restrained ease-out curve for hover and press feedback.
 * --clay-shadow-moss: three-layer moss surface shadow.
 * --clay-shadow-lavender: three-layer secondary lavender surface shadow.
 * --clay-shadow-sky: three-layer sky surface shadow.
 * --clay-shadow-mint: three-layer mint surface shadow.
 * --clay-shadow-peach: three-layer peach surface shadow.
 * --clay-shadow-pink: three-layer pink surface shadow.
 * --clay-shadow-lemon: three-layer lemon surface shadow.
 * --clay-shadow-coral: three-layer coral action shadow.
 * --clay-shadow-raised: green-hued L2 shadow for raised neutral surfaces.
 * --clay-shadow-light: green-hued single-layer shadow for clay-light regions.
 * --clay-shadow-press-moss: compressed moss shadow for pressed controls.
 * --clay-shadow-press-coral: compressed coral shadow for pressed primary actions.
 * --clay-shadow-input: inset moss shadow for recessed fields.
 * --clay-shadow-input-focus: inset moss shadow plus visible focus halo.
 * --layer-base: normal document flow.
 * --layer-sticky: sticky navigation layer.
 * --layer-dropdown: menu and popover layer.
 * --layer-overlay: modal scrim layer.
 * --layer-dialog: dialog layer.
 * --layer-toast: toast and urgent feedback layer.
 *
 * L1 page overrides belong in a .page-<name> namespace. Example:
 * .page-dashboard { --page-card-gap: var(--space-6); }
 * Do not place page-specific selectors outside that namespace.
 */

:root {
  --bg-app: #F7F5FB;
  --bg-raised: #FFFFFF;
  --bg-input: #F7FAF4;
  --clay-primary: var(--clay-moss);
  --clay-moss: #B8D8A8;
  --clay-lavender: #B8A6FF;
  --clay-sky: #9EC9F0;
  --clay-mint: #7DD4A8;
  --clay-peach: #FFB59E;
  --clay-pink: #F5B8D0;
  --clay-lemon: #F5D77A;
  --cta-coral: #FF7A6B;
  --cta-text: #2E2A3F;
  --status-active: #7DD4A8;
  --status-pending: #F5D77A;
  --status-archived: #C9B5FF;
  --status-danger: #C63E4A;
  --text-strong: #2E2A3F;
  --text-muted: #6B6580;
  --text-on-dark: #F7F5FB;
  --surface-code: #2E2A3F;
  --focus-ring: #453C66;

  --radius-card: 28px;
  --radius-btn: 18px;
  --radius-input: 16px;
  --radius-pill: 999px;
  --radius-icon-tile: 20px;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --control-min: 44px;
  --control-primary: 54px;

  --motion-fast: 140ms;
  --ease-clay: cubic-bezier(.25, 1, .5, 1);

  --clay-shadow-moss:
    8px 8px 24px rgba(78, 126, 66, .30),
    inset -6px -6px 16px rgba(78, 126, 66, .22),
    inset 6px 6px 16px rgba(255, 254, 252, .58);
  --clay-shadow-lavender:
    8px 8px 24px rgba(126, 105, 181, .28),
    inset -6px -6px 16px rgba(126, 105, 181, .20),
    inset 6px 6px 16px rgba(255, 254, 252, .56);
  --clay-shadow-sky:
    8px 8px 24px rgba(80, 142, 196, .30),
    inset -6px -6px 16px rgba(80, 142, 196, .22),
    inset 6px 6px 16px rgba(255, 254, 252, .56);
  --clay-shadow-mint:
    8px 8px 24px rgba(43, 153, 103, .29),
    inset -6px -6px 16px rgba(43, 153, 103, .21),
    inset 6px 6px 16px rgba(255, 254, 252, .56);
  --clay-shadow-peach:
    8px 8px 24px rgba(218, 111, 82, .29),
    inset -6px -6px 16px rgba(218, 111, 82, .21),
    inset 6px 6px 16px rgba(255, 254, 252, .54);
  --clay-shadow-pink:
    8px 8px 24px rgba(188, 99, 137, .28),
    inset -6px -6px 16px rgba(188, 99, 137, .20),
    inset 6px 6px 16px rgba(255, 254, 252, .56);
  --clay-shadow-lemon:
    8px 8px 24px rgba(190, 149, 35, .28),
    inset -6px -6px 16px rgba(190, 149, 35, .20),
    inset 6px 6px 16px rgba(255, 254, 252, .54);
  --clay-shadow-coral:
    8px 8px 24px rgba(214, 82, 70, .31),
    inset -6px -6px 16px rgba(214, 82, 70, .23),
    inset 6px 6px 16px rgba(255, 254, 252, .45);
  --clay-shadow-raised: 12px 12px 32px rgba(78, 126, 66, .22);
  --clay-shadow-light: 6px 8px 20px rgba(78, 126, 66, .18);
  --clay-shadow-press-moss:
    4px 4px 12px rgba(78, 126, 66, .26),
    inset -3px -3px 8px rgba(78, 126, 66, .18),
    inset 3px 3px 8px rgba(255, 254, 252, .46);
  --clay-shadow-press-coral:
    4px 4px 12px rgba(214, 82, 70, .27),
    inset -3px -3px 8px rgba(214, 82, 70, .19),
    inset 3px 3px 8px rgba(255, 254, 252, .38);
  --clay-shadow-input:
    inset 3px 3px 8px rgba(78, 126, 66, .20),
    inset -3px -3px 8px rgba(255, 254, 252, .88);
  --clay-shadow-input-focus:
    inset 3px 3px 8px rgba(78, 126, 66, .24),
    inset -3px -3px 8px rgba(255, 254, 252, .92),
    0 0 0 3px rgba(69, 60, 102, .22);

  --layer-base: 0;
  --layer-sticky: 100;
  --layer-dropdown: 300;
  --layer-overlay: 700;
  --layer-dialog: 800;
  --layer-toast: 1000;
}

.ic {
  display: inline-block;
  flex: 0 0 auto;
  width: 1.25em;
  height: 1.25em;
  overflow: visible;
  color: currentColor;
  fill: currentColor;
  vertical-align: -.2em;
}

.clay-card {
  min-width: 0;
  border: 0;
  border-radius: var(--radius-card);
  color: var(--text-strong);
  background: var(--clay-primary);
  box-shadow: var(--clay-shadow-moss);
}

.clay-btn-primary,
.clay-btn-soft {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-width: var(--control-min);
  min-height: var(--control-min);
  border: 0;
  border-radius: var(--radius-btn);
  padding-inline: var(--space-6);
  color: var(--text-strong);
  font: inherit;
  font-weight: 800;
  line-height: 1;
  text-decoration: none;
  cursor: pointer;
  touch-action: manipulation;
  transition:
    transform var(--motion-fast) var(--ease-clay),
    box-shadow var(--motion-fast) var(--ease-clay),
    background-color var(--motion-fast) var(--ease-clay);
}

.clay-btn-primary {
  min-height: var(--control-primary);
  color: var(--cta-text);
  background: var(--cta-coral);
  box-shadow: var(--clay-shadow-coral);
}

.clay-btn-soft {
  background: var(--clay-primary);
  box-shadow: var(--clay-shadow-light);
}

.clay-btn-primary:hover,
.clay-btn-soft:hover {
  transform: translateY(-2px);
}

.clay-btn-primary:active,
.clay-btn-soft:active {
  transform: scale(.97);
}

.clay-btn-primary:active {
  box-shadow: var(--clay-shadow-press-coral);
}

.clay-btn-soft:active {
  box-shadow: var(--clay-shadow-press-moss);
}

.clay-btn-primary:disabled,
.clay-btn-soft:disabled,
.clay-btn-primary[aria-disabled="true"],
.clay-btn-soft[aria-disabled="true"] {
  opacity: .52;
  cursor: not-allowed;
  transform: none;
}

.clay-pill {
  display: inline-flex;
  align-items: center;
  min-height: 32px;
  gap: var(--space-1);
  border-radius: var(--radius-pill);
  padding: var(--space-1) var(--space-3);
  color: var(--text-strong);
  background: var(--clay-lemon);
  box-shadow: 3px 4px 10px rgba(190, 149, 35, .21);
  font-size: .8125rem;
  font-weight: 800;
}

.clay-input {
  width: 100%;
  min-height: var(--control-primary);
  border: 0;
  border-radius: var(--radius-input);
  padding: var(--space-3) var(--space-4);
  color: var(--text-strong);
  background: var(--bg-input);
  box-shadow: var(--clay-shadow-input);
  font: inherit;
}

.clay-input::placeholder {
  color: var(--text-muted);
  opacity: 1;
}

.clay-input:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 2px;
  box-shadow: var(--clay-shadow-input-focus);
}

.clay-bubble-user,
.clay-bubble-ai {
  max-width: min(80%, 72ch);
  overflow-wrap: anywhere;
  border-radius: 24px 24px 24px 8px;
  padding: var(--space-4) 20px;
  color: var(--text-strong);
}

.clay-bubble-user {
  margin-inline-start: auto;
  border-radius: 24px 24px 8px 24px;
  background: var(--clay-peach);
  box-shadow: var(--clay-shadow-peach);
}

.clay-bubble-ai {
  background: var(--clay-primary);
  box-shadow: var(--clay-shadow-moss);
}

.clay-nav {
  position: relative;
  z-index: var(--layer-sticky);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  min-height: 64px;
  border-radius: var(--radius-card);
  padding: var(--space-2) var(--space-4);
  color: var(--text-strong);
  background: var(--bg-raised);
  box-shadow: var(--clay-shadow-raised);
}

.clay-nav :where(a, button) {
  min-width: var(--control-min);
  min-height: var(--control-min);
}

.clay-nav :where(.active, [aria-current="page"]) {
  color: var(--cta-text);
  background: var(--cta-coral);
}

.clay-card-placeholder {
  position: relative;
  min-height: 144px;
  border: 0;
  border-radius: var(--radius-card);
  padding: var(--space-6);
  color: var(--text-strong);
  background: var(--clay-lemon);
  box-shadow: var(--clay-shadow-lemon);
}

.clay-card-placeholder[data-state="closed"] {
  background: var(--clay-lavender);
  box-shadow: var(--clay-shadow-lavender);
}

.clay-card-placeholder[data-state="forbidden"] {
  outline: 3px solid var(--status-archived);
  outline-offset: -3px;
  background: var(--bg-raised);
  box-shadow: var(--clay-shadow-raised);
}

.clay-card-placeholder[data-state="error"] {
  outline: 3px solid var(--status-danger);
  outline-offset: -3px;
  background: var(--clay-peach);
  box-shadow: var(--clay-shadow-peach);
}

.clay-card :where(pre, code),
.clay-bubble-ai :where(pre, code),
.clay-bubble-user :where(pre, code) {
  color: var(--text-on-dark);
  background: var(--surface-code);
}

.clay-card pre,
.clay-bubble-ai pre,
.clay-bubble-user pre {
  overflow: auto;
  border-radius: var(--radius-input);
  padding: var(--space-4);
}

:where(.clay-btn-primary, .clay-btn-soft, .clay-nav a, .clay-nav button):focus-visible {
  outline: 3px solid var(--focus-ring);
  outline-offset: 3px;
}

/* Admin fallback: lower visual depth without changing component geometry. */
.clay-light {
  --radius-card: 24px;
}

.clay-card.clay-light,
.clay-light .clay-card {
  box-shadow: var(--clay-shadow-light);
}

.clay-light :where(table, .table, .chart, [data-chart], [data-table]) {
  border-radius: var(--radius-input);
  background: var(--bg-raised);
  box-shadow: none;
}

@media (prefers-reduced-motion: reduce) {
  .clay-btn-primary,
  .clay-btn-soft {
    transition-duration: .01ms;
  }

  .clay-btn-primary:hover,
  .clay-btn-primary:active,
  .clay-btn-soft:hover,
  .clay-btn-soft:active {
    transform: none;
  }
}

</style>

<style>
/* ===== PACK-B 黏土重塑（2026-09-21）：令牌唯源 /theme.css?v=7fed87f。
   三层分离：仅动视觉层——id/class/data-type/data-status/.on/.open/.show 显隐语义、
   z-index(gnav 130/overlay 120/toast 2147483000/om 150)冻结；
   旧 candy 变量名保留为页内别名(L1)，供脚本内联样式继续解析。 ===== */
:root{
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  /* —— 旧名 → clay 令牌别名（脚本内联样式仍引用，禁删）—— */
  --ink:var(--text-strong); --ink-strong:var(--text-strong); --ink-muted:var(--text-muted);
  --ink-faint:var(--text-muted);
  --white:var(--bg-raised); --ht-fff:var(--bg-raised); --candy-bg:var(--bg-app);
  --candy-silver:rgba(107,101,128,.18); --ht-eee:#ECE9F4;
  --border-chip:rgba(46,42,63,.14); --line:rgba(46,42,63,.12);
  --gray-300:rgba(46,42,63,.12);
  --candy-green:var(--clay-mint); --candy-green-deep:#2E7D4F; --candy-green-hover:var(--clay-mint);
  --candy-purple-soft:#EFE9FF; --candy-purple:#5B4FC4;
  --candy-orange:var(--cta-coral); --candy-orange-deep:#D65246;
  --candy-red:var(--status-danger); --candy-red-deep:var(--status-danger);
  --candy-blue:var(--focus-ring); --candy-blue-deep:#2B2E6E;
  --candy-blue-soft:rgba(158,201,240,.35); --candy-green-soft:rgba(125,212,168,.22); --candy-orange-soft:rgba(255,181,158,.30);
  --shadow-3d:8px 8px 22px rgba(78,126,66,.16);
  --radius-md:0.9rem; --radius-lg:var(--radius-card); --radius-xl:var(--radius-card);
  --htc-31-31-31-014:rgba(78,126,66,.14); --htc-31-31-31-018:rgba(78,126,66,.18);
  --htc-31-31-31-045:rgba(46,42,63,.45); --htc-255-200-0-022:rgba(214,82,70,.22);
  /* —— 页内派生色（L1，仅本页）—— */
  --page-accent:#5B4FC4
}
*{box-sizing:border-box;margin:0;padding:0}
html{min-height:100dvh}
body{min-height:100dvh;font-family:var(--font);color:var(--text-strong);background-color:var(--bg-app);background-image:radial-gradient(circle at 90% 8%,rgba(184,166,255,.22),transparent 24rem),radial-gradient(circle at 4% 94%,rgba(125,212,168,.20),transparent 22rem);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
a{text-decoration:none;color:inherit}
*:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px;border-radius:4px}

/* ===== 全局导航（黏土；44px 点击区清偿 G6 存量债）===== */
.gnav-toggle{display:none;position:fixed;top:12px;right:12px;z-index:140;width:44px;height:44px;border:0;background:var(--bg-raised);border-radius:var(--radius-btn);font-size:.875rem;font-weight:900;place-items:center;box-shadow:var(--clay-shadow-light);cursor:pointer;color:var(--text-strong)}
.gnav-overlay{position:fixed;inset:0;z-index:120;background:rgba(46,42,63,.45);backdrop-filter:blur(2px);opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.gnav-overlay.open{opacity:1;visibility:visible}
.glayout{display:block;max-width:1180px;margin:0 auto;padding:0}
.gnav{position:sticky;top:0;z-index:130;display:flex;flex-direction:row;align-items:center;gap:12px;width:auto;max-height:none;overflow:visible;background:var(--bg-raised);border:0;border-bottom:2px solid rgba(184,166,255,.28);border-radius:0;box-shadow:0 2px 12px rgba(78,126,66,.10);padding:10px 18px}
.gnav-brand{display:flex;align-items:center;gap:8px;min-width:0;min-height:44px;padding:0;margin:0;text-decoration:none;color:var(--text-strong);border-radius:var(--radius-pill)}
.gnav-logo{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--cta-coral);color:var(--cta-text);font-size:.75rem;font-weight:900;line-height:1;box-shadow:3px 4px 10px rgba(214,82,70,.28)}
.gnav-name{font-size:.9375rem;font-weight:900;color:var(--text-strong);white-space:nowrap}
.gnav-cap{font-size:.6875rem;font-weight:900;color:var(--text-muted);letter-spacing:.08em;white-space:nowrap}
.gnav-list{display:flex;flex-direction:row;align-items:center;gap:4px;min-width:0;flex:1;overflow-x:auto;scrollbar-width:none}
.gnav-list::-webkit-scrollbar{display:none}
.gnav-item{display:inline-flex;align-items:center;justify-content:center;width:auto;min-height:44px;white-space:nowrap;font-size:.8125rem;font-weight:800;color:var(--text-strong);padding:0 14px;border-radius:var(--radius-pill);border:2px solid transparent;transition:background var(--motion-fast) var(--ease-clay),color var(--motion-fast) var(--ease-clay);text-decoration:none}
.gnav-item:hover{background:var(--candy-purple-soft);color:var(--page-accent)}
.gnav-item.active{background:var(--cta-coral);color:var(--cta-text);border-color:transparent;box-shadow:3px 4px 10px rgba(214,82,70,.30)}
.gnav-foot{margin-left:auto;margin-top:0;border:0;padding:0;font-size:.6875rem;color:var(--text-muted);font-weight:700;white-space:nowrap}
.gnav-foot a,.gnav-foot button{display:inline-flex;align-items:center;min-height:44px;padding:0 8px}
@media(max-width:767px){
  .gnav-toggle{display:grid}
  .glayout{padding:0}
  .gnav{position:fixed;right:0;left:auto;top:0;bottom:0;z-index:130;width:min(320px,88vw);height:100dvh;align-items:stretch;flex-direction:column;gap:8px;padding:16px;transform:translateX(100%);transition:transform .24s var(--ease-clay);box-shadow:var(--clay-shadow-raised);border-left:0;border-bottom:0}
  .gnav.open{transform:translateX(0)}
  .gnav-brand{padding-bottom:10px;border-bottom:2px solid var(--border-chip)}
  .gnav-cap{padding-top:4px}
  .gnav-list{flex-direction:column;align-items:stretch;overflow-y:auto}
  .gnav-item{justify-content:flex-start;width:100%;min-height:44px}
  .gnav-foot{margin:0;padding-top:8px;border-top:2px solid var(--border-chip)}
}

/* ===== 页面主体 ===== */
.page{max-width:860px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:16px}
.page-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.page-head .mascot{display:grid;place-items:center;width:52px;height:52px;border:0;border-radius:var(--radius-icon-tile);background:var(--candy-purple-soft);font-size:26px;box-shadow:var(--clay-shadow-light)}
.page-head h1{font-size:22px;font-weight:900;letter-spacing:-.01em;color:var(--text-strong)}
.page-head .sub{font-size:12.5px;color:var(--text-muted);font-weight:600;margin-top:2px}

/* ===== 状态 tab ===== */
.tabs{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tab{display:inline-flex;align-items:center;gap:6px;min-height:44px;border:2px solid transparent;background:var(--bg-raised);color:var(--text-strong);font-weight:800;font-size:13.5px;border-radius:var(--radius-pill);padding:8px 16px;box-shadow:var(--clay-shadow-light);transition:transform var(--motion-fast) var(--ease-clay),background var(--motion-fast) var(--ease-clay),color var(--motion-fast) var(--ease-clay)}
.tab:hover{transform:translateY(-2px)}
.tab.on{background:var(--clay-lavender);color:var(--text-strong);box-shadow:var(--clay-shadow-lavender)}
.tab .cnt{font-size:12px;font-weight:900;background:var(--clay-lemon);color:var(--text-strong);border-radius:999px;padding:1px 8px}
.tab.on .cnt{background:rgba(255,255,255,.72);color:var(--text-strong)}

/* ===== 券卡片 ===== */
.cp-list{display:flex;flex-direction:column;gap:12px}
.cp-card{position:relative;display:flex;align-items:stretch;gap:0;background:var(--bg-raised);border:0;border-radius:var(--radius-card);box-shadow:var(--clay-shadow-light);overflow:hidden}
.cp-card.dim{filter:grayscale(.85);opacity:.75}
.cp-left{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:128px;padding:16px 14px;border-right:3px dashed rgba(46,42,63,.14);background:#F1ECFF;flex-shrink:0}
.cp-card[data-type="cash"] .cp-left{background:rgba(125,212,168,.28)}
.cp-card[data-type="discount"] .cp-left{background:rgba(255,181,158,.35)}
.cp-card[data-type="trial"] .cp-left,.cp-card[data-type="gift"] .cp-left{background:rgba(158,201,240,.35)}
.cp-val{font-size:24px;font-weight:900;color:var(--text-strong);letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-align:center;line-height:1.15}
.cp-min{font-size:11.5px;font-weight:800;color:var(--text-strong);text-align:center}
.cp-body{display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0;flex:1;padding:14px 16px}
.cp-name{font-size:15px;font-weight:800;color:var(--text-strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-meta{font-size:12px;color:var(--text-muted);font-weight:600}
.cp-meta b{color:var(--text-strong);font-weight:800}
.cp-status{position:absolute;top:10px;right:10px;font-size:11px;font-weight:900;border:0;border-radius:var(--radius-pill);padding:2px 10px}
.cp-status.unused{background:var(--clay-mint);color:var(--text-strong)}
.cp-status.used{background:var(--candy-silver);color:var(--text-strong)}
.cp-status.expired{background:var(--status-danger);color:#FFFFFF}

/* ===== 空态 / 错误态 / 分页 ===== */
.state{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:var(--bg-raised);border:2px dashed var(--border-chip);border-radius:var(--radius-card);padding:36px 20px}
.state .st-emoji{font-size:40px;color:var(--text-strong);display:inline-flex}
.state h3{font-size:16px;font-weight:900;color:var(--text-strong)}
.state p{font-size:13px;color:var(--text-muted);font-weight:600}
.state .btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;border:0;background:var(--cta-coral);color:var(--cta-text);font-weight:900;font-size:13.5px;border-radius:var(--radius-btn);padding:9px 20px;box-shadow:var(--clay-shadow-coral);text-decoration:none}
.state .btn:active{transform:scale(.97);box-shadow:var(--clay-shadow-press-coral)}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.pager button{min-height:44px;border:0;background:var(--bg-raised);border-radius:var(--radius-btn);padding:7px 16px;font-weight:800;font-size:13px;color:var(--text-strong);box-shadow:var(--clay-shadow-light)}
.pager button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.pager .pg-info{font-size:13px;color:var(--text-muted);font-weight:700}

/* ===== 加载骨架 ===== */
.sk{display:flex;flex-direction:column;gap:12px}
.sk-card{border:2px solid var(--border-chip);border-radius:var(--radius-card);padding:16px;display:flex;gap:14px}
.sk-line{height:14px;border-radius:7px;background:linear-gradient(90deg,#ECE9F4 25%,#F7F5FB 50%,#ECE9F4 75%);background-size:400% 100%;animation:shimmer 1.2s infinite}
.sk-line.w60{width:60%}.sk-line.w90{width:90%}.sk-line.w40{width:40%}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}

/* ===== 分区标题 / 卡片操作区（task05，仅复用既有 token）===== */
.tpl-sec{margin-top:6px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sec-head h2{font-size:16.5px;font-weight:900;color:var(--text-strong);display:flex;align-items:center;gap:8px}
.sec-cap{font-size:12px;color:var(--text-muted);font-weight:600}
.cp-actions{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px 16px;flex-shrink:0}
.cp-btn{border:0;border-radius:var(--radius-btn);background:var(--cta-coral);color:var(--cta-text);font-weight:900;font-size:13px;min-height:44px;padding:8px 18px;box-shadow:var(--clay-shadow-coral);white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.cp-btn:hover{transform:translateY(-2px)}
.cp-btn:active{transform:scale(.97);box-shadow:var(--clay-shadow-press-coral)}
.cp-btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.cp-btn.ghost{background:var(--bg-raised);color:var(--text-strong);box-shadow:var(--clay-shadow-light)}
.cp-remain{font-size:11px;font-weight:800;color:var(--text-strong);text-align:center}
.head-link{margin-left:auto}

/* ===== 成功提示条（本地 toast，仅正向消息；错误提示由 EAPI 全局 toast 承担；z-index 冻结）===== */
.cp-toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:2147483000;display:none;max-width:min(92vw,520px);background:var(--surface-code);border:0;border-radius:var(--radius-btn);padding:10px 16px;font-size:13px;font-weight:800;color:var(--text-on-dark);box-shadow:var(--clay-shadow-raised);text-align:center;word-break:break-word}
.cp-toast.show{display:block}

/* ===== 下单弹窗（task05）===== */
.om-overlay{position:fixed;inset:0;z-index:150;background:rgba(46,42,63,.45);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;padding:16px}
.om-overlay.open{display:flex}
.omodal{width:min(560px,94vw);max-height:86dvh;overflow:auto;background:var(--bg-raised);border:0;border-radius:var(--radius-card);box-shadow:var(--clay-shadow-raised);display:flex;flex-direction:column}
.om-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:2px solid var(--border-chip)}
.om-title{font-size:15.5px;font-weight:900;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.om-x{width:44px;height:44px;flex-shrink:0;border:0;border-radius:var(--radius-btn);background:var(--bg-raised);font-weight:900;color:var(--text-strong);box-shadow:var(--clay-shadow-light)}
.om-body{padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px}
.om-chip{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;border:0;border-radius:var(--radius-pill);padding:3px 10px;font-size:12px;font-weight:800;background:var(--candy-purple-soft);color:var(--text-strong)}
.om-search{display:flex;gap:8px}
.om-search input{flex:1;min-width:0;min-height:44px;border:2px solid transparent;border-radius:var(--radius-input);padding:9px 12px;font:inherit;font-weight:700;background:var(--bg-input);color:var(--text-strong);box-shadow:var(--clay-shadow-input)}
.om-search input:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px}
.pick-list{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow:auto}
.pick-item{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid transparent;border-radius:var(--radius-btn);background:var(--bg-raised);padding:10px 12px;font:inherit;color:var(--text-strong);box-shadow:var(--clay-shadow-light);width:100%}
.pick-item:hover{border-color:var(--clay-lavender)}
.pick-item.on{border-color:var(--cta-coral);box-shadow:var(--clay-shadow-coral)}
.pick-item:disabled{opacity:.5;cursor:not-allowed}
.pick-item .pk-main{flex:1;min-width:0}
.pick-item .pk-name{font-weight:800;font-size:13.5px;color:var(--text-strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-item .pk-sub{font-size:11.5px;color:var(--text-muted);font-weight:600;margin-top:2px}
.pick-item .pk-price{font-weight:900;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--text-strong)}
.om-pager{display:flex;align-items:center;justify-content:center;gap:10px}
.om-pager button{min-height:44px;border:0;background:var(--bg-raised);border-radius:var(--radius-btn);padding:6px 14px;font-weight:800;font-size:12.5px;color:var(--text-strong);box-shadow:var(--clay-shadow-light)}
.om-pager button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.om-pager .pg-info{font-size:12px;color:var(--text-muted);font-weight:700}
.om-rows{border:2px dashed var(--border-chip);border-radius:var(--radius-md);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.om-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700;color:var(--text-strong)}
.om-row b{font-variant-numeric:tabular-nums;color:var(--text-strong);text-align:right;word-break:break-all}
.om-row.total b{font-size:16px;color:var(--page-accent)}
.om-msg{font-size:12.5px;font-weight:800;border-radius:var(--radius-input);padding:8px 12px;display:none}
.om-msg.warn{display:block;background:rgba(255,181,158,.35);color:var(--text-strong)}
.om-msg.err{display:block;background:rgba(198,62,74,.14);color:var(--status-danger)}
.om-note{font-size:11.5px;color:var(--text-muted);font-weight:600}
.om-back{background:none;border:none;font:inherit;font-size:12.5px;font-weight:800;color:#2B2E6E;text-decoration:underline;padding:0;min-height:44px;align-self:flex-start;cursor:pointer}
.om-success{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding:8px 0 4px}
.om-no{font-size:14.5px;font-weight:900;letter-spacing:.02em;background:rgba(125,212,168,.22);border:2px dashed #2E7D4F;border-radius:var(--radius-input);padding:10px 14px;font-variant-numeric:tabular-nums;word-break:break-all;color:var(--text-strong)}
.om-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.om-actions .btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;border:0;background:var(--cta-coral);color:var(--cta-text);font-weight:900;font-size:13.5px;border-radius:var(--radius-btn);padding:9px 20px;box-shadow:var(--clay-shadow-coral);text-decoration:none}
.om-actions .btn:active{transform:scale(.97)}
.om-mini{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;padding:14px 0;font-size:13px;color:var(--text-muted);font-weight:700}
.om-mini .sk-line{width:80%}
.om-mini .ic{width:28px;height:28px}
</style>

      if (url.indexOf("samples/") >= 0) return origFetch(input, init).catch(function () { return new Response("[]", { status: 200, headers: { "Content-Type": "application/json" } }); });
      var out = method === "GET" ? routeLookup(method, url.split(/^[a-z]+:\/\/?[^/]*\/|^[a-z]+:\/\//.test(url) ? url.replace(/^[a-z]+:\/\/[^/]*\//, "/") : url).split("?").length ? urlAfterBase(url) : url) : mutate(method, urlAfterBase(url), body);
      function urlAfterBase(u) { var i = u.indexOf("/api/"); return i >= 0 ? u.slice(i) : u; }
      if (out.status === 404) return Promise.resolve(new Response(JSON.stringify({ code: "40400", message: "not found", data: null }), { status: 404, headers: { "Content-Type": "application/json" } }));
      return Promise.resolve(new Response(JSON.stringify({ code: 0, message: "ok", data: out.data }), { status: 200, headers: { "Content-Type": "application/json" } }));
    }
    return origFetch ? origFetch(input, init) : Promise.reject(new Error("offline: fetch blocked"));
  };
})(window);
</script>
<script>
/* ===== 我的优惠券：GET /api/coupons 真实数据 ===== */
(function () {
  if (!window.EAPI) return;
  if (!EAPI.store.getToken()) { location.replace(EAPI.buildLoginUrl("coupons.html")); return; }

  var PAGE_SIZE = 20;

  var pgInfo = document.getElementById("pgInfo");
  var pgPrev = document.getElementById("pgPrev");

  var curStatus = "unused";
  var curPage = 1;

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function showSkeleton() {
    stage.innerHTML = "";

  function showError(retry) {
    stage.innerHTML = "";
    var s = el("div", "state");
    var ic = el("div", "st-emoji"); ic.innerHTML = '<svg class="ic" aria-hidden="true"><use href="#ic-warning"/></svg>';
    s.appendChild(ic);
    s.appendChild(el("h3", "", "优惠券加载失败"));
    s.appendChild(el("p", "", "网络开小差了，请稍后重试"));
    var b = el("button", "btn", "重试");
    b.addEventListener("click", retry);
    s.appendChild(b);
    stage.appendChild(s);
    pager.style.display = "none";
  }
  function showEmpty() {
    stage.innerHTML = "";
    var s = el("div", "state");
    var label = curStatus === "unused" ? "可使用" : curStatus === "used" ? "已使用" : "已过期";
    var ic = el("div", "st-emoji"); ic.innerHTML = '<svg class="ic" aria-hidden="true"><use href="#ic-info"/></svg>';

  /* face_value 语义：cash=金额(元)；discount=折扣率(0.8→8折)；trial/gift=兑换类 */
  function faceText(c) {
    var v = Number(c.face_value) || 0;
    if (c.coupon_type === "discount") {
      var zhe = Math.round(v * 1000) / 100; // 0.85 → 8.5
      return (zhe % 1 === 0 ? zhe.toFixed(0) : zhe.toFixed(1)) + "折";
    }
    if (c.coupon_type === "trial") return "试用";

    return "¥" + v.toLocaleString("zh-CN", { maximumFractionDigits: 2 });
  }
  function minText(c) {
    var m = Number(c.min_spend) || 0;
    return m > 0 ? "满 ¥" + m.toLocaleString("zh-CN", { maximumFractionDigits: 2 }) + " 可用" : "无门槛";

  function d10(s) { return s ? String(s).slice(0, 10) : ""; }

  var STATUS_LABEL = { unused: "可使用", used: "已使用", expired: "已过期" };

  function renderList(data) {

      card.appendChild(body);
      card.appendChild(el("span", "cp-status " + c.status, STATUS_LABEL[c.status] || c.status));
      if (c.status === "unused") {

      .then(function (data) {

  document.querySelectorAll(".tab").forEach(function (btn) {

    });
  });
  pgPrev.addEventListener("click", function () { if (curPage > 1) load(curStatus, curPage - 1); });

  /* task05：领券/下单成功后由领券区/下单弹窗广播 cp:refresh，静默刷新当前 tab 与角标 */
  window.addEventListener("cp:refresh", function () { load(curStatus, 1); });

  load("unused", 1);
})();
</script>
<script>
/* ===== task05：领券中心（GET /api/coupons/templates + POST /api/trade/coupon/receive）
   + 下单真实闭环（GET /api/series → GET /api/series/{id}/cohorts → POST /api/trade/order，
   必带 Idempotency-Key 请求头，成功展示 order_no）。

   重复领取：服务端幂等（code=0 返回原券记录，非错误码）→ 以已持券集合做诚实提示。 ===== */
(function () {
  if (!window.EAPI) return;
  if (!EAPI.store.getToken()) return; // 未登录跳转由主 IIFE 处理

  /* ---------- 小工具 ---------- */
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function fmt(v) { return (Number(v) || 0).toLocaleString("zh-CN", { maximumFractionDigits: 2 }); }
  function d10(s) { return s ? String(s).slice(0, 10) : ""; }
  var TYPE_LABEL = { cash: "现金券", discount: "折扣券", trial: "试用券", gift: "赠券" };
  var ORDER_STATUS_LABEL = { pending: "待支付", paid: "已支付", completed: "已完成", cancelled: "已取消", partial_refunded: "部分退款", refunded: "已退款" };
  function faceText(c) {
    var v = Number(c.face_value) || 0;
    if (c.coupon_type === "discount") {
      var zhe = Math.round(v * 1000) / 100;
      return (zhe % 1 === 0 ? zhe.toFixed(0) : zhe.toFixed(1)) + "折";
    }
    if (c.coupon_type === "trial") return "试用";
    if (c.coupon_type === "gift") return "赠券";
    return "¥" + fmt(v);
  }
  function minText(c) {
    var m = Number(c.min_spend) || 0;
    return m > 0 ? "满 ¥" + fmt(m) + " 可用" : "无门槛";
  }
  function isExpired(t) {
    try { return t.valid_to ? (new Date(t.valid_to).getTime() < Date.now()) : false; } catch (e) { return false; }
  }

  /* 本地 toast：仅正向/信息提示；接口错误由 EAPI 全局 toast 或弹窗内 msg 承担，避免重复 */
  var toastEl = null, toastTimer = null;
  function toast(msg) {
    if (!toastEl) {
      toastEl = el("div", "cp-toast");
      toastEl.setAttribute("role", "status");
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 3200);
  }

  /* ---------- 领券中心 ---------- */
  var tplStage = document.getElementById("tplStage");

  function tplSkeleton() {
    tplStage.innerHTML = "";
    var box = el("div", "sk");
    for (var i = 0; i < 2; i++) {
      var c = el("div", "sk-card");

      r.style.cssText = "flex:1;display:flex;flex-direction:column;gap:8px;justify-content:center";
      r.appendChild(el("div", "sk-line w90"));
      r.appendChild(el("div", "sk-line w60"));
      c.appendChild(r);
      box.appendChild(c);
    }
    tplStage.appendChild(box);
  }
  function tplError(retry) {
    tplStage.innerHTML = "";
    var s = el("div", "state");
    var ic = el("div", "st-emoji"); ic.innerHTML = '<svg class="ic" aria-hidden="true"><use href="#ic-warning"/></svg>';
    s.appendChild(ic);
    s.appendChild(el("h3", "", "可领券列表加载失败"));
    s.appendChild(el("p", "", "网络开小差了，请稍后重试"));
    var b = el("button", "btn", "重试");
    b.addEventListener("click", retry);
    s.appendChild(b);
    tplStage.appendChild(s);
  }
  function tplEmpty() {
    tplStage.innerHTML = "";
    var s = el("div", "state");
    var ic = el("div", "st-emoji"); ic.innerHTML = '<svg class="ic" aria-hidden="true"><use href="#ic-info"/></svg>';
    s.appendChild(ic);
    s.appendChild(el("h3", "", "暂无可领的优惠券"));
    s.appendChild(el("p", "", "新券上线后会第一时间出现在这里"));
    tplStage.appendChild(s);

  function renderTemplates(list) {
    tplStage.innerHTML = "";
    var wrap = el("div", "cp-list");
    (list || []).forEach(function (t) {
      var card = el("article", "cp-card");
      card.setAttribute("data-type", t.coupon_type || "cash");
      var left = el("div", "cp-left");
      left.appendChild(el("div", "cp-val", faceText(t)));
      left.appendChild(el("div", "cp-min", minText(t)));
      var body = el("div", "cp-body");
      body.appendChild(el("div", "cp-name", t.coupon_name || "未命名优惠券"));
      var m1 = el("div", "cp-meta");
      m1.appendChild(document.createTextNode("类型 " + (TYPE_LABEL[t.coupon_type] || t.coupon_type || "—") + " · 有效期 " + d10(t.valid_from) + " ~ " + d10(t.valid_to)));
      body.appendChild(m1);
      var total = Number(t.total_count);
      /* Coupon-Unlimited（Owner 方案 A）：total_count === -1 = 平台库存不限量——

      var unlimited = total === -1;
      var remain = unlimited ? Infinity : Math.max(0, (total || 0) - (Number(t.received_count) || 0));
      var m2 = el("div", "cp-meta");
      m2.appendChild(document.createTextNode(
        (unlimited ? "不限量 · 已领 " + (Number(t.received_count) || 0) + " 张"
                    : "剩余 " + remain + " / " + (total || 0) + " 张")
        + " · 每人限领 " + (t.per_user_limit != null ? t.per_user_limit : 1) + " 张"));

        btn = el("button", "cp-btn", "已过期");
        btn.disabled = true;

        btn = el("button", "cp-btn", "立即领取");

        btn.addEventListener("click", function () { onReceive(t, btn); });
      }
      act.appendChild(btn);
      card.appendChild(left);
      card.appendChild(body);
      card.appendChild(act);
      wrap.appendChild(card);
    });
    tplStage.appendChild(wrap);
  }

  /* 已持券模板集合（ coupon_template_id → true ）：重复领取的诚实提示依据。
     必须在领券 POST 之前取快照（否则新领记录会污染判重）；预取失败置空缓存允许重试。 */
  var heldPromise = null;
  function ensureHeld() {
    if (heldPromise) return heldPromise;
    heldPromise = (function () {
      var set = {}, page = 1;
      function step() {
        return EAPI.get("/api/coupons?page=" + page + "&page_size=100").then(function (data) {
          (data && data.items ? data.items : []).forEach(function (c) { set[c.coupon_template_id] = true; });
          var total = (data && data.total) || 0;
          if (page * 100 < total && page < 10) { page += 1; return step(); }
          return set;
        });
      }
      return step();
    })().catch(function () { heldPromise = null; return null; }); // 预取失败不阻塞领取（POST 本身幂等），仅退化为无法预判重复
    return heldPromise;
  }

  function refreshAfterChange() {
    try { window.dispatchEvent(new CustomEvent("cp:refresh")); } catch (e) {}
    loadTemplates(false);
  }

  function loadTemplates(showSkeleton) {
    if (showSkeleton) tplSkeleton();
    EAPI.get("/api/coupons/templates")
      .then(function (data) {
        if (!data || !data.length) { tplEmpty(); return; }
        renderTemplates(data);
      })
      .catch(function () { tplError(function () { loadTemplates(true); }); });
  }

  function onReceive(t, btn) {
    var old = btn.textContent;
    btn.disabled = true;
    btn.textContent = "领取中…";
    ensureHeld().then(function (setBefore) {
      /* setBefore = 领取前的已持券快照（POST 前解析完成），dup 判定才诚实 */
      return EAPI.post("/api/trade/coupon/receive", { coupon_template_id: t.coupon_template_id }).then(function (coupon) {
        var dup = !!(setBefore && setBefore[t.coupon_template_id]);
        if (setBefore) setBefore[t.coupon_template_id] = true;
        btn.textContent = "已领取";
        var no = coupon && coupon.coupon_id != null ? "#" + coupon.coupon_id : "";
        toast(dup
          ? "该券已领取过：服务端幂等返回原券记录 " + no
          : "领取成功 " + no + "，可在「可使用」中查看");
        refreshAfterChange();
      });
    }).catch(function () {
      /* 错误提示由 EAPI 全局 toast（含 40920 已领完等真实错误码文案），这里只还原按钮 */
      btn.disabled = false;
      btn.textContent = old;
    });
  }

  /* ---------- 下单弹窗 ---------- */
  var overlay = document.getElementById("omOverlay");
  var omBody = document.getElementById("omBody");
  var omTitle = document.getElementById("omTitle");
  var omClose = document.getElementById("omClose");
  var flow = null;

  function newIdemKey() {
    try { if (window.crypto && typeof window.crypto.randomUUID === "function") return "web-" + window.crypto.randomUUID(); } catch (e) {}
    return "web-" + Date.now() + "-" + String(Math.floor(Math.random() * 1e8));
  }
  function mkErr(status, message, payload) {
    var e = new Error(message || "请求失败");
    e.status = status;
    e.body = payload;
    return e;
  }
  function errCode(err) { return err && err.body && err.body.code != null ? String(err.body.code) : ""; }

  /* 带自定义头的 POST（下单必须 Idempotency-Key；EAPI.post 不支持额外头）。
     shell 解包 / 401 语义与 EAPI.parseResponse 对齐；401 → EAPI.logout() 跳登录。 */
  function postWithHeaders(path, payload, extra) {
    var headers = { "Content-Type": "application/json" };
    var k;
    for (k in (extra || {})) { if (Object.prototype.hasOwnProperty.call(extra, k)) headers[k] = extra[k]; }
    var t = EAPI.store.getToken();
    if (t) headers.Authorization = "Bearer " + t;
    var ctrl = (typeof AbortController === "function") ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, 20000) : null;
    return fetch((EAPI.BASE || "") + path, {
      method: "POST",
      headers: headers,
      body: JSON.stringify(payload),
      signal: ctrl ? ctrl.signal : undefined,
    }).then(function (resp) {
      if (timer !== null) clearTimeout(timer);
      return resp.text().then(function (text) {
        var json = null;
        try { json = text ? JSON.parse(text) : null; } catch (e) {}
        if (resp.status === 401) { EAPI.logout(); throw mkErr(resp.status, "登录已过期，请重新登录", json); }
        if (!resp.ok) throw mkErr(resp.status, (json && json.message) || ("HTTP " + resp.status), json);
        if (json && typeof json === "object" && !Array.isArray(json) && json.code !== undefined) {
          if (json.code === 0) return json.data;
          throw mkErr(resp.status, json.message || ("请求失败（code=" + json.code + "）"), json);
        }
        return json;
      });
    }, function (e) {
      if (timer !== null) clearTimeout(timer);
      if (ctrl && ctrl.signal && ctrl.signal.aborted) throw mkErr(0, "下单请求超时（20s），请重试");
      throw mkErr(0, "网络错误，请稍后重试");
    });
  }

  function miniSkeleton() {
    var box = el("div", "om-mini");
    for (var i = 0; i < 3; i++) box.appendChild(el("div", "sk-line"));
    return box;
  }
  function miniState(iconHtml, title, sub, retry) {
    var box = el("div", "om-mini");
    var ic = el("div", "");
    ic.innerHTML = iconHtml;
    box.appendChild(ic);
    box.appendChild(el("div", "", title));
    if (sub) box.appendChild(el("div", "", sub));
    if (retry) {
      var b = el("button", "cp-btn ghost", "重试");
      b.addEventListener("click", retry);
      box.appendChild(b);
    }
    return box;
  }
  function couponChip(c) { return el("span", "om-chip", (c.coupon_name || "优惠券") + " · " + faceText(c) + " · " + minText(c)); }

  function openModal(coupon) {
    if (!EAPI.store.getToken()) { location.replace(EAPI.buildLoginUrl("coupons.html")); return; }
    flow = { coupon: coupon, step: "series", kw: "", page: 1, series: null, cohort: null, order: null, submitting: false, idemKey: newIdemKey() };
    overlay.classList.add("open");
    renderModal();
  }
  function closeModal() {
    if (flow && flow.submitting) return; // 提交中禁止关闭（防重复下单：幂等键随弹窗会话持有）
    overlay.classList.remove("open");
    omBody.innerHTML = "";
    flow = null;
  }

  /* 前端抵扣预估（与服务端 _compute_discount 同语义；仅展示用，实付以服务端核算为准） */
  function estimate(price, c) {
    if (!c) return 0;
    var v = Number(c.face_value) || 0;
    if (c.coupon_type === "discount") return v > 0 ? Math.round(price * (1 - v) * 100) / 100 : 0;
    if (c.coupon_type === "trial" || c.coupon_type === "gift") return 0;
    return v;
  }

  function renderModal() {
    if (!flow) return;
    omTitle.textContent = "使用优惠券下单 · " + (flow.coupon.coupon_name || "优惠券");
    omBody.innerHTML = "";
    if (flow.step === "series") renderSeriesStep();
    else if (flow.step === "cohorts") renderCohortsStep();
    else if (flow.step === "confirm") renderConfirmStep();
    else renderSuccessStep();
  }

  /* step 1：选课程系列（GET /api/series，仅展示 on_sale） */
  function renderSeriesStep() {
    omBody.appendChild(couponChip(flow.coupon));
    var search = el("div", "om-search");
    var inp = el("input");
    inp.type = "search";
    inp.placeholder = "输入课程系列关键词（如：编程）";
    inp.setAttribute("aria-label", "课程系列关键词");
    inp.value = flow.kw;
    var sb = el("button", "cp-btn", "搜索");
    search.appendChild(inp);
    search.appendChild(sb);
    omBody.appendChild(search);
    var box = el("div", "");
    omBody.appendChild(box);
    function doSearch() { flow.kw = inp.value.trim(); flow.page = 1; loadSeries(box); }
    sb.addEventListener("click", doSearch);
    inp.addEventListener("keydown", function (e) { if ((e.key || "") === "Enter") doSearch(); });
    loadSeries(box);
  }
  function loadSeries(box) {
    box.innerHTML = "";
    box.appendChild(miniSkeleton());
    var q = "?page=" + flow.page + "&page_size=8" + (flow.kw ? "&keyword=" + encodeURIComponent(flow.kw) : "");
    EAPI.get("/api/series" + q).then(function (data) {
      var items = (data && data.items ? data.items : []).filter(function (s) { return (s.sale_status || "") === "on_sale"; });
      var total = (data && data.total) || 0;
      box.innerHTML = "";
      if (!items.length) {
        box.appendChild(miniState('<svg class="ic" aria-hidden="true"><use href="#ic-magnifying-glass"/></svg>', "没有可下单的课程系列", flow.kw ? "换个关键词试试" : "课程系列暂未上架在售"));
        return;
      }
      var list = el("div", "pick-list");
      items.forEach(function (s) {
        var it = el("button", "pick-item");
        it.type = "button";
        var main = el("div", "pk-main");
        main.appendChild(el("div", "pk-name", s.series_name || ("系列 #" + s.id)));
        main.appendChild(el("div", "pk-sub", "在售 · 班次价 " + fmt(s.min_price) + " 元起"));
        it.appendChild(main);
        it.appendChild(el("span", "pk-price", "¥" + fmt(s.min_price)));
        it.addEventListener("click", function () {
          flow.series = s;
          flow.cohort = null;
          flow.step = "cohorts";
          renderModal();
        });
        list.appendChild(it);
      });
      box.appendChild(list);
      if (total > 8) {
        var pg = el("div", "om-pager");
        var prev = el("button", "", "‹ 上一页"); prev.type = "button";
        var info = el("span", "pg-info", "第 " + flow.page + " 页 · 共 " + total + " 个系列");
        var next = el("button", "", "下一页 ›"); next.type = "button";
        prev.disabled = flow.page <= 1;
        next.disabled = flow.page * 8 >= total;
        prev.addEventListener("click", function () { if (flow.page > 1) { flow.page -= 1; loadSeries(box); } });
        next.addEventListener("click", function () { if (flow.page * 8 < total) { flow.page += 1; loadSeries(box); } });
        pg.appendChild(prev); pg.appendChild(info); pg.appendChild(next);
        box.appendChild(pg);
      }
    }).catch(function (err) {
      box.innerHTML = "";
      box.appendChild(miniState('<svg class="ic" aria-hidden="true"><use href="#ic-warning"/></svg>', "课程系列加载失败", (err && err.message) || "网络错误", function () { loadSeries(box); }));
    });
  }

  /* step 2：选班次（GET /api/series/{id}/cohorts，yn=1 且未满员可选） */
  function renderCohortsStep() {
    omBody.appendChild(couponChip(flow.coupon));
    var back = el("button", "om-back", "‹ 重选课程系列");
    back.type = "button";
    back.addEventListener("click", function () { flow.step = "series"; renderModal(); });
    omBody.appendChild(back);
    omBody.appendChild(el("div", "om-chip", (flow.series.series_name || ("系列 #" + flow.series.id))));
    var box = el("div", "");
    omBody.appendChild(box);
    loadCohorts(box);
  }
  function loadCohorts(box) {
    box.innerHTML = "";
    box.appendChild(miniSkeleton());
    EAPI.get("/api/series/" + encodeURIComponent(flow.series.id) + "/cohorts").then(function (data) {
      var items = (data && data.items ? data.items : []).filter(function (c) { return Number(c.yn) === 1; });
      box.innerHTML = "";
      if (!items.length) {
        box.appendChild(miniState('<svg class="ic" aria-hidden="true"><use href="#ic-info"/></svg>', "该系列暂无可报名班次", "可返回重选其它课程系列"));
        return;
      }
      var list = el("div", "pick-list");
      items.forEach(function (c) {
        var full = Number(c.current_student_count) >= Number(c.max_student_count);
        var it = el("button", "pick-item");
        it.type = "button";
        if (full) it.disabled = true;
        var seats = Math.max(0, Number(c.max_student_count) - Number(c.current_student_count));
        var main = el("div", "pk-main");
        main.appendChild(el("div", "pk-name", c.cohort_name || c.cohort_code || ("班次 #" + c.id)));
        main.appendChild(el("div", "pk-sub", (c.cohort_code || "—") + " · " + d10(c.start_date) + " 开班 · 余位 " + seats + (full ? "（已满员）" : "")));
        it.appendChild(main);
        it.appendChild(el("span", "pk-price", "¥" + fmt(c.sale_price)));
        it.addEventListener("click", function () {
          if (full) return;
          flow.cohort = c;
          flow.step = "confirm";
          renderModal();
        });
        list.appendChild(it);
      });
      box.appendChild(list);
    }).catch(function (err) {
      box.innerHTML = "";
      box.appendChild(miniState('<svg class="ic" aria-hidden="true"><use href="#ic-warning"/></svg>', "班次加载失败", (err && err.message) || "网络错误", function () { loadCohorts(box); }));
    });
  }

  /* step 3：确认 + 提交订单（POST /api/trade/order，Idempotency-Key） */
  function renderConfirmStep() {
    omBody.appendChild(couponChip(flow.coupon));
    var back = el("button", "om-back", "‹ 重选班次");
    back.type = "button";
    back.addEventListener("click", function () { flow.step = "cohorts"; renderModal(); });
    omBody.appendChild(back);

    var price = Number(flow.cohort.sale_price) || 0;
    var cp = flow.coupon;
    var est = estimate(price, cp);
    var minSpend = Number(cp.min_spend) || 0;
    var belowMin = minSpend > 0 && price < minSpend;
    var payable = Math.max(0, price - est);

    var rows = el("div", "om-rows");
    function row(label, val, cls) {
      var r = el("div", "om-row" + (cls ? " " + cls : ""));
      r.appendChild(el("span", "", label));
      r.appendChild(el("b", "", val));
      return r;
    }
    rows.appendChild(row("课程系列", flow.series.series_name || ("系列 #" + flow.series.id)));
    rows.appendChild(row("班次", (flow.cohort.cohort_name || flow.cohort.cohort_code || ("班次 #" + flow.cohort.id))));
    rows.appendChild(row("班次价格", "¥" + fmt(price)));
    rows.appendChild(row("优惠券抵扣（预估）", "-" + fmt(est) + "（" + (TYPE_LABEL[cp.coupon_type] || cp.coupon_type || "—") + "）"));
    rows.appendChild(row("预估实付", "¥" + fmt(payable), "total"));
    omBody.appendChild(rows);

    if (belowMin) {
      var warn = el("div", "om-msg warn");
      warn.textContent = "该券满 ¥" + fmt(minSpend) + " 可用，当前班次 ¥" + fmt(price) + " 未达门槛，请返回选择价格更高的班次";
      omBody.appendChild(warn);
    }
    var note = el("div", "om-note");
    note.textContent = "抵扣金额为页面预估，以下单接口服务端核算为准（金额服务端重算，防篡改）。下单成功后优惠券立即核销。";
    omBody.appendChild(note);

    var msg = el("div", "om-msg");
    omBody.appendChild(msg);

    var submit = el("button", "cp-btn", belowMin ? "提交订单" : "提交订单（预估实付 ¥" + fmt(payable) + "）");
    submit.style.alignSelf = "center";
    if (belowMin) submit.disabled = true;
    submit.addEventListener("click", function () {
      if (flow.submitting) return;
      flow.submitting = true;
      var old = submit.textContent;
      submit.disabled = true;
      submit.textContent = "提交中…";
      postWithHeaders(
        "/api/trade/order",
        { series_id: flow.series.id, cohort_id: flow.cohort.id, coupon_id: flow.coupon.coupon_id },
        { "Idempotency-Key": flow.idemKey }
      ).then(function (order) {
        flow.order = order;
        flow.submitting = false;
        flow.step = "success";
        refreshAfterChange(); // 券已核销：静默刷新我的券列表与角标
        renderModal();
      }).catch(function (err) {
        flow.submitting = false;
        submit.disabled = false;
        submit.textContent = old;
        msg.className = "om-msg err";
        msg.textContent = ((err && err.message) || "下单失败，请稍后重试") + (errCode(err) ? "（错误码 " + errCode(err) + "）" : "");
      });
    });
    omBody.appendChild(submit);
  }

  /* step 4：成功（展示真实订单号） */
  function renderSuccessStep() {
    var o = flow.order || {};
    var box = el("div", "om-success");
    var okIc = el("div", "");
    okIc.innerHTML = '<svg class="ic" aria-hidden="true" style="width:34px;height:34px"><use href="#ic-check-circle"/></svg>';
    box.appendChild(okIc);
    box.appendChild(el("h3", "", "下单成功"));
    var no = el("div", "om-no", o.order_no || "—");
    no.setAttribute("aria-label", "订单号");
    box.appendChild(no);
    var rows = el("div", "om-rows");
    function row(label, val) {
      var r = el("div", "om-row");
      r.appendChild(el("span", "", label));
      r.appendChild(el("b", "", val));
      return r;
    }
    rows.appendChild(row("课程系列", flow.series.series_name || "—"));
    rows.appendChild(row("班次", flow.cohort.cohort_name || flow.cohort.cohort_code || "—"));
    rows.appendChild(row("订单金额", "¥" + fmt(o.order_amount)));
    rows.appendChild(row("券抵扣", "-" + fmt(o.discount_amount)));
    rows.appendChild(row("实付金额", "¥" + fmt(o.pay_amount)));
    rows.appendChild(row("订单状态", ORDER_STATUS_LABEL[o.status] || o.status || "—"));
    box.appendChild(rows);
    box.appendChild(el("div", "om-note", "优惠券已核销（可在「已使用」查看）；订单可在「个人中心 → 我的订单」跟进支付与售后。"));
    var acts = el("div", "om-actions");
    var go = el("a", "btn", "查看我的订单");
    go.href = "me.html";
    var done = el("button", "cp-btn ghost", "完成");
    done.addEventListener("click", closeModal);
    acts.appendChild(go);
    acts.appendChild(done);
    box.appendChild(acts);
    omBody.appendChild(box);
  }

  omClose.addEventListener("click", closeModal);
  overlay.addEventListener("click", function (e) { if (e.target === overlay) closeModal(); });
  document.addEventListener("keydown", function (e) {
    var k = e.key || "";
    if ((k === "Escape" || k === "Esc") && overlay.classList.contains("open")) closeModal();
  });

  window.couponsOrder = { open: openModal };
  ensureHeld(); // 页面加载即预热已持券快照（重复领取判重依据）
  loadTemplates(true);
})();
</script>
<script>
/* admin 角色显示管理后台入口（对齐 me.html） */
(function () {
  if (!window.EAPI) return;
  var el = document.getElementById("adminEntry");
  if (!el || !EAPI.store.getToken()) return;
  EAPI.get("/api/users/me").then(function (u) {
    if (u && (u.role === "admin" || u.role === "manager")) el.style.display = "";
  }).catch(function () {});
})();
</script>
</body>
