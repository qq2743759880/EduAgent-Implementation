<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
/*
 * Bili-Study Clay Theme, Gate A frozen tokens
 *
 * Icon usage (Phosphor fill, local sprite):
 * <svg class="ic" aria-hidden="true"><use href="#ic-book-open"></use></svg>
 * For an icon-only control, put the accessible name on the control (aria-label or visible text).
 *
 * Token reference, one variable per line:
 * --bg-app: purple-tinted near-white application canvas.
 * --bg-raised: highest neutral surface reserved for dialogs and toasts.
 * --bg-input: subtly tinted recessed input surface.
 * --clay-primary: semantic alias for the approved main clay surface.
 * --clay-moss: approved primary moss green; #2E2A3F contrast is 8.84:1.
 * --clay-lavender: demoted secondary lavender, never the default surface.
 * --clay-sky: course and learning surface.
 * --clay-mint: success, completion, and progress surface.
 * --clay-peach: practice and quiz surface.
 * --clay-pink: favorites and community surface.
 * --clay-lemon: warm accent for reminders and pending work.
 * --cta-coral: the single saturated primary action color per screen.
 * --cta-text: primary action text; #2E2A3F on #FF7A6B is 5.43:1.
 * --status-active: active and successful state color.
 * --status-pending: pending state color.
 * --status-archived: archived and inactive state color.
 * --status-danger: destructive and error state color.
 * --text-strong: primary ink; intentionally not pure black.
 * --text-muted: secondary ink for supporting text.
 * --text-on-dark: text used on the dark code surface.
 * --surface-code: Markdown code block surface.
 * --focus-ring: high-contrast keyboard focus indicator.
 * --radius-card: L1 card radius.
 * --radius-btn: primary and secondary button radius.
 * --radius-input: input and compact control radius.
 * --radius-pill: pill and badge radius.
 * --radius-icon-tile: icon tile radius.
 * --space-1: 4px spacing unit.
 * --space-2: 8px spacing unit.
 * --space-3: 12px spacing unit.
 * --space-4: 16px spacing unit and minimum clay-to-clay gap.
 * --space-6: 24px spacing unit.
 * --space-8: 32px spacing unit.
 * --space-12: 48px spacing unit.
 * --control-min: minimum 44px interaction target.
 * --control-primary: 54px primary button height within the approved 52-56px range.
 * --motion-fast: 140ms tactile state duration.
 * --ease-clay: restrained ease-out curve for hover and press feedback.
 * --clay-shadow-moss: three-layer moss surface shadow.
 * --clay-shadow-lavender: three-layer secondary lavender surface shadow.
 * --clay-shadow-sky: three-layer sky surface shadow.
 * --clay-shadow-mint: three-layer mint surface shadow.
 * --clay-shadow-peach: three-layer peach surface shadow.
 * --clay-shadow-pink: three-layer pink surface shadow.
 * --clay-shadow-lemon: three-layer lemon surface shadow.
 * --clay-shadow-coral: three-layer coral action shadow.
 * --clay-shadow-raised: green-hued L2 shadow for raised neutral surfaces.
 * --clay-shadow-light: green-hued single-layer shadow for clay-light regions.
 * --clay-shadow-press-moss: compressed moss shadow for pressed controls.
 * --clay-shadow-press-coral: compressed coral shadow for pressed primary actions.
 * --clay-shadow-input: inset moss shadow for recessed fields.
 * --clay-shadow-input-focus: inset moss shadow plus visible focus halo.
 * --layer-base: normal document flow.
 * --layer-sticky: sticky navigation layer.
 * --layer-dropdown: menu and popover layer.
 * --layer-overlay: modal scrim layer.
 * --layer-dialog: dialog layer.
 * --layer-toast: toast and urgent feedback layer.
 *
 * L1 page overrides belong in a .page-<name> namespace. Example:
 * .page-dashboard { --page-card-gap: var(--space-6); }
 * Do not place page-specific selectors outside that namespace.
 */

:root {
  --bg-app: #F7F5FB;
  --bg-raised: #FFFFFF;
  --bg-input: #F7FAF4;
  --clay-primary: var(--clay-moss);
  --clay-moss: #B8D8A8;
  --clay-lavender: #B8A6FF;
  --clay-sky: #9EC9F0;
  --clay-mint: #7DD4A8;
  --clay-peach: #FFB59E;
  --clay-pink: #F5B8D0;
  --clay-lemon: #F5D77A;
  --cta-coral: #FF7A6B;
  --cta-text: #2E2A3F;
  --status-active: #7DD4A8;
  --status-pending: #F5D77A;
  --status-archived: #C9B5FF;
  --status-danger: #C63E4A;
  --text-strong: #2E2A3F;
  --text-muted: #6B6580;
  --text-on-dark: #F7F5FB;
  --surface-code: #2E2A3F;
  --focus-ring: #453C66;

  --radius-card: 28px;
  --radius-btn: 18px;
  --radius-input: 16px;
  --radius-pill: 999px;
  --radius-icon-tile: 20px;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --control-min: 44px;
  --control-primary: 54px;

  --motion-fast: 140ms;
  --ease-clay: cubic-bezier(.25, 1, .5, 1);

  --clay-shadow-moss:
    8px 8px 24px rgba(78, 126, 66, .30),
    inset -6px -6px 16px rgba(78, 126, 66, .22),
    inset 6px 6px 16px rgba(255, 254, 252, .58);
  --clay-shadow-lavender:
    8px 8px 24px rgba(126, 105, 181, .28),
    inset -6px -6px 16px rgba(126, 105, 181, .20),
    inset 6px 6px 16px rgba(255, 254, 252, .56);
  --clay-shadow-sky:
    8px 8px 24px rgba(80, 142, 196, .30),
    inset -6px -6px 16px rgba(80, 142, 196, .22),
    inset 6px 6px 16px rgba(255, 254, 252, .56);
  --clay-shadow-mint:
    8px 8px 24px rgba(43, 153, 103, .29),
    inset -6px -6px 16px rgba(43, 153, 103, .21),
    inset 6px 6px 16px rgba(255, 254, 252, .56);
  --clay-shadow-peach:
    8px 8px 24px rgba(218, 111, 82, .29),
    inset -6px -6px 16px rgba(218, 111, 82, .21),
    inset 6px 6px 16px rgba(255, 254, 252, .54);
  --clay-shadow-pink:
    8px 8px 24px rgba(188, 99, 137, .28),
    inset -6px -6px 16px rgba(188, 99, 137, .20),
    inset 6px 6px 16px rgba(255, 254, 252, .56);
  --clay-shadow-lemon:
    8px 8px 24px rgba(190, 149, 35, .28),
    inset -6px -6px 16px rgba(190, 149, 35, .20),
    inset 6px 6px 16px rgba(255, 254, 252, .54);
  --clay-shadow-coral:
    8px 8px 24px rgba(214, 82, 70, .31),
    inset -6px -6px 16px rgba(214, 82, 70, .23),
    inset 6px 6px 16px rgba(255, 254, 252, .45);
  --clay-shadow-raised: 12px 12px 32px rgba(78, 126, 66, .22);
  --clay-shadow-light: 6px 8px 20px rgba(78, 126, 66, .18);
  --clay-shadow-press-moss:
    4px 4px 12px rgba(78, 126, 66, .26),
    inset -3px -3px 8px rgba(78, 126, 66, .18),
    inset 3px 3px 8px rgba(255, 254, 252, .46);
  --clay-shadow-press-coral:
    4px 4px 12px rgba(214, 82, 70, .27),
    inset -3px -3px 8px rgba(214, 82, 70, .19),
    inset 3px 3px 8px rgba(255, 254, 252, .38);
  --clay-shadow-input:
    inset 3px 3px 8px rgba(78, 126, 66, .20),
    inset -3px -3px 8px rgba(255, 254, 252, .88);
  --clay-shadow-input-focus:
    inset 3px 3px 8px rgba(78, 126, 66, .24),
    inset -3px -3px 8px rgba(255, 254, 252, .92),
    0 0 0 3px rgba(69, 60, 102, .22);

  --layer-base: 0;
  --layer-sticky: 100;
  --layer-dropdown: 300;
  --layer-overlay: 700;
  --layer-dialog: 800;
  --layer-toast: 1000;
}

.ic {
  display: inline-block;
  flex: 0 0 auto;
  width: 1.25em;
  height: 1.25em;
  overflow: visible;
  color: currentColor;
  fill: currentColor;
  vertical-align: -.2em;
}

.clay-card {
  min-width: 0;
  border: 0;
  border-radius: var(--radius-card);
  color: var(--text-strong);
  background: var(--clay-primary);
  box-shadow: var(--clay-shadow-moss);
}

.clay-btn-primary,
.clay-btn-soft {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-width: var(--control-min);
  min-height: var(--control-min);
  border: 0;
  border-radius: var(--radius-btn);
  padding-inline: var(--space-6);
  color: var(--text-strong);
  font: inherit;
  font-weight: 800;
  line-height: 1;
  text-decoration: none;
  cursor: pointer;
  touch-action: manipulation;
  transition:
    transform var(--motion-fast) var(--ease-clay),
    box-shadow var(--motion-fast) var(--ease-clay),
    background-color var(--motion-fast) var(--ease-clay);
}

.clay-btn-primary {
  min-height: var(--control-primary);
  color: var(--cta-text);
  background: var(--cta-coral);
  box-shadow: var(--clay-shadow-coral);
}

.clay-btn-soft {
  background: var(--clay-primary);
  box-shadow: var(--clay-shadow-light);
}

.clay-btn-primary:hover,
.clay-btn-soft:hover {
  transform: translateY(-2px);
}

.clay-btn-primary:active,
.clay-btn-soft:active {
  transform: scale(.97);
}

.clay-btn-primary:active {
  box-shadow: var(--clay-shadow-press-coral);
}

.clay-btn-soft:active {
  box-shadow: var(--clay-shadow-press-moss);
}

.clay-btn-primary:disabled,
.clay-btn-soft:disabled,
.clay-btn-primary[aria-disabled="true"],
.clay-btn-soft[aria-disabled="true"] {
  opacity: .52;
  cursor: not-allowed;
  transform: none;
}

.clay-pill {
  display: inline-flex;
  align-items: center;
  min-height: 32px;
  gap: var(--space-1);
  border-radius: var(--radius-pill);
  padding: var(--space-1) var(--space-3);
  color: var(--text-strong);
  background: var(--clay-lemon);
  box-shadow: 3px 4px 10px rgba(190, 149, 35, .21);
  font-size: .8125rem;
  font-weight: 800;
}

.clay-input {
  width: 100%;
  min-height: var(--control-primary);
  border: 0;
  border-radius: var(--radius-input);
  padding: var(--space-3) var(--space-4);
  color: var(--text-strong);
  background: var(--bg-input);
  box-shadow: var(--clay-shadow-input);
  font: inherit;
}

.clay-input::placeholder {
  color: var(--text-muted);
  opacity: 1;
}

.clay-input:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 2px;
  box-shadow: var(--clay-shadow-input-focus);
}

.clay-bubble-user,
.clay-bubble-ai {
  max-width: min(80%, 72ch);
  overflow-wrap: anywhere;
  border-radius: 24px 24px 24px 8px;
  padding: var(--space-4) 20px;
  color: var(--text-strong);
}

.clay-bubble-user {
  margin-inline-start: auto;
  border-radius: 24px 24px 8px 24px;
  background: var(--clay-peach);
  box-shadow: var(--clay-shadow-peach);
}

.clay-bubble-ai {
  background: var(--clay-primary);
  box-shadow: var(--clay-shadow-moss);
}

.clay-nav {
  position: relative;
  z-index: var(--layer-sticky);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  min-height: 64px;
  border-radius: var(--radius-card);
  padding: var(--space-2) var(--space-4);
  color: var(--text-strong);
  background: var(--bg-raised);
  box-shadow: var(--clay-shadow-raised);
}

.clay-nav :where(a, button) {
  min-width: var(--control-min);
  min-height: var(--control-min);
}

.clay-nav :where(.active, [aria-current="page"]) {
  color: var(--cta-text);
  background: var(--cta-coral);
}

.clay-card-placeholder {
  position: relative;
  min-height: 144px;
  border: 0;
  border-radius: var(--radius-card);
  padding: var(--space-6);
  color: var(--text-strong);
  background: var(--clay-lemon);
  box-shadow: var(--clay-shadow-lemon);
}

.clay-card-placeholder[data-state="closed"] {
  background: var(--clay-lavender);
  box-shadow: var(--clay-shadow-lavender);
}

.clay-card-placeholder[data-state="forbidden"] {
  outline: 3px solid var(--status-archived);
  outline-offset: -3px;
  background: var(--bg-raised);
  box-shadow: var(--clay-shadow-raised);
}

.clay-card-placeholder[data-state="error"] {
  outline: 3px solid var(--status-danger);
  outline-offset: -3px;
  background: var(--clay-peach);
  box-shadow: var(--clay-shadow-peach);
}

.clay-card :where(pre, code),
.clay-bubble-ai :where(pre, code),
.clay-bubble-user :where(pre, code) {
  color: var(--text-on-dark);
  background: var(--surface-code);
}

.clay-card pre,
.clay-bubble-ai pre,
.clay-bubble-user pre {
  overflow: auto;
  border-radius: var(--radius-input);
  padding: var(--space-4);
}

:where(.clay-btn-primary, .clay-btn-soft, .clay-nav a, .clay-nav button):focus-visible {
  outline: 3px solid var(--focus-ring);
  outline-offset: 3px;
}

/* Admin fallback: lower visual depth without changing component geometry. */
.clay-light {
  --radius-card: 24px;
}

.clay-card.clay-light,
.clay-light .clay-card {
  box-shadow: var(--clay-shadow-light);
}

.clay-light :where(table, .table, .chart, [data-chart], [data-table]) {
  border-radius: var(--radius-input);
  background: var(--bg-raised);
  box-shadow: none;
}

@media (prefers-reduced-motion: reduce) {
  .clay-btn-primary,
  .clay-btn-soft {
    transition-duration: .01ms;
  }

  .clay-btn-primary:hover,
  .clay-btn-primary:active,
  .clay-btn-soft:hover,
  .clay-btn-soft:active {
    transform: none;
  }
}

</style>
<title>退款中心 · Bili-Study</title>
<!--
  ============================================================
  退款页（task66）· 真实契约对接（非 MOCK）
  接口契约权威来源 = 后端源码（编辑者已核对）：
    app/domains/trade/refund/router.py     前缀 /api/refunds
    app/domains/trade/refund/schemas.py    RefundCreateInput / Refund / RefundPage
    app/domains/trade/order/router.py      /api/trade/orders（refundable=true）
    app/domains/after_sales/router.py      /api/trade/after_sales/ticket
    app/domains/trade/refund/service.py    金额服务端强制 ≤ 实付（GWT①）
  端点清单（均为真实端点，页面逐一对齐）：
    GET  /api/refunds                    我的退款（倒序，分页 {total,page,page_size,items}）
    POST /api/refunds                    申请退款（refund_type 四枚举 + 金额服务端校验）
    POST /api/refunds/{refund_id}/cancel 撤销退款（仅 pending）
    GET  /api/trade/orders?refundable=true 可退款订单（paid/completed/partial_refunded）
    POST /api/trade/after_sales/ticket   反馈/退款工单（ticket_type=refund/appeal）
  金额红线：退款金额须 ≤ 实付；前端做友好提示，服务端强制校验兜底（不信任前端，GWT①）。
  ============================================================
-->
<style>
  /* ===== PACK-B 黏土重塑（2026-09-21）：令牌唯源 /theme.css?v=7fed87f。
     G8 清债：移除 Google Fonts 外链（@import Baloo 2）→ 本地系统字体栈（§7.2 离线优先）。
     三层分离：仅动视觉层——id/data-cancel/表单结构/事件绑定不动；#flash z-index 2147483001 冻结；
     旧 candy 变量名保留为页内别名(L1)，供脚本内联样式继续解析。 ===== */
  :root{
    --font-head:"PingFang SC","Microsoft YaHei",sans-serif;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --candy-orange:var(--cta-coral); --candy-green:var(--clay-mint); --candy-purple:#5B4FC4;
    --candy-yellow:var(--clay-lemon); --candy-red:var(--status-danger);
    --primary:var(--clay-mint); --primary-strong:#2E7D4F; --primary-soft:rgba(125,212,168,.22);
    --accent:var(--cta-coral); --accent-strong:#D65246; --accent-soft:rgba(255,181,158,.30);
    --secondary:#5B4FC4; --secondary-soft:#EFE9FF;
    --success:#2E7D4F; --warning:var(--clay-lemon); --destructive:var(--status-danger);
    --ink:var(--text-strong); --ink-strong:var(--text-strong); --ink-soft:var(--text-muted); --ink-faint:var(--text-muted);
    --bg:var(--bg-app); --card:var(--bg-raised); --line:rgba(46,42,63,.12); --line-strong:rgba(46,42,63,.18);
    --radius:var(--radius-card); --radius-lg:var(--radius-card); --radius-md:var(--radius-input); --radius-pill:var(--radius-pill);
    --stroke:0;
    --shadow-pop:var(--clay-shadow-light);
    --shadow-md:var(--clay-shadow-light);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);color:var(--text-strong);background-color:var(--bg-app);background-image:radial-gradient(circle at 90% 6%,rgba(255,181,158,.28),transparent 24rem),radial-gradient(circle at 4% 96%,rgba(125,212,168,.20),transparent 22rem);-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px}
  *:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px;border-radius:4px}
  .page{max-width:1060px;margin:0 auto;padding:24px 20px 72px}
  .topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .page-title{font-family:var(--font-head);font-size:28px;font-weight:800;letter-spacing:-.01em;color:var(--text-strong);display:inline-flex;align-items:center;gap:8px}
  .page-title .ic{width:1.05em;height:1.05em;color:var(--text-strong)}
  .doc-badge{font-size:11px;color:#5B4FC4;background:var(--secondary-soft);border:0;padding:3px 10px;border-radius:var(--radius-pill);font-weight:700}
  .subtitle{font-size:.8125rem;color:var(--text-muted);margin-bottom:18px}
  .back{font-size:.8125rem;color:#5B4FC4;text-decoration:none;font-weight:700;margin-left:auto;background:var(--secondary-soft);padding:8px 16px;min-height:44px;display:inline-flex;align-items:center;border-radius:var(--radius-pill);box-shadow:var(--clay-shadow-light)}
  .back:hover{color:#5B4FC4}

  .grid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:start}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}

  .card{background:var(--bg-raised);border:0;border-radius:var(--radius-card);padding:22px;box-shadow:var(--clay-shadow-light)}
  .card h2{font-family:var(--font-head);font-size:20px;font-weight:800;color:var(--text-strong);display:flex;align-items:center;gap:8px;margin-bottom:16px}
  .card h2 .dot{width:12px;height:12px;border-radius:50%}

  /* ===== 表单（input 几何与 JS 校验联动，仅外观调整；≥44px 点击区）===== */
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--text-strong);margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;min-height:44px;padding:10px 12px;border:2px solid transparent;border-radius:var(--radius-input);background:var(--bg-input);color:var(--text-strong);outline:none;box-shadow:var(--clay-shadow-input);transition:box-shadow var(--motion-fast) var(--ease-clay)}
  .field textarea{min-height:88px;resize:vertical}
  .field input:focus,.field select:focus,.field textarea:focus{box-shadow:var(--clay-shadow-input-focus)}
  .field input::placeholder,.field select::placeholder,.field textarea::placeholder{color:var(--text-muted);opacity:1}
  .field .hint{font-size:12px;color:var(--text-muted);margin-top:4px}
  .field .err{font-size:12px;color:var(--status-danger);margin-top:4px;display:none;font-weight:600}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:11px 20px;border:0;border-radius:var(--radius-btn);font-weight:800;font-size:14px;color:var(--text-strong);background:var(--clay-mint);box-shadow:var(--clay-shadow-mint);transition:transform var(--motion-fast) var(--ease-clay),box-shadow var(--motion-fast) var(--ease-clay)}
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.52;cursor:not-allowed;transform:none}
  .btn.ghost{background:#EFE9FF;color:var(--text-strong);box-shadow:var(--clay-shadow-lavender)}
  .btn.warn{background:var(--cta-coral);color:var(--cta-text);box-shadow:var(--clay-shadow-coral)}
  .btn.full{width:100%}

  .pill{display:inline-block;padding:4px 12px;border-radius:var(--radius-pill);font-size:12.5px;font-weight:800}
  .pill.pending{background:var(--clay-lemon);color:var(--text-strong)}
  .pill.approved{background:rgba(158,201,240,.40);color:var(--text-strong)}
  .pill.rejected{background:rgba(198,62,74,.14);color:var(--status-danger)}
  .pill.refunded{background:var(--primary-soft);color:var(--primary-strong)}

  /* ===== 退款列表 ===== */
  .list-empty{text-align:center;padding:34px 10px;color:var(--text-muted);border:2px dashed rgba(46,42,63,.18);border-radius:var(--radius-card);font-size:14px;background:var(--bg-raised)}
  .refund-item{border:0;border-radius:var(--radius-card);padding:16px 18px;margin-bottom:12px;background:#FDFCF6;box-shadow:var(--clay-shadow-light)}
  .refund-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}

    <h1 class="page-title"><svg class="ic" aria-hidden="true"><use href="#ic-info"/></svg> 退款中心</h1>
    <span class="doc-badge">真实接口 · 金额服务端校验</span>
    <a class="back" href="dashboard.html">← 返回学习端</a>
  </div>
  <p class="subtitle">填写订单 → 发起退款（金额须 ≤ 实付，超出会被系统拦截）→ 待处理中可撤销</p>

  <div class="grid">
    <!-- ============ 发起退款 ============ -->
    <section class="card" id="applyCard">
      <h2><span class="dot" style="background:var(--candy-green)"></span>发起退款</h2>
      <form id="applyForm" novalidate>
        <div class="field">
          <label for="orderSel">可退款订单</label>
          <select id="orderSel" required>
            <option value="">— 加载中… —</option>
          </select>
          <div class="hint" id="orderHint">仅展示已支付、可退款的订单</div>
          <div class="err" id="orderErr">请选择一个可退订单</div>
        </div>
        <div class="field">
          <label for="refundType">退款类型</label>
          <select id="refundType" required>
            <option value="">请选择退款类型</option>
            <option value="personal_reason">个人原因</option>
            <option value="course_unsatisfied">课程不满意</option>
            <option value="schedule_conflict">时间冲突</option>
            <option value="duplicate_purchase">重复购买</option>
          </select>
          <div class="err" id="typeErr">请选择退款类型</div>
        </div>
        <div class="field">
          <label for="amount">退款金额（¥）</label>
          <input type="number" id="amount" min="0.01" step="0.01" placeholder="≤ 订单实付金额" required />
          <div class="hint" id="amountHint">可退订单实付上限以所选订单为准</div>
          <div class="err" id="amountErr">金额须在 0.01 ~ 实付金额之间</div>
        </div>
        <div class="field">
          <label for="reason">退款原因</label>
          <textarea id="reason" rows="3" maxlength="2000" placeholder="请简要说明退款原因" required></textarea>
          <div class="err" id="reasonErr">请填写退款原因</div>
        </div>
        <button class="btn warn full" id="applyBtn" type="submit">提交退款申请</button>
      </form>
    </section>

    <!-- ============ 反馈 / 退款工单 ============ -->
    <section class="card">
      <h2><span class="dot" style="background:var(--candy-purple)"></span>问题反馈工单</h2>
      <form id="ticketForm" novalidate>
        <div class="field">

/* task66：退款中心真实数据加载（对接 /api/refunds + /api/trade/orders）。
 * 角色守卫三段（纪律 lesson10）：
 *   1) 本地无 token → 跳 login-register 带 redirect
 *   2) 有 token  → GET /api/auth/me 校验 role=student；admin/manager/teacher → 跳回 dashboard
 *   3) auth/me 失败无法确认身份 → 按未授权跳登录（防 DEBUG 降级绕过）
 * 通过后才调 window.bootRefund() 注入真实数据；无 EAPI 时静默降级演示态。
 */
(function(){
  if(!window.EAPI) return;
  /* task17 修复：本 IIFE 原直接调用 bootRefund 闭包内私有的 flash → ReferenceError: flash is not defined
   *（非 student 角色 / auth/me 失败路径：提示未弹出且其后的跳转 setTimeout 永不注册，页面卡死）。
   * 此处提供等价局部 toast（复用 #flash 元素与既有样式语义，非 alert），不改视觉。 */
  var flash=function(t){ var m=document.getElementById("flash"); if(!m)return;
    m.style.background = t.indexOf("失败")>=0||t.indexOf("超出")>=0 ? "#C63E4A" : "#2E7D4F";
    m.textContent = t; m.style.display="block";
    clearTimeout(flash._t); flash._t = setTimeout(function(){ m.style.display="none"; },3200);
  };
  var loginUrl;
  try{ loginUrl = EAPI.buildLoginUrl(location.pathname+location.search); }catch(e){ loginUrl="login-register.html"; }
  if(!EAPI.store.getToken()){ location.replace(loginUrl); return; }
  EAPI.get("/api/auth/me").then(function(me){
    if(me && me.role==="student"){
      var boot = window.bootRefund;
      if(typeof boot==="function"){ try{ boot(); }catch(e){ console.error("bootRefund",e); } }
    } else {
      flash("当前角色 "+(me&&me.role?me.role:"未知")+" 无权访问退款中心，正在跳回学习端…");
      setTimeout(function(){ try{ location.replace("dashboard.html"); }catch(e){} },1200);
    }
  }).catch(function(){
    flash("身份校验失败，正在跳转登录…");
    setTimeout(function(){ try{ location.replace(loginUrl); }catch(e){} },1200);
  });
})();
</script>

  var TYPE_LABEL = {
    personal_reason:"个人原因", course_unsatisfied:"课程不满意",
    schedule_conflict:"时间冲突", duplicate_purchase:"重复购买"
  };
  var STATUS = {
    pending:"pending", approved:"approved", rejected:"rejected", refunded:"refunded"
  };
  function statusText(s){
    switch(s){
      case "pending": return "到账审核中";
      case "approved": return "已批准·待退款";
      case "rejected": return "已拒绝";
      case "refunded": return "已退款";
      default: return s || "-";
    }
  }
  function money(v){ var n=Number(v); return isFinite(n)? n.toFixed(2) : "-"; }

  /* ---------- 可退款订单下拉 ---------- */
  function loadOrders(){
    var sel=$("orderSel"); if(!sel) return;
    if(!E.store.getToken()) return;
    E.get("/api/trade/orders?refundable=true&page=1&page_size=50").then(function(data){
      data = data || {};
      var items = data.items || [];
      state.orders = items;
      if(!items.length){
        sel.innerHTML = '<option value="">— 暂无已支付可退订单 —</option>';
        $("orderHint").textContent = "请先在「课程中心」购买并完成支付";
        return;
      }
      var opts = ['<option value="">请选择订单</option>'].concat(items.map(function(o){
        return '<option value="'+esc(o.order_no)+'" data-pay="'+Number(o.pay_amount||0)+'" data-title="'+esc(o.series_title||o.order_no)+'">'
             + esc(o.order_no) + ' · ' + esc(o.series_title||'') + ' · ¥' + money(o.pay_amount||0) + '</option>';
      }));
      sel.innerHTML = opts.join("");
      $("orderHint").textContent = items.length + " 个已支付订单可退款";
    }).catch(function(){ flash("加载可退订单失败，请重试"); });
  }

  /* ---------- 退款列表 + 分页 ---------- */
  function loadRefunds(){
    var box=$("refundList"); if(!box) return;
    box.innerHTML = '<div class="list-empty">加载中…</div>';
    E.get("/api/refunds?page="+state.page+"&page_size="+state.pageSize).then(function(data){
      data = data || {};
      var items = data.items || [];
      state.total = data.total || 0;
      state.items = items;
      renderList();
    }).catch(function(){
      box.innerHTML = '<div class="list-empty">加载退款记录失败</div>';
    });
  }

  function renderList(){
    var box=$("refundList"), pager=$("pager");
    if(!state.items.length){
      box.innerHTML = '<div class="list-empty">暂无退款记录</div>';
      if(pager) pager.style.display="none";
      return;
    }
    var html = state.items.map(function(it){
      var type = TYPE_LABEL[it.refund_type] || it.refund_type || "-";
      var stCls = STATUS[it.refund_status] || "pending";
      var cancelBtn = "";
      if(it.refund_status==="pending" && !it.cancelled){
        cancelBtn = '<div class="refund-actions"><button class="btn warn" data-cancel="'+it.id+'" type="button">撤销申请</button></div>';
      }
      var reason = it.remark
        ? '<div class="refund-meta">处理备注：'+esc(it.remark)+'</div>' : "";
      return '<div class="refund-item">'
        + '<div class="refund-head"><span class="refund-no">'+esc(it.refund_no)+'</span>'
        + '<span class="pill '+stCls+'">'+statusText(it.refund_status)+'</span></div>'
        + '<div class="refund-meta">关联订单：<b>'+esc(it.order_no)+'</b></div>'
        + '<div class="refund-meta">类型：'+esc(type)+' · 申请金额：<b>¥'+money(it.apply_amount)+'</b>'
        + (it.approved_amount!=null ? ' · 批准金额：<b>¥'+money(it.approved_amount)+'</b>' : '') + '</div>'
        + '<div class="refund-meta">申请时间：'+esc(String(it.applied_at||"").replace("T"," "))+'</div>'
        + reason
        + cancelBtn + '</div>';
    }).join("");
    box.innerHTML = html;
    if(pager){
      var pages = Math.max(1, Math.ceil(state.total/state.pageSize));
      pager.style.display = "flex";
      $("pgInfo").textContent = "第 "+state.page+" / "+pages+" 页 · 共 "+state.total+" 条";
      $("pgPrev").disabled = state.page<=1;
      $("pgNext").disabled = state.page>=pages;
    }
  }

  /* ---------- 发起退款 ---------- */
  function applyRefund(e){
    e.preventDefault();
    var order=$("orderSel").value, type=$("refundType").value;
    var amount=parseFloat($("amount").value), reason=$("reason").value.trim();
    var orderErr=$("orderErr"), typeErr=$("typeErr"), amtErr=$("amountErr"), rsErr=$("reasonErr");
    orderErr.style.display = order?"none":"block";
    typeErr.style.display = type?"none":"block";
    rsErr.style.display = reason?"none":"block";

    var orderObj = state.orders.filter(function(o){ return o.order_no===order; })[0];
    var pay = orderObj ? Number(orderObj.pay_amount||0) : 0;
    if(!order || !type || !reason){ flash("请完整填写退款申请"); return; }

    // 前端友好校验（硬约束在服务端：≤ 实付）
    var valid = isFinite(amount) && amount>0 && amount <= pay + 1e-6;
    amtErr.style.display = valid ? "none":"block";
    $("amountHint").textContent = orderObj
      ? "该订单实付 ¥"+money(pay)+"，退款金额不得超过此值（超出由服务端拦截）"
      : "可退订单实付上限以所选订单为准";
    if(!valid){ return; }

    var btn=$("applyBtn"); btn.disabled=true; btn.textContent="提交中…";
    E.post("/api/refunds", {
      order_no: order, refund_type: type,
      apply_amount: Math.round(amount*100)/100, reason: reason
    }).then(function(r){
      flash("退款申请已提交（"+(r&&r.refund_no)+"），进入到账审核中");
      $("applyForm").reset();
      state.page=1; loadRefunds(); loadOrders();
    }).catch(function(err){
      var msg = (err&&err.message)||"申请失败";
      flash(msg); // 覆盖金额超限 / 非可退订单等服务端拒绝反馈
    }).finally(function(){ btn.disabled=false; btn.textContent="提交退款申请"; });
  }

  /* ---------- 撤销退款 ---------- */
  function cancelRefund(id, btn){
    btn.disabled=true; btn.textContent="撤销中…";
    E.post("/api/refunds/"+id+"/cancel", {}).then(function(){
      flash("退款申请已撤销");
      loadRefunds();
    }).catch(function(err){
      flash((err&&err.message)||"撤销失败");
      btn.disabled=false; btn.textContent="撤销申请";
    });
  }

  /* ---------- 工单 ---------- */
  function submitTicket(e){
    e.preventDefault();
    var title=$("ticketTitle").value.trim(), content=$("ticketContent").value.trim();
    $("ttErr").style.display = title?"none":"block";
    $("tcErr").style.display = content?"none":"block";
    if(!title||!content){ flash("请填写工单标题与内容"); return; }
    var btn=$("ticketBtn"); btn.disabled=true; btn.textContent="提交中…";
    var body = { ticket_type:$("ticketType").value, title:title, content:content };
    var ord=$("ticketOrder").value.trim();
    if(ord) body.order_no = ord;
    E.post("/api/trade/after_sales/ticket", body).then(function(){
      flash("工单已提交，客服将尽快处理");
      $("ticketForm").reset();
    }).catch(function(err){
      flash((err&&err.message)||"工单提交失败");
    }).finally(function(){ btn.disabled=false; btn.textContent="提交工单"; });
  }

  function wire(){
    $("applyForm").addEventListener("submit", applyRefund);
    $("ticketForm").addEventListener("submit", submitTicket);
    $("pgPrev").addEventListener("click", function(){ if(state.page>1){ state.page--; loadRefunds(); } });
    $("pgNext").addEventListener("click", function(){ state.page++; loadRefunds(); });
    $("refundList").addEventListener("click", function(ev){
      var b = ev.target.closest && ev.target.closest("[data-cancel]");
      if(b) cancelRefund(Number(b.getAttribute("data-cancel")), b);
    });
    $("orderSel").addEventListener("change", function(){
      var o = state.orders.filter(function(x){ return x.order_no===this.value; }.bind(this))[0];
      $("amountHint").textContent = o ? "该订单实付 ¥"+money(o.pay_amount||0)+"，退款金额不得超过此值"
                                      : "可退订单实付上限以所选订单为准";
    });
  }

  global.bootRefund = function(){
    wire();
    loadRefunds();
    loadOrders();
  };
})(window);
</script>
</body>
</html>
