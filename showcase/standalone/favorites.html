<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的收藏 · Bili-Study</title>
<style>
/*
 * Bili-Study Clay Theme, Gate A frozen tokens
 *
 * Icon usage (Phosphor fill, local sprite):
 * <svg class="ic" aria-hidden="true"><use href="#ic-book-open"></use></svg>
 * For an icon-only control, put the accessible name on the control (aria-label or visible text).
 *
 * Token reference, one variable per line:
 * --bg-app: purple-tinted near-white application canvas.
 * --bg-raised: highest neutral surface reserved for dialogs and toasts.
 * --bg-input: subtly tinted recessed input surface.
 * --clay-primary: semantic alias for the approved main clay surface.
 * --clay-moss: approved primary moss green; #2E2A3F contrast is 8.84:1.
 * --clay-lavender: demoted secondary lavender, never the default surface.
 * --clay-sky: course and learning surface.
 * --clay-mint: success, completion, and progress surface.
 * --clay-peach: practice and quiz surface.
 * --clay-pink: favorites and community surface.
 * --clay-lemon: warm accent for reminders and pending work.
 * --cta-coral: the single saturated primary action color per screen.
 * --cta-text: primary action text; #2E2A3F on #FF7A6B is 5.43:1.
 * --status-active: active and successful state color.
 * --status-pending: pending state color.
 * --status-archived: archived and inactive state color.
 * --status-danger: destructive and error state color.
 * --text-strong: primary ink; intentionally not pure black.
 * --text-muted: secondary ink for supporting text.
 * --text-on-dark: text used on the dark code surface.
 * --surface-code: Markdown code block surface.
 * --focus-ring: high-contrast keyboard focus indicator.
 * --radius-card: L1 card radius.
 * --radius-btn: primary and secondary button radius.
 * --radius-input: input and compact control radius.
 * --radius-pill: pill and badge radius.
 * --radius-icon-tile: icon tile radius.
 * --space-1: 4px spacing unit.
 * --space-2: 8px spacing unit.
 * --space-3: 12px spacing unit.
 * --space-4: 16px spacing unit and minimum clay-to-clay gap.
 * --space-6: 24px spacing unit.
 * --space-8: 32px spacing unit.
 * --space-12: 48px spacing unit.
 * --control-min: minimum 44px interaction target.
 * --control-primary: 54px primary button height within the approved 52-56px range.
 * --motion-fast: 140ms tactile state duration.
 * --ease-clay: restrained ease-out curve for hover and press feedback.
 * --clay-shadow-moss: three-layer moss surface shadow.
 * --clay-shadow-lavender: three-layer secondary lavender surface shadow.
 * --clay-shadow-sky: three-layer sky surface shadow.
 * --clay-shadow-mint: three-layer mint surface shadow.
 * --clay-shadow-peach: three-layer peach surface shadow.
 * --clay-shadow-pink: three-layer pink surface shadow.
 * --clay-shadow-lemon: three-layer lemon surface shadow.
 * --clay-shadow-coral: three-layer coral action shadow.
 * --clay-shadow-raised: green-hued L2 shadow for raised neutral surfaces.
 * --clay-shadow-light: green-hued single-layer shadow for clay-light regions.
 * --clay-shadow-press-moss: compressed moss shadow for pressed controls.
 * --clay-shadow-press-coral: compressed coral shadow for pressed primary actions.
 * --clay-shadow-input: inset moss shadow for recessed fields.
 * --clay-shadow-input-focus: inset moss shadow plus visible focus halo.
 * --layer-base: normal document flow.
 * --layer-sticky: sticky navigation layer.
 * --layer-dropdown: menu and popover layer.
 * --layer-overlay: modal scrim layer.
 * --layer-dialog: dialog layer.
 * --layer-toast: toast and urgent feedback layer.
 *
 * L1 page overrides belong in a .page-<name> namespace. Example:
 * .page-dashboard { --page-card-gap: var(--space-6); }
 * Do not place page-specific selectors outside that namespace.
 */

:root {
  --bg-app: #F7F5FB;
  --bg-raised: #FFFFFF;
  --bg-input: #F7FAF4;
  --clay-primary: var(--clay-moss);
  --clay-moss: #B8D8A8;
  --clay-lavender: #B8A6FF;
  --clay-sky: #9EC9F0;
  --clay-mint: #7DD4A8;
  --clay-peach: #FFB59E;
  --clay-pink: #F5B8D0;
  --clay-lemon: #F5D77A;
  --cta-coral: #FF7A6B;
  --cta-text: #2E2A3F;
  --status-active: #7DD4A8;
  --status-pending: #F5D77A;
  --status-archived: #C9B5FF;
  --status-danger: #C63E4A;
  --text-strong: #2E2A3F;
  --text-muted: #6B6580;
  --text-on-dark: #F7F5FB;
  --surface-code: #2E2A3F;
  --focus-ring: #453C66;

  --radius-card: 28px;
  --radius-btn: 18px;
  --radius-input: 16px;
  --radius-pill: 999px;
  --radius-icon-tile: 20px;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --control-min: 44px;
  --control-primary: 54px;

  --motion-fast: 140ms;
  --ease-clay: cubic-bezier(.25, 1, .5, 1);

  --clay-shadow-moss:
    8px 8px 24px rgba(78, 126, 66, .30),
    inset -6px -6px 16px rgba(78, 126, 66, .22),
    inset 6px 6px 16px rgba(255, 254, 252, .58);
  --clay-shadow-lavender:
    8px 8px 24px rgba(126, 105, 181, .28),
    inset -6px -6px 16px rgba(126, 105, 181, .20),
    inset 6px 6px 16px rgba(255, 254, 252, .56);
  --clay-shadow-sky:
    8px 8px 24px rgba(80, 142, 196, .30),
    inset -6px -6px 16px rgba(80, 142, 196, .22),
    inset 6px 6px 16px rgba(255, 254, 252, .56);
  --clay-shadow-mint:
    8px 8px 24px rgba(43, 153, 103, .29),
    inset -6px -6px 16px rgba(43, 153, 103, .21),
    inset 6px 6px 16px rgba(255, 254, 252, .56);
  --clay-shadow-peach:
    8px 8px 24px rgba(218, 111, 82, .29),
    inset -6px -6px 16px rgba(218, 111, 82, .21),
    inset 6px 6px 16px rgba(255, 254, 252, .54);
  --clay-shadow-pink:
    8px 8px 24px rgba(188, 99, 137, .28),
    inset -6px -6px 16px rgba(188, 99, 137, .20),
    inset 6px 6px 16px rgba(255, 254, 252, .56);
  --clay-shadow-lemon:
    8px 8px 24px rgba(190, 149, 35, .28),
    inset -6px -6px 16px rgba(190, 149, 35, .20),
    inset 6px 6px 16px rgba(255, 254, 252, .54);
  --clay-shadow-coral:
    8px 8px 24px rgba(214, 82, 70, .31),
    inset -6px -6px 16px rgba(214, 82, 70, .23),
    inset 6px 6px 16px rgba(255, 254, 252, .45);
  --clay-shadow-raised: 12px 12px 32px rgba(78, 126, 66, .22);
  --clay-shadow-light: 6px 8px 20px rgba(78, 126, 66, .18);
  --clay-shadow-press-moss:
    4px 4px 12px rgba(78, 126, 66, .26),
    inset -3px -3px 8px rgba(78, 126, 66, .18),
    inset 3px 3px 8px rgba(255, 254, 252, .46);
  --clay-shadow-press-coral:
    4px 4px 12px rgba(214, 82, 70, .27),
    inset -3px -3px 8px rgba(214, 82, 70, .19),
    inset 3px 3px 8px rgba(255, 254, 252, .38);
  --clay-shadow-input:
    inset 3px 3px 8px rgba(78, 126, 66, .20),
    inset -3px -3px 8px rgba(255, 254, 252, .88);
  --clay-shadow-input-focus:
    inset 3px 3px 8px rgba(78, 126, 66, .24),
    inset -3px -3px 8px rgba(255, 254, 252, .92),
    0 0 0 3px rgba(69, 60, 102, .22);

  --layer-base: 0;
  --layer-sticky: 100;
  --layer-dropdown: 300;
  --layer-overlay: 700;
  --layer-dialog: 800;
  --layer-toast: 1000;
}

.ic {
  display: inline-block;
  flex: 0 0 auto;
  width: 1.25em;
  height: 1.25em;
  overflow: visible;
  color: currentColor;
  fill: currentColor;
  vertical-align: -.2em;
}

.clay-card {
  min-width: 0;
  border: 0;
  border-radius: var(--radius-card);
  color: var(--text-strong);
  background: var(--clay-primary);
  box-shadow: var(--clay-shadow-moss);
}

.clay-btn-primary,
.clay-btn-soft {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-width: var(--control-min);
  min-height: var(--control-min);
  border: 0;
  border-radius: var(--radius-btn);
  padding-inline: var(--space-6);
  color: var(--text-strong);
  font: inherit;
  font-weight: 800;
  line-height: 1;
  text-decoration: none;
  cursor: pointer;
  touch-action: manipulation;
  transition:
    transform var(--motion-fast) var(--ease-clay),
    box-shadow var(--motion-fast) var(--ease-clay),
    background-color var(--motion-fast) var(--ease-clay);
}

.clay-btn-primary {
  min-height: var(--control-primary);
  color: var(--cta-text);
  background: var(--cta-coral);
  box-shadow: var(--clay-shadow-coral);
}

.clay-btn-soft {
  background: var(--clay-primary);
  box-shadow: var(--clay-shadow-light);
}

.clay-btn-primary:hover,
.clay-btn-soft:hover {
  transform: translateY(-2px);
}

.clay-btn-primary:active,
.clay-btn-soft:active {
  transform: scale(.97);
}

.clay-btn-primary:active {
  box-shadow: var(--clay-shadow-press-coral);
}

.clay-btn-soft:active {
  box-shadow: var(--clay-shadow-press-moss);
}

.clay-btn-primary:disabled,
.clay-btn-soft:disabled,
.clay-btn-primary[aria-disabled="true"],
.clay-btn-soft[aria-disabled="true"] {
  opacity: .52;
  cursor: not-allowed;
  transform: none;
}

.clay-pill {
  display: inline-flex;
  align-items: center;
  min-height: 32px;
  gap: var(--space-1);
  border-radius: var(--radius-pill);
  padding: var(--space-1) var(--space-3);
  color: var(--text-strong);
  background: var(--clay-lemon);
  box-shadow: 3px 4px 10px rgba(190, 149, 35, .21);
  font-size: .8125rem;
  font-weight: 800;
}

.clay-input {
  width: 100%;
  min-height: var(--control-primary);
  border: 0;
  border-radius: var(--radius-input);
  padding: var(--space-3) var(--space-4);
  color: var(--text-strong);
  background: var(--bg-input);
  box-shadow: var(--clay-shadow-input);
  font: inherit;
}

.clay-input::placeholder {
  color: var(--text-muted);
  opacity: 1;
}

.clay-input:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 2px;
  box-shadow: var(--clay-shadow-input-focus);
}

.clay-bubble-user,
.clay-bubble-ai {
  max-width: min(80%, 72ch);
  overflow-wrap: anywhere;
  border-radius: 24px 24px 24px 8px;
  padding: var(--space-4) 20px;
  color: var(--text-strong);
}

.clay-bubble-user {
  margin-inline-start: auto;
  border-radius: 24px 24px 8px 24px;
  background: var(--clay-peach);
  box-shadow: var(--clay-shadow-peach);
}

.clay-bubble-ai {
  background: var(--clay-primary);
  box-shadow: var(--clay-shadow-moss);
}

.clay-nav {
  position: relative;
  z-index: var(--layer-sticky);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  min-height: 64px;
  border-radius: var(--radius-card);
  padding: var(--space-2) var(--space-4);
  color: var(--text-strong);
  background: var(--bg-raised);
  box-shadow: var(--clay-shadow-raised);
}

.clay-nav :where(a, button) {
  min-width: var(--control-min);
  min-height: var(--control-min);
}

.clay-nav :where(.active, [aria-current="page"]) {
  color: var(--cta-text);
  background: var(--cta-coral);
}

.clay-card-placeholder {
  position: relative;
  min-height: 144px;
  border: 0;
  border-radius: var(--radius-card);
  padding: var(--space-6);
  color: var(--text-strong);
  background: var(--clay-lemon);
  box-shadow: var(--clay-shadow-lemon);
}

.clay-card-placeholder[data-state="closed"] {
  background: var(--clay-lavender);
  box-shadow: var(--clay-shadow-lavender);
}

.clay-card-placeholder[data-state="forbidden"] {
  outline: 3px solid var(--status-archived);
  outline-offset: -3px;
  background: var(--bg-raised);
  box-shadow: var(--clay-shadow-raised);
}

.clay-card-placeholder[data-state="error"] {
  outline: 3px solid var(--status-danger);
  outline-offset: -3px;
  background: var(--clay-peach);
  box-shadow: var(--clay-shadow-peach);
}

.clay-card :where(pre, code),
.clay-bubble-ai :where(pre, code),
.clay-bubble-user :where(pre, code) {
  color: var(--text-on-dark);
  background: var(--surface-code);
}

.clay-card pre,
.clay-bubble-ai pre,
.clay-bubble-user pre {
  overflow: auto;
  border-radius: var(--radius-input);
  padding: var(--space-4);
}

:where(.clay-btn-primary, .clay-btn-soft, .clay-nav a, .clay-nav button):focus-visible {
  outline: 3px solid var(--focus-ring);
  outline-offset: 3px;
}

/* Admin fallback: lower visual depth without changing component geometry. */
.clay-light {
  --radius-card: 24px;
}

.clay-card.clay-light,
.clay-light .clay-card {
  box-shadow: var(--clay-shadow-light);
}

.clay-light :where(table, .table, .chart, [data-chart], [data-table]) {
  border-radius: var(--radius-input);
  background: var(--bg-raised);
  box-shadow: none;
}

@media (prefers-reduced-motion: reduce) {
  .clay-btn-primary,
  .clay-btn-soft {
    transition-duration: .01ms;
  }

  .clay-btn-primary:hover,
  .clay-btn-primary:active,
  .clay-btn-soft:hover,
  .clay-btn-soft:active {
    transform: none;
  }
}

</style>
<style>
/* ===== PACK-A 黏土重塑（favorites）：令牌/组件类只来自 theme.css（L2 冻结）。
   页内零新增 class（G7 aria-title 基线冻结 cssPath），私有化全部走本页 style 块内既有选择器 ===== */
*{box-sizing:border-box;margin:0;padding:0}
html{min-height:100dvh}
body{min-height:100dvh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text-strong);background:var(--bg-app);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
a{text-decoration:none;color:inherit}
:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px}

/* ===== 全局导航（黏土白瓷条；类名/抽屉显隐语义/结构不变）===== */
.gnav-toggle{display:none;position:fixed;top:12px;right:12px;z-index:140;width:44px;height:44px;border:0;background:var(--bg-raised);border-radius:var(--radius-input);font-size:.875rem;font-weight:900;place-items:center;box-shadow:var(--clay-shadow-raised);cursor:pointer;color:var(--text-strong)}
.gnav-overlay{position:fixed;inset:0;z-index:120;background:rgba(46,42,63,.45);opacity:0;visibility:hidden;transition:opacity var(--motion-fast) var(--ease-clay),visibility var(--motion-fast) var(--ease-clay)}
.gnav-overlay.open{opacity:1;visibility:visible}
.glayout{display:block;max-width:1180px;margin:0 auto;padding:0}
.gnav{position:sticky;top:0;z-index:130;display:flex;flex-direction:row;align-items:center;gap:12px;width:auto;max-height:none;overflow:visible;background:var(--bg-raised);border:0;border-radius:0 0 var(--radius-card) var(--radius-card);box-shadow:var(--clay-shadow-raised);padding:10px 18px;color:var(--text-strong)}
.gnav-brand{display:flex;align-items:center;gap:8px;min-width:0;padding:0;margin:0;text-decoration:none;color:var(--text-strong)}
.gnav-logo{display:grid;place-items:center;width:44px;height:44px;border-radius:var(--radius-icon-tile);background:var(--clay-moss);color:var(--text-strong);font-size:.75rem;font-weight:900;line-height:1;box-shadow:var(--clay-shadow-moss)}
.gnav-name{font-size:.9375rem;font-weight:900;color:var(--text-strong);white-space:nowrap}
.gnav-cap{font-size:.6875rem;font-weight:800;color:var(--text-muted);letter-spacing:.08em;white-space:nowrap}
.gnav-list{display:flex;flex-direction:row;align-items:center;gap:4px;min-width:0;flex:1;overflow-x:auto;scrollbar-width:none}
.gnav-list::-webkit-scrollbar{display:none}
.gnav-item{display:inline-flex;align-items:center;justify-content:center;width:auto;min-width:44px;min-height:44px;white-space:nowrap;font-size:.8125rem;font-weight:800;color:var(--text-strong);padding:0 12px;border-radius:var(--radius-btn);border:0;transition:background-color var(--motion-fast) var(--ease-clay),color var(--motion-fast) var(--ease-clay),box-shadow var(--motion-fast) var(--ease-clay);text-decoration:none}
.gnav-item:hover{background:var(--bg-input)}
.gnav-item.active{color:var(--cta-text);background:var(--cta-coral);box-shadow:var(--clay-shadow-press-coral)}
.gnav-foot{margin-left:auto;margin-top:0;border:0;padding:0;display:inline-flex;align-items:center;gap:2px;font-size:.6875rem;color:var(--text-muted);font-weight:700;white-space:nowrap}
.gnav-foot a,.gnav-foot button{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:0 8px;border-radius:var(--radius-input);color:var(--text-strong);font:inherit;font-weight:800;background:none;border:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
@media(max-width:767px){
  .gnav-toggle{display:grid}
  .glayout{padding:0}
  .gnav{position:fixed;right:0;left:auto;top:0;bottom:0;z-index:130;width:min(320px,88vw);height:100dvh;align-items:stretch;flex-direction:column;gap:8px;padding:16px;transform:translateX(100%);transition:transform .24s var(--ease-clay);box-shadow:var(--clay-shadow-raised);border-radius:0}
  .gnav.open{transform:translateX(0)}
  .gnav-brand{padding-bottom:10px}
  .gnav-cap{padding-top:4px}
  .gnav-list{flex-direction:column;align-items:stretch;overflow-y:auto}
  .gnav-item{justify-content:flex-start;width:100%;min-height:44px}
  .gnav-foot{margin:0;padding-top:8px}
}

/* ===== 页面主体 ===== */
.page{max-width:860px;margin:0 auto;padding:24px 16px 60px;display:flex;flex-direction:column;gap:var(--space-4)}
.page-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.page-head .mascot{display:grid;place-items:center;width:52px;height:52px;border-radius:var(--radius-icon-tile);background:var(--clay-pink);color:var(--text-strong);box-shadow:var(--clay-shadow-pink)}
.page-head .mascot .ic{width:28px;height:28px}
.page-head h1{font-size:22px;font-weight:900;letter-spacing:-.01em;color:var(--text-strong)}
.page-head .sub{font-size:12.5px;color:var(--text-muted);font-weight:600;margin-top:2px}

/* ===== 收藏课程卡片（黏土卡）===== */
.fav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--space-4)}
.fav-card{display:flex;flex-direction:column;background:var(--bg-raised);border:0;border-radius:var(--radius-card);box-shadow:var(--clay-shadow-raised);overflow:hidden;transition:transform var(--motion-fast) var(--ease-clay),box-shadow var(--motion-fast) var(--ease-clay)}
.fav-card:hover{transform:translateY(-2px)}
.fav-cover{position:relative;width:100%;aspect-ratio:16/9;background:var(--clay-pink);background-image:linear-gradient(135deg,var(--clay-pink),var(--clay-lemon));background-size:cover;background-position:center;display:grid;place-items:center;overflow:hidden}
.fav-cover img{width:100%;height:100%;object-fit:cover;display:block}
.fav-cover .ph{font-size:34px;color:var(--text-strong)}
.fav-badge{position:absolute;top:10px;left:10px;font-size:11px;font-weight:900;border-radius:var(--radius-pill);padding:4px 12px;background:var(--bg-raised);color:var(--text-strong);box-shadow:var(--clay-shadow-light)}
.fav-body{display:flex;flex-direction:column;gap:6px;padding:14px 16px 16px;flex:1;background:var(--bg-raised)}
.fav-title{font-size:15px;font-weight:800;color:var(--text-strong);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.fav-meta{font-size:12px;color:var(--text-muted);font-weight:600;margin-top:auto}
.fav-go{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;margin-top:10px;border:0;background:var(--cta-coral);color:var(--cta-text);font-weight:800;font-size:13.5px;border-radius:var(--radius-btn);padding:10px 16px;box-shadow:var(--clay-shadow-press-coral)}

/* ===== 空态 / 错误态 / 分页（白瓷状态卡）===== */
.state{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:var(--bg-raised);border-radius:var(--radius-card);box-shadow:var(--clay-shadow-light);padding:36px 20px}
.state .st-emoji{font-size:40px;color:var(--text-strong)}
.state h3{font-size:16px;font-weight:900;color:var(--text-strong)}
.state p{font-size:13px;color:var(--text-muted);font-weight:600}
.state .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border:0;background:var(--cta-coral);color:var(--cta-text);font-weight:900;font-size:13.5px;border-radius:var(--radius-btn);padding:10px 20px;box-shadow:var(--clay-shadow-press-coral);text-decoration:none}
.state .btn:active{transform:scale(.97)}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.pager button{min-width:44px;min-height:44px;border:0;background:var(--clay-moss);border-radius:var(--radius-input);padding:8px 16px;font-weight:800;font-size:13px;color:var(--text-strong);box-shadow:var(--clay-shadow-press-moss)}

/* ===== 加载骨架（reduced-motion 下静止）===== */
.sk{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--space-4)}
.sk-card{background:var(--bg-raised);border:0;border-radius:var(--radius-card);box-shadow:var(--clay-shadow-light);overflow:hidden}
.sk-cover{aspect-ratio:16/9;background:var(--bg-input)}
.sk-body{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.sk-line{height:13px;border-radius:7px;background-color:var(--bg-input);background-image:linear-gradient(90deg,var(--bg-input) 25%,#eef4e6 50%,var(--bg-input) 75%);background-size:400% 100%;animation:shimmer 1.2s infinite}
.sk-line.w60{width:60%}.sk-line.w90{width:90%}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}

/* ===== 动效纪律（方案 §7.7）：reduced-motion 下关位移缩放与循环动画 ===== */
@media (prefers-reduced-motion: reduce){
  *{transition-duration:.01ms !important}
  .fav-card:hover{transform:none}
  .state .btn:active{transform:none}
  .sk-line{animation:none}
}

<script>
/* ===== 我的收藏：GET /api/favorites 真实数据 ===== */
(function () {
  if (!window.EAPI) return;
  if (!EAPI.store.getToken()) { location.replace(EAPI.buildLoginUrl("favorites.html")); return; }

  var PAGE_SIZE = 20;

  var pgPrev = document.getElementById("pgPrev");

  var curPage = 1;
  var totalPages = 1;

  function el(tag, cls, text) {
    var n = document.createElement(tag);

    if (text != null) n.textContent = text;
    return n;
  }
  function d10(s) { return s ? String(s).slice(0, 10) : ""; }

  function showSkeleton() {
    stage.innerHTML = "";
    var g = el("div", "sk");
    for (var i = 0; i < 4; i++) {
      var c = el("div", "sk-card");
      c.appendChild(el("div", "sk-cover"));
      var b = el("div", "sk-body");
      b.appendChild(el("div", "sk-line w90"));
      b.appendChild(el("div", "sk-line w60"));
      c.appendChild(b);
      g.appendChild(c);
    }
    stage.appendChild(g);
    pager.style.display = "none";
  }
  function showError(retry) {
    stage.innerHTML = "";
    var s = el("div", "state");
    s.appendChild(el("div", "st-emoji", "😵"));
    s.appendChild(el("h3", "", "收藏加载失败"));
    s.appendChild(el("p", "", "网络开小差了，请稍后重试"));
    var b = el("button", "btn", "🔄 重试");
    b.addEventListener("click", retry);
    s.appendChild(b);
    stage.appendChild(s);
    pager.style.display = "none";
  }
  function showEmpty() {
    stage.innerHTML = "";
    var s = el("div", "state");
    s.appendChild(el("div", "st-emoji", "⭐"));
    s.appendChild(el("h3", "", "暂无收藏，去课程中心逛逛"));
    s.appendChild(el("p", "", "在课程详情页点「收藏」，心仪课程就会出现在这里"));
    var a = el("a", "btn", "🛒 去课程中心");
    a.href = "courses.html";
    s.appendChild(a);
    stage.appendChild(s);
    pager.style.display = "none";
  }

  function renderList(data) {
    stage.innerHTML = "";
    var grid = el("div", "fav-grid");
    (data.items || []).forEach(function (it) {
      var card = el("a", "fav-card");
      card.href = "course-detail.html?id=" + encodeURIComponent(it.series_id != null ? it.series_id : "");

      var cover = el("div", "fav-cover");
      if (it.cover_url) {
        var img = document.createElement("img");
        img.src = it.cover_url;
        img.alt = (it.series_title || "课程封面");
        img.loading = "lazy";
        img.onerror = function () { img.remove(); };
        cover.appendChild(img);
      } else {
        cover.appendChild(el("span", "ph", "📘"));
      }
      cover.appendChild(el("span", "fav-badge", "已收藏"));

      var body = el("div", "fav-body");
      body.appendChild(el("div", "fav-title", it.series_title || "未命名课程"));

      card.appendChild(cover);
      card.appendChild(body);
      grid.appendChild(card);
    });
    stage.appendChild(grid);
  }

  function updatePager(total) {
    totalPages = Math.max(1, Math.ceil((total || 0) / PAGE_SIZE));
    pager.style.display = totalPages > 1 ? "flex" : "none";
    pgPrev.disabled = curPage <= 1;
    pgNext.disabled = curPage >= totalPages;
    pgInfo.textContent = "第 " + curPage + " / " + totalPages + " 页 · 共 " + (total || 0) + " 门";
  }

  function load(page) {
    curPage = page;
    showSkeleton();
    EAPI.get("/api/favorites?page=" + page + "&page_size=" + PAGE_SIZE)

        if (!data) { showError(function () { load(page); }); return; }

        updatePager(data.total);
      })

  }

  pgPrev.addEventListener("click", function () { if (curPage > 1) load(curPage - 1); });
  pgNext.addEventListener("click", function () { if (curPage < totalPages) load(curPage + 1); });

  load(1);
})();
</script>
