<style>
/*
 * Bili-Study Clay Theme, Gate A frozen tokens
 *
 * Icon usage (Phosphor fill, local sprite):
 * <svg class="ic" aria-hidden="true"><use href="#ic-book-open"></use></svg>
 * For an icon-only control, put the accessible name on the control (aria-label or visible text).
 *
 * Token reference, one variable per line:
 * --bg-app: purple-tinted near-white application canvas.
 * --bg-raised: highest neutral surface reserved for dialogs and toasts.
 * --bg-input: subtly tinted recessed input surface.
 * --clay-primary: semantic alias for the approved main clay surface.
 * --clay-moss: approved primary moss green; #2E2A3F contrast is 8.84:1.
 * --clay-lavender: demoted secondary lavender, never the default surface.
 * --clay-sky: course and learning surface.
 * --clay-mint: success, completion, and progress surface.
 * --clay-peach: practice and quiz surface.
 * --clay-pink: favorites and community surface.
 * --clay-lemon: warm accent for reminders and pending work.
 * --cta-coral: the single saturated primary action color per screen.
 * --cta-text: primary action text; #2E2A3F on #FF7A6B is 5.43:1.
 * --status-active: active and successful state color.
 * --status-pending: pending state color.
 * --status-archived: archived and inactive state color.
 * --status-danger: destructive and error state color.
 * --text-strong: primary ink; intentionally not pure black.
 * --text-muted: secondary ink for supporting text.
 * --text-on-dark: text used on the dark code surface.
 * --surface-code: Markdown code block surface.
 * --focus-ring: high-contrast keyboard focus indicator.
 * --radius-card: L1 card radius.
 * --radius-btn: primary and secondary button radius.
 * --radius-input: input and compact control radius.
 * --radius-pill: pill and badge radius.
 * --radius-icon-tile: icon tile radius.
 * --space-1: 4px spacing unit.
 * --space-2: 8px spacing unit.
 * --space-3: 12px spacing unit.
 * --space-4: 16px spacing unit and minimum clay-to-clay gap.
 * --space-6: 24px spacing unit.
 * --space-8: 32px spacing unit.
 * --space-12: 48px spacing unit.
 * --control-min: minimum 44px interaction target.
 * --control-primary: 54px primary button height within the approved 52-56px range.
 * --motion-fast: 140ms tactile state duration.
 * --ease-clay: restrained ease-out curve for hover and press feedback.
 * --clay-shadow-moss: three-layer moss surface shadow.
 * --clay-shadow-lavender: three-layer secondary lavender surface shadow.
 * --clay-shadow-sky: three-layer sky surface shadow.
 * --clay-shadow-mint: three-layer mint surface shadow.
 * --clay-shadow-peach: three-layer peach surface shadow.
 * --clay-shadow-pink: three-layer pink surface shadow.
 * --clay-shadow-lemon: three-layer lemon surface shadow.
 * --clay-shadow-coral: three-layer coral action shadow.
 * --clay-shadow-raised: green-hued L2 shadow for raised neutral surfaces.
 * --clay-shadow-light: green-hued single-layer shadow for clay-light regions.
 * --clay-shadow-press-moss: compressed moss shadow for pressed controls.
 * --clay-shadow-press-coral: compressed coral shadow for pressed primary actions.
 * --clay-shadow-input: inset moss shadow for recessed fields.
 * --clay-shadow-input-focus: inset moss shadow plus visible focus halo.
 * --layer-base: normal document flow.
 * --layer-sticky: sticky navigation layer.
 * --layer-dropdown: menu and popover layer.
 * --layer-overlay: modal scrim layer.
 * --layer-dialog: dialog layer.
 * --layer-toast: toast and urgent feedback layer.
 *
 * L1 page overrides belong in a .page-<name> namespace. Example:
 * .page-dashboard { --page-card-gap: var(--space-6); }
 * Do not place page-specific selectors outside that namespace.
 */

:root {
  --bg-app: #F7F5FB;
  --bg-raised: #FFFFFF;
  --bg-input: #F7FAF4;
  --clay-primary: var(--clay-moss);
  --clay-moss: #B8D8A8;
  --clay-lavender: #B8A6FF;
  --clay-sky: #9EC9F0;
  --clay-mint: #7DD4A8;
  --clay-peach: #FFB59E;
  --clay-pink: #F5B8D0;
  --clay-lemon: #F5D77A;
  --cta-coral: #FF7A6B;
  --cta-text: #2E2A3F;
  --status-active: #7DD4A8;
  --status-pending: #F5D77A;
  --status-archived: #C9B5FF;
  --status-danger: #C63E4A;
  --text-strong: #2E2A3F;
  --text-muted: #6B6580;
  --text-on-dark: #F7F5FB;
  --surface-code: #2E2A3F;
  --focus-ring: #453C66;

  --radius-card: 28px;
  --radius-btn: 18px;
  --radius-input: 16px;
  --radius-pill: 999px;
  --radius-icon-tile: 20px;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --control-min: 44px;
  --control-primary: 54px;

  --motion-fast: 140ms;
  --ease-clay: cubic-bezier(.25, 1, .5, 1);

  --clay-shadow-moss:
    8px 8px 24px rgba(78, 126, 66, .30),
    inset -6px -6px 16px rgba(78, 126, 66, .22),
    inset 6px 6px 16px rgba(255, 254, 252, .58);
  --clay-shadow-lavender:
    8px 8px 24px rgba(126, 105, 181, .28),
    inset -6px -6px 16px rgba(126, 105, 181, .20),
    inset 6px 6px 16px rgba(255, 254, 252, .56);
  --clay-shadow-sky:
    8px 8px 24px rgba(80, 142, 196, .30),
    inset -6px -6px 16px rgba(80, 142, 196, .22),
    inset 6px 6px 16px rgba(255, 254, 252, .56);
  --clay-shadow-mint:
    8px 8px 24px rgba(43, 153, 103, .29),
    inset -6px -6px 16px rgba(43, 153, 103, .21),
    inset 6px 6px 16px rgba(255, 254, 252, .56);
  --clay-shadow-peach:
    8px 8px 24px rgba(218, 111, 82, .29),
    inset -6px -6px 16px rgba(218, 111, 82, .21),
    inset 6px 6px 16px rgba(255, 254, 252, .54);
  --clay-shadow-pink:
    8px 8px 24px rgba(188, 99, 137, .28),
    inset -6px -6px 16px rgba(188, 99, 137, .20),
    inset 6px 6px 16px rgba(255, 254, 252, .56);
  --clay-shadow-lemon:
    8px 8px 24px rgba(190, 149, 35, .28),
    inset -6px -6px 16px rgba(190, 149, 35, .20),
    inset 6px 6px 16px rgba(255, 254, 252, .54);
  --clay-shadow-coral:
    8px 8px 24px rgba(214, 82, 70, .31),
    inset -6px -6px 16px rgba(214, 82, 70, .23),
    inset 6px 6px 16px rgba(255, 254, 252, .45);
  --clay-shadow-raised: 12px 12px 32px rgba(78, 126, 66, .22);
  --clay-shadow-light: 6px 8px 20px rgba(78, 126, 66, .18);
  --clay-shadow-press-moss:
    4px 4px 12px rgba(78, 126, 66, .26),
    inset -3px -3px 8px rgba(78, 126, 66, .18),
    inset 3px 3px 8px rgba(255, 254, 252, .46);
  --clay-shadow-press-coral:
    4px 4px 12px rgba(214, 82, 70, .27),
    inset -3px -3px 8px rgba(214, 82, 70, .19),
    inset 3px 3px 8px rgba(255, 254, 252, .38);
  --clay-shadow-input:
    inset 3px 3px 8px rgba(78, 126, 66, .20),
    inset -3px -3px 8px rgba(255, 254, 252, .88);
  --clay-shadow-input-focus:
    inset 3px 3px 8px rgba(78, 126, 66, .24),
    inset -3px -3px 8px rgba(255, 254, 252, .92),
    0 0 0 3px rgba(69, 60, 102, .22);

  --layer-base: 0;
  --layer-sticky: 100;
  --layer-dropdown: 300;
  --layer-overlay: 700;
  --layer-dialog: 800;
  --layer-toast: 1000;
}

.ic {
  display: inline-block;
  flex: 0 0 auto;
  width: 1.25em;
  height: 1.25em;
  overflow: visible;
  color: currentColor;
  fill: currentColor;
  vertical-align: -.2em;
}

.clay-card {
  min-width: 0;
  border: 0;
  border-radius: var(--radius-card);
  color: var(--text-strong);
  background: var(--clay-primary);
  box-shadow: var(--clay-shadow-moss);
}

.clay-btn-primary,
.clay-btn-soft {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-width: var(--control-min);
  min-height: var(--control-min);
  border: 0;
  border-radius: var(--radius-btn);
  padding-inline: var(--space-6);
  color: var(--text-strong);
  font: inherit;
  font-weight: 800;
  line-height: 1;
  text-decoration: none;
  cursor: pointer;
  touch-action: manipulation;
  transition:
    transform var(--motion-fast) var(--ease-clay),
    box-shadow var(--motion-fast) var(--ease-clay),
    background-color var(--motion-fast) var(--ease-clay);
}

.clay-btn-primary {
  min-height: var(--control-primary);
  color: var(--cta-text);
  background: var(--cta-coral);
  box-shadow: var(--clay-shadow-coral);
}

.clay-btn-soft {
  background: var(--clay-primary);
  box-shadow: var(--clay-shadow-light);
}

.clay-btn-primary:hover,
.clay-btn-soft:hover {
  transform: translateY(-2px);
}

.clay-btn-primary:active,
.clay-btn-soft:active {
  transform: scale(.97);
}

.clay-btn-primary:active {
  box-shadow: var(--clay-shadow-press-coral);
}

.clay-btn-soft:active {
  box-shadow: var(--clay-shadow-press-moss);
}

.clay-btn-primary:disabled,
.clay-btn-soft:disabled,
.clay-btn-primary[aria-disabled="true"],
.clay-btn-soft[aria-disabled="true"] {
  opacity: .52;
  cursor: not-allowed;
  transform: none;
}

.clay-pill {
  display: inline-flex;
  align-items: center;
  min-height: 32px;
  gap: var(--space-1);
  border-radius: var(--radius-pill);
  padding: var(--space-1) var(--space-3);
  color: var(--text-strong);
  background: var(--clay-lemon);
  box-shadow: 3px 4px 10px rgba(190, 149, 35, .21);
  font-size: .8125rem;
  font-weight: 800;
}

.clay-input {
  width: 100%;
  min-height: var(--control-primary);
  border: 0;
  border-radius: var(--radius-input);
  padding: var(--space-3) var(--space-4);
  color: var(--text-strong);
  background: var(--bg-input);
  box-shadow: var(--clay-shadow-input);
  font: inherit;
}

.clay-input::placeholder {
  color: var(--text-muted);
  opacity: 1;
}

.clay-input:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 2px;
  box-shadow: var(--clay-shadow-input-focus);
}

.clay-bubble-user,
.clay-bubble-ai {
  max-width: min(80%, 72ch);
  overflow-wrap: anywhere;
  border-radius: 24px 24px 24px 8px;
  padding: var(--space-4) 20px;
  color: var(--text-strong);
}

.clay-bubble-user {
  margin-inline-start: auto;
  border-radius: 24px 24px 8px 24px;
  background: var(--clay-peach);
  box-shadow: var(--clay-shadow-peach);
}

.clay-bubble-ai {
  background: var(--clay-primary);
  box-shadow: var(--clay-shadow-moss);
}

.clay-nav {
  position: relative;
  z-index: var(--layer-sticky);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  min-height: 64px;
  border-radius: var(--radius-card);
  padding: var(--space-2) var(--space-4);
  color: var(--text-strong);
  background: var(--bg-raised);
  box-shadow: var(--clay-shadow-raised);
}

.clay-nav :where(a, button) {
  min-width: var(--control-min);
  min-height: var(--control-min);
}

.clay-nav :where(.active, [aria-current="page"]) {
  color: var(--cta-text);
  background: var(--cta-coral);
}

.clay-card-placeholder {
  position: relative;
  min-height: 144px;
  border: 0;
  border-radius: var(--radius-card);
  padding: var(--space-6);
  color: var(--text-strong);
  background: var(--clay-lemon);
  box-shadow: var(--clay-shadow-lemon);
}

.clay-card-placeholder[data-state="closed"] {
  background: var(--clay-lavender);
  box-shadow: var(--clay-shadow-lavender);
}

.clay-card-placeholder[data-state="forbidden"] {
  outline: 3px solid var(--status-archived);
  outline-offset: -3px;
  background: var(--bg-raised);
  box-shadow: var(--clay-shadow-raised);
}

.clay-card-placeholder[data-state="error"] {
  outline: 3px solid var(--status-danger);
  outline-offset: -3px;
  background: var(--clay-peach);
  box-shadow: var(--clay-shadow-peach);
}

.clay-card :where(pre, code),
.clay-bubble-ai :where(pre, code),
.clay-bubble-user :where(pre, code) {
  color: var(--text-on-dark);
  background: var(--surface-code);
}

.clay-card pre,
.clay-bubble-ai pre,
.clay-bubble-user pre {
  overflow: auto;
  border-radius: var(--radius-input);
  padding: var(--space-4);
}

:where(.clay-btn-primary, .clay-btn-soft, .clay-nav a, .clay-nav button):focus-visible {
  outline: 3px solid var(--focus-ring);
  outline-offset: 3px;
}

/* Admin fallback: lower visual depth without changing component geometry. */
.clay-light {
  --radius-card: 24px;
}

.clay-card.clay-light,
.clay-light .clay-card {
  box-shadow: var(--clay-shadow-light);
}

.clay-light :where(table, .table, .chart, [data-chart], [data-table]) {
  border-radius: var(--radius-input);
  background: var(--bg-raised);
  box-shadow: none;
}

@media (prefers-reduced-motion: reduce) {
  .clay-btn-primary,
  .clay-btn-soft {
    transition-duration: .01ms;
  }

  .clay-btn-primary:hover,
  .clay-btn-primary:active,
  .clay-btn-soft:hover,
  .clay-btn-soft:active {
    transform: none;
  }
}

</style>

<style>

*{box-sizing:border-box;margin:0;padding:0}

    "#postModal{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:16px}#postModal.open{display:flex}.pm-mask{position:absolute;inset:0;background:rgba(46,42,63,.45)}.pm-card{position:relative;width:min(520px,94vw);background:var(--bg-raised,#fff);border:0;border-radius:var(--radius-card,28px);box-shadow:var(--clay-shadow-raised,12px 12px 32px rgba(78,126,66,.22));padding:18px 20px;max-height:88vh;overflow:auto}.pm-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:16px;color:var(--text-strong,#2E2A3F)}.pm-x{border:0;background:var(--bg-raised,#fff);border-radius:var(--radius-btn,18px);width:44px;height:44px;font-weight:800;cursor:pointer;color:var(--text-strong,#2E2A3F);box-shadow:var(--clay-shadow-light,4px 5px 12px rgba(78,126,66,.14))}.pm-field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.pm-field label{font-size:12px;font-weight:800;color:var(--text-strong,#2E2A3F)}.pm-field input,.pm-field textarea{border:2px solid transparent;border-radius:var(--radius-input,16px);padding:8px 10px;font:inherit;font-size:14px;resize:vertical;outline:none;background:var(--bg-input,#F7FAF4);color:var(--text-strong,#2E2A3F);box-shadow:var(--clay-shadow-input,inset 3px 3px 8px rgba(78,126,66,.20))}.pm-field input:focus,.pm-field textarea:focus{border-color:var(--focus-ring,#453C66)}.pm-board{display:flex;flex-wrap:wrap;gap:8px}.pm-chip{border:2px solid transparent;background:var(--bg-raised,#fff);border-radius:999px;padding:5px 14px;min-height:44px;font-weight:800;font-size:13px;cursor:pointer;color:var(--text-strong,#2E2A3F);box-shadow:var(--clay-shadow-light,4px 5px 12px rgba(78,126,66,.14))}.pm-chip.on{background:var(--clay-mint,#7DD4A8);color:var(--text-strong,#2E2A3F)}.pm-err{min-height:18px;font-size:12px;color:var(--status-danger,#C63E4A);margin-bottom:8px}.pm-foot{display:flex;justify-content:flex-end;gap:8px}.pm-cancel{border:0;background:var(--bg-raised,#fff);border-radius:var(--radius-btn,18px);padding:8px 16px;min-height:44px;font-weight:800;cursor:pointer;color:var(--text-strong,#2E2A3F);box-shadow:var(--clay-shadow-light,4px 5px 12px rgba(78,126,66,.14))}.pm-submit{border:0;background:var(--cta-coral,#FF7A6B);color:var(--cta-text,#2E2A3F);border-radius:var(--radius-btn,18px);padding:8px 18px;min-height:44px;font-weight:800;cursor:pointer;box-shadow:var(--clay-shadow-coral,8px 8px 24px rgba(214,82,70,.31))}.pm-submit:disabled{opacity:.52;cursor:not-allowed}#boards .post.locked .like-btn{opacity:.5;pointer-events:none;cursor:not-allowed}#boards .post .lock{font-size:11px;font-weight:800;color:var(--status-danger,#C63E4A)}</style>");

  function setLiked(btn, liked) { btn.classList.toggle("on", !!liked); btn.setAttribute("aria-pressed", liked ? "true" : "false"); }

  function renderPosts(items) {
    if (!items || !items.length) {
      boards.innerHTML = '<div class="state" role="status"><span class="st-emoji"><svg class="ic" aria-hidden="true"><use href="#ic-chat-circle"/></svg></span><h3>暂无帖子</h3><p>这个版块还没有人发过帖，来当第一个分享的人吧～</p></div>';
      return;
    }
    /* B-G4：同一帖 post_id 只渲染 1 次（防重复渲染；跨页重复由 LIMIT/OFFSET 保证不发生，curl 实测附 T3B 报告） */
    var seen = {};
    var uniq = [];
    for (var i = 0; i < items.length; i++) {
      var pid = items[i].post_id;
      if (pid != null) { if (seen[pid]) continue; seen[pid] = 1; }
      uniq.push(items[i]);
    }
    boards.innerHTML = uniq.map(function (p) {
      var tags = (p.tags || []).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join("");
      var pin = (p.is_pinned || p.pinned) ? '<span class="pin"><svg class="ic" aria-hidden="true"><use href="#ic-bookmark-simple"/></svg> 置顶</span>' : "";
      var m = BOARD[p.board_code] || ["", ""];
      var liked = p.mine_react_like != null ? !!p.mine_react_like : !!likedMap[p.post_id];   // 实测列表返回 mine_react_like，优先后端字段（刷新可持续）
      if (liked) likedMap[p.post_id] = 1;
      var on = liked ? " on" : "";
      var locked = !!p.is_locked;
      return '<article class="post' + (locked ? " locked" : "") + '" tabindex="0" data-post="' + p.post_id + '"><div class="p-top">' + pin + '<span class="board-tag ' + m[1] + '">' + esc(m[0] || p.board_code || "") + '</span>' + (locked ? '<span class="lock">锁定</span>' : '') + '</div><h3>' + esc(p.title) + '</h3><p class="p-sum">' + esc(p.summary || "") + '</p><div class="p-tags">' + tags + '</div><div class="p-meta"><span class="who">' + esc(p.author_name) + '</span><span class="sep-dot">·</span><span>' + (p.created_at || "").slice(0, 10) + '</span><span class="sep-dot">·</span><span>浏览 ' + (p.view_count || 0) + '</span><span class="sep-dot">·</span><span class="cmt"><svg class="ic" aria-hidden="true"><use href="#ic-chat-circle"/></svg> <i>' + (p.comment_count || 0) + '</i></span><span class="sep-dot">·</span><button type="button" class="like-btn' + on + '" data-post="' + p.post_id + '" ' + (locked ? 'disabled aria-disabled="true"' : '') + ' aria-pressed="' + (on ? "true" : "false") + '"><svg class="ic" aria-hidden="true"><use href="#ic-heart"/></svg> <i>' + (p.like_count || 0) + '</i></button></div></article>';
    }).join("");
    bindBoards();
  }

  function bindBoards() {
    if (boards.dataset.task118Bound) return;   // 只绑定一次（prependPost 复用会重复绑定 → 已改容器级委托，防重复 POST）
    boards.dataset.task118Bound = "1";
    boards.addEventListener("click", function (e) {
      var lb = e.target.closest(".like-btn");
      if (lb) { e.stopPropagation(); likePost(lb); return; }
      var card = e.target.closest(".post");     // 列表→详情跳转（task110 保留）
      if (card && card.dataset.post) window.location.href = "community-post.html?post_id=" + card.dataset.post;
    });
  }

  function likePost(btn) {
    if (noToken()) { goLogin(); return; }
    if (btn.dataset.busy) return;   // 双击防抖（与详情页 bindReact 一致）
    var pid = btn.dataset.post;
    var wasOn = btn.classList.contains("on");
    var num = btn.querySelector("i");
    var old = parseInt((num ? num.textContent : "0"), 10) || 0;
    var next = !wasOn;
    btn.dataset.busy = "1";
    setLiked(btn, next); if (num) num.textContent = next ? old + 1 : old - 1;   // 乐观更新
    EAPI.post("/api/community/posts/" + pid + "/like").then(function (d) {
      var active = d ? !!d.active : next;
      var total = (d && d.total_count != null) ? d.total_count : (next ? old + 1 : old - 1);
      setLiked(btn, active); if (num) num.textContent = total;
      if (active) likedMap[pid] = 1; else delete likedMap[pid];
      try { localStorage.setItem(LK, JSON.stringify(likedMap)); } catch (e2) {}
    }).catch(function () { setLiked(btn, wasOn); if (num) num.textContent = old; })   // 失败回滚
      .finally(function () { delete btn.dataset.busy; });
  }

  /* task08：prependPost 已移除——发帖成功改为回第 1 页真实重载（0 计数伪造卡片属 MOCK，且 HOT 排序下位置失真） */

  function load() {
    /* task08：三态齐全——loading 骨架 → success/empty；失败渲染错误态+重试（原 .catch 静默吞） */
    boards.innerHTML = (function(){ var s=""; for (var i=0;i<4;i++) s+='<div class="sk-card"><div class="sk-h"></div><div class="sk-line w90"></div><div class="sk-line w70"></div><div class="sk-line w40"></div></div>';
      return '<div class="sk" role="status"><span class="visually-hidden">正在加载帖子…</span>'+s+'</div>'; })();
    var kw = (document.getElementById("kw") || {}).value || "";
    var sortSel = document.getElementById("sort");
    var sort = sortSel ? String(sortSel.value || "").trim() : "";
    var url = "/api/community/posts?page=" + curPage + "&page_size=" + PAGE_SIZE;
    if (currentBoard) url += "&board_code=" + encodeURIComponent(currentBoard);
    if (kw) url += "&keyword=" + encodeURIComponent(kw);
    if (sort) url += "&sort=" + encodeURIComponent(sort);
    EAPI.get(url).then(function (d) {
      var data = d && d.items ? d : { items: [], total: 0 };
      lastTotal = data.total || 0;
      renderPosts(data.items);
      renderPager(lastTotal);
      var mineEl = document.querySelector(".mine b");          /* 实测返回 mine_total_posts */
      if (mineEl && data.mine_total_posts != null) mineEl.textContent = " " + data.mine_total_posts;
    }).catch(function (e) {
      lastTotal = 0;
      var msg = (e && e.message) || "网络开小差了，请稍后重试。";
      boards.innerHTML = '<div class="state" role="alert"><span class="st-emoji"><svg class="ic" aria-hidden="true"><use href="#ic-warning"/></svg></span><h3>帖子加载失败</h3>'
        + '<p>' + esc(msg) + '</p><button type="button" class="retry" id="retryLoad">重试</button></div>';
      var rb = document.getElementById("retryLoad");
      if (rb) rb.addEventListener("click", function () { load(); });
      renderPager(0);
    });
  }

  /* ---- task08：真实分页（curl 实测裸分页壳 {total,page,page_size,items,mine_total_posts}）---- */
  var PAGE_SIZE = 10, curPage = 1, lastTotal = 0;
  function renderPager(total) {
    var pager = document.getElementById("pager");
    if (!pager) return;
    if (!total) { pager.style.display = "none"; return; }
    pager.style.display = "";
    var pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    var start = Math.max(1, Math.min(curPage - 2, pages - 4));
    var end = Math.min(pages, start + 4);
    if (end - start + 1 < 5) start = Math.max(1, end - 4);
    var html = '<button type="button" class="pager-btn" data-pg="prev"' + (curPage <= 1 ? " disabled" : "") + '>‹</button>';
    for (var i = start; i <= end; i++) html += '<button type="button" class="pager-btn' + (i === curPage ? " on" : "") + '" data-pg="' + i + '">' + i + '</button>';
    html += '<button type="button" class="pager-btn" data-pg="next"' + (curPage >= pages ? " disabled" : "") + '>›</button>';
    html += '<span class="total" id="total">共 ' + total + ' 条</span>';
    pager.innerHTML = html;
    if (totalEl) totalEl = document.getElementById("total");
    pager.querySelectorAll(".pager-btn").forEach(function (b) {
      b.addEventListener("click", function () {
        var v = b.dataset.pg, pages2 = Math.max(1, Math.ceil(lastTotal / PAGE_SIZE));
        if (v === "prev") { if (curPage > 1) { curPage--; load(); } }
        else if (v === "next") { if (curPage < pages2) { curPage++; load(); } }
        else { var p = parseInt(v, 10); if (p && p !== curPage) { curPage = p; load(); } }
      });
    });
  }

  /* ---- 版块 chips 筛选（board_code 实测）；切换筛选/排序/搜索都回到第 1 页 ---- */
  (function initChips() {
    var cEls = Array.prototype.slice.call(document.querySelectorAll("#chips .chip"));
    function activate(node) { cEls.forEach(function (x) { x.classList.remove("on"); x.setAttribute("aria-pressed", "false"); }); node.classList.add("on"); node.setAttribute("aria-pressed", "true"); }
    cEls.forEach(function (c) { if (c.dataset.b === "all") activate(c); });   // 默认全部
    cEls.forEach(function (c) {
      c.addEventListener("click", function () { activate(c); currentBoard = CODE[c.dataset.b] || ""; curPage = 1; load(); });
    });
  })();

  /* ---- 发帖弹窗（替换 prompt()）---- */
  var modal = null, mTitle, mContent, mTags, mErr, mSubmit, selBoard = "general";
  var toast = null;
  function flashNote(msg) {
    if (!toast) { toast = document.createElement("div"); toast.style.cssText = "position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:999;background:var(--surface-code,#2E2A3F);color:var(--text-on-dark,#F7F5FB);font-weight:800;padding:10px 18px;border-radius:var(--radius-btn,18px);box-shadow:var(--clay-shadow-raised,12px 12px 32px rgba(78,126,66,.22));transition:opacity .3s"; document.body.appendChild(toast); }
    toast.textContent = msg; toast.style.opacity = "1";
    clearTimeout(flashNote.__t); flashNote.__t = setTimeout(function () { toast.style.opacity = "0"; }, 2000);
  }
  function ensureModal() {
    if (modal) return;
    modal = document.createElement("div"); modal.id = "postModal";
    modal.innerHTML = '<div class="pm-mask"></div><div class="pm-card" role="dialog" aria-modal="true" aria-label="发新帖"><div class="pm-head"><b>＋ 发新帖</b><button type="button" class="pm-x" aria-label="关闭">✕</button></div>'
      + '<div class="pm-field"><label for="pmTitle">标题</label><input id="pmTitle" maxlength="80" placeholder="一句话说清你的问题/分享"></div>'
      + '<div class="pm-field"><label>版块</label><div class="pm-board" role="group" aria-label="选择版块">'
      + ['english:英语:en', 'math:数学:math', 'programming:编程:prog', 'general:综合:gen'].map(function (s) { var p = s.split(":"); return '<button type="button" class="pm-chip" data-bc="' + p[0] + '">' + p[1] + '</button>'; }).join("")
      + '</div></div>'
      + '<div class="pm-field"><label for="pmContent">内容（Markdown 支持）</label><textarea id="pmContent" rows="6" placeholder="写正文…"></textarea></div>'
      + '<div class="pm-field"><label for="pmTags">标签（逗号分隔，最多 8 个）</label><input id="pmTags" maxlength="80" placeholder="高数, 错题"></div>'
      + '<div class="pm-err" id="pmErr"></div>'
      + '<div class="pm-foot"><button type="button" class="pm-cancel">取消</button><button type="button" class="pm-submit">发布</button></div></div>';
    document.body.appendChild(modal);
    mTitle = document.getElementById("pmTitle"); mContent = document.getElementById("pmContent");
    mTags = document.getElementById("pmTags"); mErr = document.getElementById("pmErr"); mSubmit = modal.querySelector(".pm-submit");
    function closeM() { modal.classList.remove("open"); }
    modal.querySelector(".pm-mask").addEventListener("click", closeM);
    modal.querySelector(".pm-cancel").addEventListener("click", closeM);
    modal.querySelector(".pm-x").addEventListener("click", closeM);
    modal.querySelectorAll(".pm-chip").forEach(function (c) {
      c.addEventListener("click", function () {
        modal.querySelectorAll(".pm-chip").forEach(function (x) { x.classList.remove("on"); });
        c.classList.add("on"); selBoard = c.dataset.bc;
      });
    });
    mSubmit.onclick = function () {
      var title = (mTitle.value || "").trim(), content = (mContent.value || "").trim();
      if (!title) { mErr.textContent = "请输入标题"; mTitle.focus(); return; }
      if (!content) { mErr.textContent = "请输入内容"; mContent.focus(); return; }
      var tags = (mTags.value || "").split(/[,，]/).map(function (x) { return x.trim(); }).filter(Boolean).slice(0, 8);
      mSubmit.disabled = true; mErr.textContent = "";
      EAPI.post("/api/community/posts", { board_code: selBoard, title: title, content_md: content, tags: tags }).then(function (d) {
        modal.classList.remove("open");
        /* task08：发帖成功 → 回第 1 页真实重载（原 prependPost 用 0 计数伪造卡片，HOT 排序下位置也失真） */
        curPage = 1;
        load();
        flashNote("发帖成功" + (d && d.points_awarded ? "（+" + d.points_awarded + " 积分）" : ""));
      }).catch(function (e) { mErr.textContent = "发布失败：" + ((e && e.message) || "网络错误"); }).finally(function () { mSubmit.disabled = false; });
    };
  }
  function openNew() {
    if (noToken()) { goLogin(); return; }
    ensureModal();
    mTitle.value = ""; mContent.value = ""; mTags.value = ""; mErr.textContent = "";
    var def = BOARD[currentBoard] ? currentBoard : "general";
    modal.querySelectorAll(".pm-chip").forEach(function (c) { c.classList.toggle("on", c.dataset.bc === def); });
    selBoard = def;
    modal.classList.add("open"); mTitle.focus();
  }
  ["postNewDesktop", "fab"].forEach(function (id) { var b = document.getElementById(id); if (b) b.addEventListener("click", openNew); });
  var go = document.getElementById("go"); if (go) go.addEventListener("click", function () { curPage = 1; load(); });
  var sortSelEl = document.getElementById("sort"); if (sortSelEl) sortSelEl.addEventListener("change", function () { curPage = 1; load(); });
  var kwEl = document.getElementById("kw"); if (kwEl) kwEl.addEventListener("keydown", function (e) { if (e.key === "Enter") { curPage = 1; load(); } });

  load();
})();
</script>
</body></html>
