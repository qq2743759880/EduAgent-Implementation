/*

 *
 * Token reference, one variable per line:
 * --bg-app: purple-tinted near-white application canvas.

 * --clay-peach: practice and quiz surface.
 * --clay-pink: favorites and community surface.
 * --clay-lemon: warm accent for reminders and pending work.
 * --cta-coral: the single saturated primary action color per screen.

 * --status-active: active and successful state color.

 * --radius-input: input and compact control radius.
 * --radius-pill: pill and badge radius.

 * --space-2: 8px spacing unit.
 * --space-3: 12px spacing unit.
 * --space-4: 16px spacing unit and minimum clay-to-clay gap.
 * --space-6: 24px spacing unit.
 * --space-8: 32px spacing unit.
 * --space-12: 48px spacing unit.
 * --control-min: minimum 44px interaction target.
 * --control-primary: 54px primary button height within the approved 52-56px range.
 * --motion-fast: 140ms tactile state duration.
 * --ease-clay: restrained ease-out curve for hover and press feedback.
 * --clay-shadow-moss: three-layer moss surface shadow.
 * --clay-shadow-lavender: three-layer secondary lavender surface shadow.
 * --clay-shadow-sky: three-layer sky surface shadow.
 * --clay-shadow-mint: three-layer mint surface shadow.
 * --clay-shadow-peach: three-layer peach surface shadow.
 * --clay-shadow-pink: three-layer pink surface shadow.
 * --clay-shadow-lemon: three-layer lemon surface shadow.
 * --clay-shadow-coral: three-layer coral action shadow.
 * --clay-shadow-raised: green-hued L2 shadow for raised neutral surfaces.
 * --clay-shadow-light: green-hued single-layer shadow for clay-light regions.
 * --clay-shadow-press-moss: compressed moss shadow for pressed controls.
 * --clay-shadow-press-coral: compressed coral shadow for pressed primary actions.
 * --clay-shadow-input: inset moss shadow for recessed fields.
 * --clay-shadow-input-focus: inset moss shadow plus visible focus halo.
 * --layer-base: normal document flow.
 * --layer-sticky: sticky navigation layer.
 * --layer-dropdown: menu and popover layer.

 * --layer-dialog: dialog layer.

 * .page-dashboard { --page-card-gap: var(--space-6); }

:root {

  --bg-raised: #FFFFFF;
  --bg-input: #F7FAF4;
  --clay-primary: var(--clay-moss);

  --clay-lavender: #B8A6FF;
  --clay-sky: #9EC9F0;
  --clay-mint: #7DD4A8;
  --clay-peach: #FFB59E;
  --clay-pink: #F5B8D0;
  --clay-lemon: #F5D77A;
  --cta-coral: #FF7A6B;
  --cta-text: #2E2A3F;
  --status-active: #7DD4A8;
  --status-pending: #F5D77A;
  --status-archived: #C9B5FF;
  --status-danger: #C63E4A;
  --text-strong: #2E2A3F;
  --text-muted: #6B6580;
  --text-on-dark: #F7F5FB;
  --surface-code: #2E2A3F;
  --focus-ring: #453C66;

  --radius-input: 16px;

  --radius-icon-tile: 20px;

  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --control-min: 44px;
  --control-primary: 54px;

  --motion-fast: 140ms;
  --ease-clay: cubic-bezier(.25, 1, .5, 1);

  --clay-shadow-moss:

    inset -6px -6px 16px rgba(78, 126, 66, .22),
    inset 6px 6px 16px rgba(255, 254, 252, .58);
  --clay-shadow-lavender:

    inset -6px -6px 16px rgba(126, 105, 181, .20),
    inset 6px 6px 16px rgba(255, 254, 252, .56);
  --clay-shadow-sky:
    8px 8px 24px rgba(80, 142, 196, .30),
    inset -6px -6px 16px rgba(80, 142, 196, .22),
    inset 6px 6px 16px rgba(255, 254, 252, .56);
  --clay-shadow-mint:
    8px 8px 24px rgba(43, 153, 103, .29),
    inset -6px -6px 16px rgba(43, 153, 103, .21),

    inset -6px -6px 16px rgba(218, 111, 82, .21),

    inset 6px 6px 16px rgba(255, 254, 252, .54);
  --clay-shadow-coral:
    8px 8px 24px rgba(214, 82, 70, .31),
    inset -6px -6px 16px rgba(214, 82, 70, .23),
    inset 6px 6px 16px rgba(255, 254, 252, .45);

    inset 3px 3px 8px rgba(255, 254, 252, .46);
  --clay-shadow-press-coral:

.ic {
  display: inline-block;
  flex: 0 0 auto;
  width: 1.25em;
  height: 1.25em;
  overflow: visible;
  color: currentColor;
  fill: currentColor;
  vertical-align: -.2em;
}

.clay-card {
  min-width: 0;
  border: 0;
  border-radius: var(--radius-card);
  color: var(--text-strong);
  background: var(--clay-primary);
  box-shadow: var(--clay-shadow-moss);
}

.clay-btn-primary,
.clay-btn-soft {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-width: var(--control-min);
  min-height: var(--control-min);
  border: 0;
  border-radius: var(--radius-btn);
  padding-inline: var(--space-6);
  color: var(--text-strong);
  font: inherit;
  font-weight: 800;
  line-height: 1;
  text-decoration: none;
  cursor: pointer;
  touch-action: manipulation;
  transition:
    transform var(--motion-fast) var(--ease-clay),
    box-shadow var(--motion-fast) var(--ease-clay),
    background-color var(--motion-fast) var(--ease-clay);
}

.clay-btn-primary {
  min-height: var(--control-primary);
  color: var(--cta-text);
  background: var(--cta-coral);
  box-shadow: var(--clay-shadow-coral);
}

.clay-btn-soft {
  background: var(--clay-primary);
  box-shadow: var(--clay-shadow-light);
}

.clay-btn-primary:hover,
.clay-btn-soft:hover {
  transform: translateY(-2px);
}

.clay-btn-primary:active,
.clay-btn-soft:active {
  transform: scale(.97);
}

.clay-btn-primary:active {
  box-shadow: var(--clay-shadow-press-coral);
}

.clay-btn-soft:active {
  box-shadow: var(--clay-shadow-press-moss);
}

.clay-btn-primary:disabled,
.clay-btn-soft:disabled,
.clay-btn-primary[aria-disabled="true"],
.clay-btn-soft[aria-disabled="true"] {
  opacity: .52;
  cursor: not-allowed;
  transform: none;
}

.clay-pill {
  display: inline-flex;
  align-items: center;
  min-height: 32px;
  gap: var(--space-1);
  border-radius: var(--radius-pill);
  padding: var(--space-1) var(--space-3);
  color: var(--text-strong);
  background: var(--clay-lemon);
  box-shadow: 3px 4px 10px rgba(190, 149, 35, .21);
  font-size: .8125rem;
  font-weight: 800;
}

.clay-input {
  width: 100%;
  min-height: var(--control-primary);
  border: 0;
  border-radius: var(--radius-input);
  padding: var(--space-3) var(--space-4);
  color: var(--text-strong);
  background: var(--bg-input);
  box-shadow: var(--clay-shadow-input);
  font: inherit;
}

.clay-input::placeholder {
  color: var(--text-muted);
  opacity: 1;
}

.clay-input:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 2px;
  box-shadow: var(--clay-shadow-input-focus);
}

.clay-bubble-user,
.clay-bubble-ai {
  max-width: min(80%, 72ch);
  overflow-wrap: anywhere;
  border-radius: 24px 24px 24px 8px;
  padding: var(--space-4) 20px;
  color: var(--text-strong);
}

.clay-bubble-user {
  margin-inline-start: auto;
  border-radius: 24px 24px 8px 24px;
  background: var(--clay-peach);
  box-shadow: var(--clay-shadow-peach);
}

.clay-bubble-ai {
  background: var(--clay-primary);
  box-shadow: var(--clay-shadow-moss);
}

.clay-nav {
  position: relative;
  z-index: var(--layer-sticky);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  min-height: 64px;
  border-radius: var(--radius-card);
  padding: var(--space-2) var(--space-4);
  color: var(--text-strong);
  background: var(--bg-raised);
  box-shadow: var(--clay-shadow-raised);
}

.clay-nav :where(a, button) {
  min-width: var(--control-min);
  min-height: var(--control-min);
}

.clay-nav :where(.active, [aria-current="page"]) {
  color: var(--cta-text);
  background: var(--cta-coral);
}

.clay-card-placeholder {
  position: relative;
  min-height: 144px;
  border: 0;
  border-radius: var(--radius-card);
  padding: var(--space-6);
  color: var(--text-strong);
  background: var(--clay-lemon);
  box-shadow: var(--clay-shadow-lemon);
}

.clay-card-placeholder[data-state="closed"] {
  background: var(--clay-lavender);
  box-shadow: var(--clay-shadow-lavender);
}

.clay-card-placeholder[data-state="forbidden"] {
  outline: 3px solid var(--status-archived);
  outline-offset: -3px;
  background: var(--bg-raised);
  box-shadow: var(--clay-shadow-raised);
}

.clay-card-placeholder[data-state="error"] {
  outline: 3px solid var(--status-danger);
  outline-offset: -3px;
  background: var(--clay-peach);
  box-shadow: var(--clay-shadow-peach);
}

.clay-card :where(pre, code),
.clay-bubble-ai :where(pre, code),
.clay-bubble-user :where(pre, code) {
  color: var(--text-on-dark);
  background: var(--surface-code);
}

.clay-card pre,
.clay-bubble-ai pre,
.clay-bubble-user pre {
  overflow: auto;
  border-radius: var(--radius-input);
  padding: var(--space-4);
}

:where(.clay-btn-primary, .clay-btn-soft, .clay-nav a, .clay-nav button):focus-visible {
  outline: 3px solid var(--focus-ring);
  outline-offset: 3px;
}

/* Admin fallback: lower visual depth without changing component geometry. */
.clay-light {
  --radius-card: 24px;
}

.clay-card.clay-light,
.clay-light .clay-card {
  box-shadow: var(--clay-shadow-light);
}

.clay-light :where(table, .table, .chart, [data-chart], [data-table]) {
  border-radius: var(--radius-input);
  background: var(--bg-raised);
  box-shadow: none;
}

@media (prefers-reduced-motion: reduce) {
  .clay-btn-primary,
  .clay-btn-soft {
    transition-duration: .01ms;
  }

  .clay-btn-primary:hover,
  .clay-btn-primary:active,
  .clay-btn-soft:hover,
  .clay-btn-soft:active {
    transform: none;
  }
}

</style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:var(--candy-bg);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
select,input{font-family:inherit}

.page{max-width:1180px;margin:0 auto;padding:20px 18px 72px}

/* ===== Breadcrumb ===== */
.breadcrumb{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:0.8125rem;color:var(--ink-strong);margin-bottom:16px}
.breadcrumb a{color:var(--candy-blue);text-decoration:none;font-weight:600}
.breadcrumb a:hover{text-decoration:underline}
.breadcrumb .sep{color:var(--ink-muted);opacity:.6}
.breadcrumb .cur{color:var(--ink);font-weight:700}

/* ===== CourseHero：lg 封面2/3 + 购买面板1/3 ===== */
.hero{display:grid;grid-template-columns:1fr;gap:16px;background:var(--ht-fff);border:3px solid var(--ink);border-radius:var(--radius-xl);padding:14px;box-shadow:var(--shadow-3d);margin-bottom:22px}

<script>
/* =====================================================================
 * task46 课程详情 效果图 —— 数据形状对齐契约②
 * series → cohort → module(stage_no 升序) → session(session_no 升序)
 * candy-playful 糖果色（STYLE FROZEN）；契约⑦⑧ 后端未就绪，本图静态演示
 * React 阶段将真实请求 /api/series/{id} + /cohorts + /cohorts/{id}/modules
 * ===================================================================== */
const TS = { scheduled:{cls:"muted",txt:"未开始"}, in_progress:{cls:"primary",txt:"进行中"}, completed:{cls:"success",txt:"已完成"}, cancelled:{cls:"destructive",txt:"已取消"} };

// 系列详情（SeriesDetail 形状，契约② 2.2）
const SERIES = {
  id:1001,institution_id:6,delivery_mode:"online_live",series_code:"SC01001",
  series_name:"通用编程入门班",description:"面向零基础者的通用编程入门课，从变量到项目实战，配合 AI 学习伴侣闯关式学完基础语法。",
  cover_url:null,sale_status:"on_sale",min_price:"2799.00",max_price:"3299.00",
  categories:[{id:1,category_code:"CAT001",category_name:"编程",category_level:1}],
  cohort_count:3,facts:{cohorts:8,learners:1250,rating:4.8},
  meta:"通用编程 · 8 期班 · 每期 8 周 · 直播 + 录播回放"
};

// 班次列表（Cohort 形状，契约② 2.3）——第三班满员演示 disabled
const COHORTS = [
  {id:501,cohort_code:"C201",cohort_name:"通用编程入门班·暑期一班",sale_price:"2999.00",max_student_count:60,current_student_count:42,yn:1,start_date:"2026-07-06",end_date:"2026-08-30",teacher:"王小明"},
  {id:502,cohort_code:"C202",cohort_name:"通用编程入门班·秋季二班",sale_price:"3299.00",max_student_count:60,current_student_count:60,yn:1,start_date:"2026-09-07",end_date:"2026-11-01",teacher:"李清"},
  {id:503,cohort_code:"C203",cohort_name:"通用编程入门班·寒假三班",sale_price:"2799.00",max_student_count:60,current_student_count:15,yn:1,start_date:"2027-01-11",end_date:"2027-03-07",teacher:"赵艺"}
];

// 每班模块 → 课次：task04 移除 mock 大纲（501~503 假数据与真实班次 id 存在碰撞风险，
// 且真实大纲走 /api/study/courses/{sid}/outline 属学习页语境）→ 本页大纲 Tab 走诚实空态
const MODULES = {};

// 可用券（契约⑦ GET /api/coupons?series_id= 形状示意；后端 task16 未就绪）
let COUPONS = [
  {id:1,coupon_name:"新手立减券",discount_amount:50,min_amount:500,received:false},
  {id:2,coupon_name:"开学季满减券",discount_amount:100,min_amount:1000,received:false},
  {id:3,coupon_name:"老学员续费券",discount_amount:200,min_amount:2000,received:true}
];
// 评价：task04 置空 mock（"米粒子/程序员小明"假评价属 MOCK 数据违规）——初始渲染诚实空态，
// 点击评价 Tab 由接线脚本 loadReviews() 拉取真实 GET /api/courses/{sid}/reviews
const REVIEWS = [];

let state="loading", authed=false;   // 等真实接口返回后再展示课程，避免示例内容闪现
// 默认选中「有席位 + 价格最低」班次（消除"最低价"与选中价不一致的认知冲突）
let selected = (COHORTS.filter(c=>c.current_student_count<c.max_student_count).sort((a,b)=>parseFloat(a.sale_price)-parseFloat(b.sale_price))[0]||COHORTS[0]).id;
let collected = new Set(COUPONS.filter(c=>c.received).map(c=>c.id));
let favorited = false;

/* ---------- 领券弹窗 ---------- */
function renderCoupons(){
  const list=document.getElementById("couponList");
  list.innerHTML = COUPONS.map(c=>{
    const got = collected.has(c.id);
    return `<div class="coupon ${got?'received':''}">
      <div class="amount ${c.id===3?'amt-muted':''}"><span class="num">¥${c.discount_amount}</span><span class="cond">满¥${c.min_amount}可用</span></div>
      <div class="body">
        <span class="name">${c.coupon_name}</span>
        <span class="desc">${got?'已领取，下单时可使用':'限本课程系列使用 · 有效期 90 天'}</span>
        <span class="get"><button class="g-btn" data-get="${c.id}" ${got||c.id===3?'disabled':''}>${got?'已领取':'立即领取'}</button></span>
      </div>
    </div>`;
  }).join("");
  list.querySelectorAll("button[data-get]").forEach(b=>b.addEventListener("click",()=>{
    if(!authed){ openCoupon(false); alert("未登录：领券需先登录 → /login?redirect=/courses/1001（J5）"); return; }
    collected.add(+b.dataset.get); renderCoupons();
    document.getElementById("summary").innerHTML = summaryHtml();
  }));
}
function openCoupon(open){ document.getElementById("couponOverlay").classList.toggle("open",open); }
document.getElementById("couponClose").addEventListener("click",()=>openCoupon(false));
document.getElementById("couponDone").addEventListener("click",()=>openCoupon(false));
document.getElementById("couponOverlay").addEventListener("click",e=>{ if(e.target.id==="couponOverlay") openCoupon(false); });

/* ---------- 购买面板 ---------- */
function cohortById(id){ return COHORTS.find(c=>c.id===id); }
function summaryHtml(){
  const c=cohortById(selected);
  if(!c) return '<div class="row"><span>班次</span><span>暂无可报名班次</span></div>'; /* task04：无班次/选中失效守卫 */
  const price=parseFloat(c.sale_price);
  const coupon = [...COUPONS].filter(x=>collected.has(x.id)&& price>=x.min_amount).sort((a,b)=>b.discount_amount-a.discount_amount)[0];
  const pay = coupon ? price - coupon.discount_amount : price;
  const row = (k,v)=>`<div class="row"><span>${k}</span><span>${v}</span></div>`;
  return row("班次", c.cohort_name.split("·").pop()) +
    (coupon?row("优惠券","-¥"+coupon.discount_amount):"") +
    row("实付", `<b style="color:var(--candy-orange);font-weight:800">¥${pay.toLocaleString("zh-CN")}</b>`);
}
function ctaText(){
  const c=cohortById(selected);
  if(!c) return "暂不可报名"; /* task04：无班次守卫 */
  const price=parseFloat(c.sale_price);
  const coupon=[...COUPONS].filter(x=>collected.has(x.id)&&price>=x.min_amount).sort((a,b)=>b.discount_amount-a.discount_amount)[0];
  const pay = coupon ? price - coupon.discount_amount : price;
  return `立即报名 ¥${pay.toLocaleString("zh-CN")}${coupon?` <s style="font-size:12px;opacity:.8;font-weight:600">¥${price.toLocaleString("zh-CN")}</s>`:""}`;
}

/* ---------- 班次卡 ---------- */
function cohortHtml(c){
  const full = c.current_student_count >= c.max_student_count;
  const remaining = c.max_student_count - c.current_student_count;
  const ratio = Math.min(100, Math.round(c.current_student_count/c.max_student_count*100));
  return `<div class="cohort-item">
  <button class="cohort ${selected===c.id?'selected':''} ${full?'disabled':''}" data-cohort="${c.id}" ${full?'disabled':''} role="radio" aria-checked="${selected===c.id}">
    <span class="radio"></span>
    <span class="cohort-info">
      <span class="cohort-name">${c.cohort_name}</span>
      <span class="cohort-tags"><span class="badge ${full?'destructive':'success'}">${full?'已满员':'有席位'}</span><span style="font-size:11px;color:var(--ink-muted)">${c.start_date.split("-").slice(1).join("/")} 开班</span></span>
      <span class="seat-bar"><span class="seat-fill ${ratio>80?'hot':''}" style="width:${ratio}%"></span></span>
      <span style="font-size:11px;color:var(--ink-muted)">${full?'已报满':'余 '+remaining+'/'+c.max_student_count+' 席'} · 班主任 ${c.teacher||"助教团队"}</span>
    </span>
    <span class="cohort-price">¥${parseFloat(c.sale_price).toLocaleString("zh-CN")}</span>
  </button>
  <button class="btn go-learn" data-golearn="${c.id}" style="width:100%;padding:9px 0;background:var(--candy-green);color:#fff;box-shadow:0 4px 0 var(--candy-green-deep)" ${full?'disabled':''}>去学习</button>
  </div>`;
}

/* ---------- 四级树（TreeAccordion）---------- */
function edu(t){ const x=TS[t]||TS.scheduled; return `<span class="badge ${x.cls}">${x.txt}</span>`; }
function moduleHtml(m){
  const sess = [...m.sessions].sort((a,b)=>a.session_no-b.session_no);
  return `<div class="tree-node" data-module="${m.id}">
    <div class="lvl" data-lvl="module">
      <span class="caret">▶</span><span class="star" style="background:var(--candy-green)">${m.stage_no}</span>
      <span class="t-title">${m.module_name}</span>
      <span class="t-meta">${m.lesson_count} 课次 · ${m.total_hours}学时</span>
      <span class="stag">阶段 ${m.stage_no}</span>
    </div>
    <div class="lvl-children" data-children>
      ${sess.map(s=>`<div class="session">
        <span class="no">${s.session_no}</span>
        <span class="s-title">${s.session_title}</span>
        ${edu(s.teaching_status)}
        <span class="s-when">${s.teaching_date} ${s.start_time||""}</span>
      </div>`).join("")}
    </div>
  </div>`;
}
function syllabusHtml(cohortId){
  const mods = MODULES[cohortId] || [];
  if(!mods.length) return `<div class="state-fill" style="border:none"><div class="t">课表暂未在此页展示</div><div class="d">报名后可在「去学习」进入学习页查看完整课表与进度</div></div>`;
  return `<div class="tree">${mods.map(moduleHtml).join("")}</div>`;
}

/* ---------- 评价 Tab ---------- */
function reviewHtml(){
  const list = REVIEWS.map(r=>`<div class="review">
    <div class="row"><span class="ava">${r.who[0]}</span><span class="who">${r.who}</span>
      <span class="stars">${"★".repeat(r.stars)}${"☆".repeat(5-r.stars)}</span>
    </div>
    <p class="txt">${r.txt}</p>
    <div class="meta">${r.date}</div>

  const body = list || `<div class="state-fill" style="border:none"><div class="t">暂无评价</div><div class="d">成为第一个评价者，分享你的学习体验</div></div>`;

function bindTabs(){
  document.querySelectorAll("#tablist .tab").forEach(t=>t.addEventListener("click",()=>{
    document.querySelectorAll("#tablist .tab").forEach(x=>{x.classList.toggle("on",x===t); x.setAttribute("aria-selected",String(x===t));});
    document.querySelectorAll("[data-panel]").forEach(p=>p.classList.toggle("active",p.dataset.panel===t.dataset.tab));
  }));
  document.querySelectorAll("[data-panel=outline] .lvl[data-lvl=module]").forEach(l=>l.addEventListener("click",()=>{
    const open=l.classList.toggle("open");
    if(l.nextElementSibling) l.nextElementSibling.classList.toggle("open",open);
  }));
}
function bindCoupon(){
  const btn=document.getElementById("couponOpen"); if(!btn) return;
  btn.addEventListener("click",()=>{ renderCoupons(); openCoupon(true); });
}

/* task103：班次「去学习」——登录 → 鉴权(access) → 跳 learning.html */
function bindLearn(){
  document.querySelectorAll("#cohortList .go-learn").forEach(function(b){
    b.addEventListener("click", function(ev){
      if (ev) ev.stopPropagation();
      var cid = b.getAttribute("data-golearn");
      if (!(window.EAPI && EAPI.store && EAPI.store.getToken())) {
        if (window.EAPI && EAPI.buildLoginUrl) window.location.href = EAPI.buildLoginUrl(location.pathname + location.search);
        else alert("请先登录");
        return;
      }
      var sid = SERIES.id;
      function go(cohortId, sessionId){
        var q = "learning.html?cohort_id=" + (cohortId||"") + "&session_id=" + (sessionId||"");
        window.location.href = q;
      }
      EAPI.get("/api/study/courses/" + sid + "/access").then(function(acc){
        if (!acc || acc.accessible !== true) {
          alert("你尚未报名该班次，请先报名再进入学习");
          window.location.href = "my-cohorts.html";
          return;
        }
        var cohortId = acc.cohort_id || cid;
        EAPI.get("/api/study/courses/" + sid + "/outline").then(function(o){
          var first = "";
          if (o && o.modules) {
            for (var i=0;i<o.modules.length;i++){ var ss=(o.modules[i].sessions)||[]; if(ss.length){ first=ss[0].id || ss[0].session_id || ""; break; } } /* task04：实测 outline 字段为 session_id */
          }
          go(cohortId, first);
        }).catch(function(){ go(cohortId, ""); });
      }).catch(function(){ alert("鉴权失败，请稍后重试"); });
    });
  });
}

function renderBody(){
  const area=document.getElementById("mainArea");
  if(state==="loading"){
    area.innerHTML = `<section class="hero"><div class="skeleton"></div><div class="skeleton"></div></section><div class="state-fill" style="border:none"><div class="spinner"></div><div class="d">正在加载课程详情…</div></div>`;
    return;
  }
  if(state==="error"){
    area.innerHTML = `<div class="state-fill"><div class="t">😵 课程加载失败</div><div class="d">网络开小差了，请稍后重试</div><button class="btn" onclick="location.reload()">重新加载</button></div>`;
    return;
  }
  area.innerHTML = heroHtml() + tabsHtml();
  bindEnroll(); bindFav(); bindCohorts(); bindTabs(); bindCoupon(); bindLearn();
}

function applyState(s){ state=s; renderBody(); }

/* 初始 */
renderBody();

ll,\"transcode_status\":\"completed\",\"review_status\":\"approved\",\"video_url\":\"https://example.com/offline-video.mp4\",\"chapters\":[]}}","GET /api/study/sessions/205794/video-knowledge":"{\"series_id\":3191,\"session_id\":205794,\"video_id\":205793,\"exercise_count\":4,\"exercise_bank_id\":471,\"artifact_id\":\"1c9de8b84aab3eb639083b1933bed55e4468c8295b39dad17fb629267efa98b5\",\"generation\":\"1c9de8b84aab3eb639083b1933bed55e4468c8295b39dad17fb629267efa98b5\",\"source\":{\"platform\":\"edu\",\"source_kind\":\"existing_video\",\"session_id\":205794,\"video_id\":205793,\"asset_id\":617347,\"media_sha256\":\"20f082a240b3542ae7a2b377c0c8c4ef4fbaa22a31f8059856f6f21bc208067c\",\"url\":\"edu://video/205793\",\"title\":\"1-Introduction 介绍（语义/情景/程序记忆与Laying库）\",\"duration\":150.976009},\"transcript_origin\":\"asr\",\"transcript\":{\"full_text\":\"Welcome to long-term agentic memory with Landraft, built in\\npartnership with Langchain.\\nI'll relate to the welcome back Harrison Chase, co-founder and CEO of Langchain.\\nThanks, Andrew.\\nRecently, we've seen many agentic applications being built,\\nand this has helped us to develop a mental framework that is useful to think about\\nfor when you're adding memory to agents.\\nWe would like to share that with learners.\\nMore and more AI applications persist over time,\\nand this really drives the need for agent memory.\\nAn example would be an AI personal assistant.\\nExactly.\\nAssistance are a great example.\\nThe more they learn, the better they are at future tasks.\\nTo add memory to an agent, you must first figure out what information to store\\nin long-term memory, and also when it comes time to use the information what to retrieve.\\nFirst, on what to store.\\nChatboss initially just stored conversational history in the context memory\\nat each turn of a conversation.\\nBut agents that act for you over time need long-term memory.\\nFor example, a calendar agent might need to persist information about meetings over long periods\\nand across multiple invocations of the agent.\\nThen comes retrieval.\\nRetrieval will take information from memory and inserted into the ARM context.\\nHarrison will show you how to figure out when and what to retrieve.\\nAnd additionally, we also need to decide when to update the stored information.\\nSo should it be updated through each iteration of an agent group\\nor maybe in the background of a time?\\nRight.\\nTo address these questions, we've found that it's useful to think about three types of memories.\\nSemantic memories.\\nThese are facts like important birthdays for a calendar agent.\\nNext is episodic memories.\\nThese are experiences that can help an agent remember how to do tasks.\\nAnd finally, there's procedural memories, which are rules for an agent to follow.\\nTo help manage memory, we've created a new library, Langmem,\\nthat supports a vector database that provides searchable, shareable, persistent storage\\nthat can be updated immediately by the agent or in the background by a helper agent.\\nIn this course, you'll build a useful email assistant that demonstrates all of these concepts using Langmem.\\nSeveral people have worked to create this course.\\nI'd like to thank from Langchain, Landsmartin, Wolfhynthorn, and NinoCompos\\nand from Deepland.ai, Jeff Ladwick.\\nAlright, let's get started on the first lesson.\",\"segments\":[{\"start\":1.23,\"end\":5.39,\"text\":\"Welcome to long-term agentic memory with Landraft, built in\"},{\"start\":5.39,\"end\":6.83,\"text\":\"partnership with Langchain.\"},{\"start\":6.83,\"end\":10.47,\"text\":\"I'll relate to the welcome back Harrison Chase, co-founder and CEO of Langchain.\"},{\"start\":10.47,\"end\":11.47,\"text\":\"Thanks, Andrew.\"},{\"start\":11.47,\"end\":14.91,\"text\":\"Recently, we've seen many agentic applications being built,\"},{\"start\":14.91,\"end\":18.83,\"text\":\"and this has helped us to develop a mental framework that is useful to think about\"},{\"start\":18.83,\"end\":21.23,\"text\":\"for when you're adding memory to agents.\"},{\"start\":21.23,\"end\":23.35,\"text\":\"We would like to share that with learners.\"},{\"start\":23.35,\"end\":26.51,\"text\":\"More and more AI applications persist over time,\"},{\"start\":26.51,\"end\":29.43,\"text\":\"and this really drives the need for agent memory.\"},{\"start\":29.43,\"end\":32.79,\"text\":\"An example would be an AI personal assistant.\"},{\"start\":32.79,\"end\":33.59,\"text\":\"Exactly.\"},{\"start\":33.59,\"end\":35.27,\"text\":\"Assistance are a great example.\"},{\"start\":35.27,\"end\":38.51,\"text\":\"The more they learn, the better they are at future tasks.\"},{\"start\":38.51,\"end\":43.19,\"text\":\"To add memory to an agent, you must first figure out what information to store\"},{\"start\":43.19,\"end\":49.63,\"text\":\"in long-term memory, and also when it comes time to use the information what to retrieve.\"},{\"start\":49.63,\"end\":51.27,\"text\":\"First, on what to store.\"},{\"start\":51.27,\"end\":55.75,\"text\":\"Chatboss initially just stored conversational history in the context memory\"},{\"start\":55.75,\"end\":58.51,\"text\":\"at each turn of a conversation.\"},{\"start\":58.51,\"end\":62.35,\"text\":\"But agents that act for you over time need long-term memory.\"},{\"start\":62.35,\"end\":68.95,\"text\":\"For example, a calendar agent might need to persist information about meetings over long periods\"},{\"start\":68.95,\"end\":72.63,\"text\":\"and across multiple invocations of the agent.\"},{\"start\":72.63,\"end\":74.51,\"text\":\"Then comes retrieval.\"},{\"start\":74.51,\"end\":78.91,\"text\":\"Retrieval will take information from memory and inserted into the ARM context.\"},{\"start\":78.91,\"end\":82.91,\"text\":\"Harrison will show you how to figure out when and what to retrieve.\"},{\"start\":82.91,\"end\":87.87,\"text\":\"And additionally, we also need to decide when to update the stored information.\"},{\"start\":87.87,\"end\":91.23,\"text\":\"So should it be updated through each iteration of an agent group\"},{\"start\":91.23,\"end\":93.79,\"text\":\"or maybe in the background of a time?\"},{\"start\":93.79,\"end\":94.75,\"text\":\"Right.\"},{\"start\":94.75,\"end\":98.95,\"text\":\"To address these questions, we've found that it's useful to think about three types of memories.\"},{\"start\":98.95,\"end\":100.31,\"text\":\"Semantic memories.\"},{\"start\":100.31,\"end\":103.79,\"text\":\"These are facts like important birthdays for a calendar agent.\"},{\"start\":103.79,\"end\":105.87,\"text\":\"Next is episodic memories.\"},{\"start\":105.87,\"end\":109.67,\"text\":\"These are experiences that can help an agent remember how to do tasks.\"},{\"start\":109.67,\"end\":114.19,\"text\":\"And finally, there's procedural memories, which are rules for an agent to follow.\"},{\"start\":114.19,\"end\":117.95,\"text\":\"To help manage memory, we've created a new library, Langmem,\"},{\"start\":117.95,\"end\":123.95,\"text\":\"that supports a vector database that provides searchable, shareable, persistent storage\"},{\"start\":123.95,\"end\":129.55,\"text\":\"that can be updated immediately by the agent or in the background by a helper agent.\"},{\"start\":129.55,\"end\":136.31,\"text\":\"In this course, you'll build a useful email assistant that demonstrates all of these concepts using Langmem.\"},{\"start\":136.31,\"end\":138.91,\"text\":\"Several people have worked to create this course.\"},{\"start\":138.91,\"end\":144.87,\"text\":\"I'd like to thank from Langchain, Landsmartin, Wolfhynthorn, and NinoCompos\"},{\"start\":144.87,\"end\":147.87,\"text\":\"and from Deepland.ai, Jeff Ladwick.\"},{\"start\":147.87,\"end\":150.87,\"text\":\"Alright, let's get started on the first lesson.\"}]},\"chapters\":[{\"title\":\"开场与智能体记忆的需求背景\",\"start\":0,\"summary\":\"视频开场介绍本次内容为智能体长期记忆相关内容，指出越来越多的AI应用需要长期记忆，以AI个人助理为例说明记忆对智能体的重要性。\"},{\"title\":\"智能体记忆的核心问题\",\"start\":38.51,\"summary\":\"讲解为智能体添加记忆需解决的三大核心问题：确定存储的信息、确定检索的时机与内容、确定存储信息的更新方式。\"},{\"title\":\"智能体记忆的分类\",\"start\":98.95,\"summary\":\"明确智能体记忆的三类划分：语义记忆为事实类信息、情景记忆为经验类信息、程序记忆为规则类信息。\"},{\"title\":\"Langmem库的介绍与课程安排\",\"start\":114.19,\"summary\":\"介绍用于管理智能体记忆的Langmem库，说明其存储特性，同时提及课程将通过构建邮件助理的实例演示相关概念，最后致谢并开启第一课。\"}],\"summary\":{\"title\":\"智能体长期记忆的框架与Langmem库介绍\",\"overview\":\"本视频介绍智能体长期记忆的相关内容，由Langchain联合创始人参与讲解，围绕智能体添加记忆的核心问题展开。视频明确了智能体记忆需解决的存储、检索、更新三大核心问题，划分了语义、情景、程序三类记忆类型，并推出了用于管理智能体记忆的Langmem库。该课程将通过构建邮件助理的实例，演示上述所有记忆相关概念的应用。\",\"key_points\":[\"智能体添加记忆需明确存储信息、检索时机与内容、更新存储信息的方式三大核心问题。\",\"语义记忆是智能体可存储的事实类信息，如日历智能体需记录的重要日期。\",\"情景记忆是智能体可存储的经验类信息，用于辅助完成任务的方法记忆。\",\"程序记忆是智能体需遵循的规则类信息，指导智能体的行为逻辑。\",\"Langmem是用于管理智能体记忆的新库，支持可搜索、可共享的持久化存储。\",\"Langmem的存储可由智能体即时更新，也可由辅助智能体在后台更新。\",\"本课程将通过构建邮件助理的实例，演示所有记忆相关概念的应用。\"]},\"knowledge_note\":\"# 智能体长期记忆框架与Langmem库介绍\\n\\n## 内容概览\\n本视频由Langchain联合创始人参与讲解，围绕智能体添加记忆的核心问题展开，明确了智能体记忆需解决的三大核心问题，划分了三类记忆类型，并推出用于管理智能体记忆的Langmem库，课程后续将通过构建邮件助理的实例演示相关概念的应用。\\n\\n## 开场与智能体记忆的需求背景\\n视频开场点明本次内容聚焦智能体长期记忆，指出随着越来越多的AI应用需要长期记忆，记忆对智能体的重要性愈发凸显，以AI个人助理为例，说明智能体掌握的信息越多，后续完成任务的效果越好。\\n\\n## 智能体记忆的核心问题\\n为智能体添加记忆，需明确三大核心问题：\\n1. **存储信息**：确定需要在长期记忆中保存的内容，例如日历智能体需要长期保存会议相关信息，区别于对话历史仅在对话轮次中存储的方式；\\n2. **检索时机与内容**：明确何时需要从记忆中提取信息，以及需要提取哪些信息；\\n3. **更新方式**：确定存储的信息如何更新，既可以由智能体在运行过程中即时更新，也可以由辅助智能体在后台完成更新。\\n\\n## 智能体记忆的分类\\n根据记忆的性质，智能体记忆可分为三类：\\n1. **语义记忆**：存储事实类信息，例如日历智能体需要记录的重要日期；\\n2. **情景记忆**：存储经验类信息，用于辅助智能体掌握完成任务的方法；\\n3. **程序记忆**：存储规则类信息，指导智能体的行为逻辑。\\n\\n## Langmem库介绍与课程安排\\n为解决智能体记忆的管理问题，推出了Langmem库，该库支持可搜索、可共享的持久化存储，适配智能体记忆的存储、检索与更新需求。本课程将通过构建邮件助理的实例，演示上述所有记忆相关概念的实际应用。\",\"mindmap\":{\"version\":1,\"title\":\"1-Introduction 介绍（语义/情景/程序记忆与Laying库）\",\"root\":\"root\",\"nodes\":[{\"id\":\"root\",\"label\":\"1-Introduction 介绍（语义/情景/程序记忆与Laying库）\",\"type\":\"root\",\"summary\":\"本视频介绍智能体长期记忆的相关内容，由Langchain联合创始人参与讲解，围绕智能体添加记忆的核心问题展开。视频明确了智能体记忆需解决的存储、检索、更新三大核心问题，划分了语义、情景、程序三类记忆类型，并推出了用于管理智能体记忆的Langmem库。该课程将通过构建邮件助理的实例，演示上述所有记忆相关概念的应用。\",\"children\":[{\"id\":\"chapter-1\",\"label\":\"开场与智能体记忆的需求背景\",\"     var p = path && path.charAt(0) === "/" ? path : "/" + (path || "");
    return new Promise(function (resolve) { setTimeout(resolve, 60); }).then(function () {
      var out;
      if (method !== "GET") out = mutate(method, p, body);
      else out = routeLookup(method, p);
      if (out.status === 404) throw apiError(404, "资源不存在（离线演示无此数据）");
      return out.data;
    }).catch(function (e) { emitOnce(e); throw e; });
  }

  var EAPI = {
    BASE: (global.location && global.location.origin) || "",
    TOKEN_KEY: TOKEN_KEY, TIMEOUT_MS: 15000,
    get: function (p) { return request("GET", p); },
    post: function (p, b) { return request("POST", p, b); },
    put: function (p, b) { return request("PUT", p, b); },
    patch: function (p, b) { return request("PATCH", p, b); },
    del: function (p) { return request("DELETE", p); },
    store: store, logout: function () { store.clear(); if (!onLoginPage()) gotoLogin(currentPathWithQuery()); },
    onError: onError, getRedirectParam: getRedirectParam, buildLoginUrl: buildLoginUrl, pageId: pageId,
  };
  global.EAPI = EAPI;

  var origFetch = global.fetch ? global.fetch.bind(global) : null;
  global.fetch = function (input, init) {
    var url = typeof input === "string" ? input : (input && input.url) || "";
    if (url.indexOf("/api/chat/stream") >= 0) return Promise.resolve(sseResponse());
    if (url.indexOf("demo/verification.json") >= 0)
      return Promise.resolve(new Response(DEMO_VER, { status: 200, headers: { "Content-Type": "application/json" } }));
    if (url.indexOf("/api/") >= 0 || url.indexOf("samples/") >= 0 || url.indexOf("/media/") >= 0) {
      var method = ((init && init.method) || "GET").toUpperCase();
      var body = null;
      try { body = init && init.body ? JSON.parse(init.body) : null; } catch (e) {}
      if (url.indexOf("samples/") >= 0) return origFetch(input, init).catch(function () { return new Response("[]", { status: 200, headers: { "Content-Type": "application/json" } }); });
      var out = method === "GET" ? routeLookup(method, url.split(/^[a-z]+:\/\/?[^/]*\/|^[a-z]+:\/\//.test(url) ? url.replace(/^[a-z]+:\/\/[^/]*\//, "/") : url).split("?").length ? urlAfterBase(url) : url) : mutate(method, urlAfterBase(url), body);
      function urlAfterBase(u) { var i = u.indexOf("/api/"); return i >= 0 ? u.slice(i) : u; }
      if (out.status === 404) return Promise.resolve(new Response(JSON.stringify({ code: "40400", message: "not found", data: null }), { status: 404, headers: { "Content-Type": "application/json" } }));
      return Promise.resolve(new Response(JSON.stringify({ code: 0, message: "ok", data: out.data }), { status: 200, headers: { "Content-Type": "application/json" } }));
    }
    return origFetch ? origFetch(input, init) : Promise.reject(new Error("offline: fetch blocked"));
  };
})(window);
</script>

<script>
/* ===== 对接真实后端（course-detail：EAPI.pageId 取参 + 详情 + 班次 + 券/下单/评价）=====
 * 已知坑修复：不再用路径正则取 id（静态服务下永远匹配不到、恒回退 1001），改用 ?id=。
 * 2026-09-05 契约⑦⑧ + 评价域真实化（curl 实测契约为准）：
 *   1) 领券弹窗：GET /api/coupons?series_id=（真实可领模板）+ POST /api/trade/coupon/receive（幂等，
 *      body {coupon_template_id}）；未登录弹窗内提示「请先登录后领券」。
 *   2) 下单：POST /api/trade/order —— 必须带 Idempotency-Key 请求头（EAPI.post 不支持自定义头 → 原生 fetch），
 *      body {series_id, cohort_id, coupon_id}；coupon_id = 领券记录 id（GET /api/coupons?status=unused 的 coupon_id，
 *      非 coupon_template_id）；金额服务端重算（券面额 > 订单总额时折扣封顶，实付可为 0）。
 *   3) 评价：GET /api/courses/{sid}/reviews（分页 {total,page,page_size,items}，items 含 nickname/rating/content/
 *      created_at）；POST body {rating:1~5 必填, content 可选}；未报名 40300 / 重复评价 409 —— 后端 message 原样透传。
 * 静态 demo（SERIES/COHORTS/COUPONS/REVIEWS mock + 本地价格演示）保留为骨架与降级底座（未登录静默降级不报错）。 */
(function () {
  if (!window.EAPI) return;
  var sid = EAPI.pageId("id");
  function showEmpty(){
    try {
      var area = document.getElementById("mainArea");
      if (area) area.innerHTML = `<div class="state-fill"><div class="t">课程不存在或链接缺少 id</div><div class="d">请从课程列表选择一个系列课程</div><button class="btn" onclick="location.href='courses.html'">返回课程列表</button></div>`;
    } catch (e) {}
  }
  if (!sid) { showEmpty(); return; }

  /* task04：有 EAPI 且 id 有效 → 立即收敛为 loading 态，覆盖主脚本的 mock 初渲
   * （消除假课程名/假班次闪现），并清空 mock 班次与选中态——
   * 此后任何失败路径（网络/404/空班次）都只会呈现诚实空态，不再回落 mock 数据 */
  try { if (typeof applyState === "function") applyState("loading"); } catch (e) {}
  try {
    if (typeof COHORTS !== "undefined") COHORTS.length = 0;
    if (typeof selected !== "undefined") selected = 0;
    /* UI-P0-1（2026-09-29）：mock 券/已领态只属演示底座，真实模式一律清空——
     * CTA/摘要价格仅取真实班次 sale_price，券抵扣以下单时服务端重算（REAL.bestCoupon）为准，
     * 消除「真实班次 ≥¥2000 时 CTA 显示假 -¥200 券 + 划线价」的误导 */
    if (typeof COUPONS !== "undefined") COUPONS.length = 0;
    if (typeof collected !== "undefined") collected = new Set();
  } catch (e) {}

  /* ---------- 真实数据状态与工具 ---------- */
  var REAL = { sid: sid, bestCoupon: null, couponBusy: false, reviewBusy: false, reviewRating: 5, favBusy: false };
  function hasToken() { return !!(EAPI.store && EAPI.store.getToken()); }
  function loginRedirect() { window.location.href = EAPI.buildLoginUrl(location.pathname + location.search); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }
  function fmtMoney(v) {
    var n = parseFloat(v);
    if (isNaN(n)) n = 0;
    return "¥" + n.toLocaleString("zh-CN", { maximumFractionDigits: 2 });
  }
  function fmtCouponAmt(v) { /* 券面额紧凑显示：10000 → ¥1万，避免撑破券左侧金额格 */
    var n = parseFloat(v);
    if (isNaN(n)) n = 0;
    if (n >= 10000 && n % 10000 === 0) return "¥" + (n / 10000) + "万";
    return "¥" + n.toLocaleString("zh-CN", { maximumFractionDigits: 2 });
  }
  function fmtDay(s) { return String(s == null ? "" : s).replace("T", " ").slice(0, 10); }

  /* ---------- 通用弹窗（评价表单 / 下单结果，复用 .overlay/.dialog 既有样式类）---------- */
  var realOverlay = null;
  function ensureRealOverlay() {
    if (realOverlay && realOverlay.parentNode) return realOverlay;
    realOverlay = document.createElement("div");
    realOverlay.className = "overlay";
    realOverlay.setAttribute("role", "dialog");
    realOverlay.setAttribute("aria-modal", "true");
    realOverlay.innerHTML =
      '<div class="dialog">' +
      '<div class="dialog-head"><h3 id="realDlgTitle">提示</h3><button class="dialog-x" type="button" aria-label="关闭">×</button></div>' +
      '<div class="coupon-list" id="realDlgBody"></div>' +
      '<div class="dialog-foot" id="realDlgFoot"></div>' +
      '</div>';
    document.body.appendChild(realOverlay);
    realOverlay.querySelector(".dialog-x").addEventListener("click", closeRealDialog);
    realOverlay.addEventListener("click", function (e) { if (e.target === realOverlay) closeRealDialog(); });
    return realOverlay;
  }
  function openRealDialog(title, bodyHtml, footHtml) {
    var ov = ensureRealOverlay();
    var t = ov.querySelector("#realDlgTitle"); if (t) t.textContent = title;
    var b = ov.querySelector("#realDlgBody"); if (b) b.innerHTML = bodyHtml;
    var f = ov.querySelector("#realDlgFoot"); if (f) f.innerHTML = footHtml || "";
    ov.classList.add("open");
    return ov;
  }
  function closeRealDialog() { if (realOverlay) realOverlay.classList.remove("open"); }

  /* ---------- ② 价格与下单：我的可用券（unused 里选面额最大的 cash 券，下单自动携带）---------- */
  function loadMyCoupons() {
    if (!hasToken()) return;
    EAPI.get("/api/coupons?page=1&page_size=20&status=unused").then(function (data) {
      var items = (data && data.items) || [];
      var cash = items.filter(function (c) { return c.coupon_type === "cash"; });
      var pool = cash.length ? cash : items;
      pool.sort(function (a, b) { return (parseFloat(b.face_value) || 0) - (parseFloat(a.face_value) || 0); });
      REAL.bestCoupon = pool[0] || null;
      renderMyCouponEntry();
    }).catch(function () { /* 静默降级：入口显示暂无可用券 */ });
  }
  function renderMyCouponEntry() {
    var anchor = document.getElementById("couponOpen");
    var host = anchor ? anchor.parentNode : null;
    if (!host) return;
    var el = document.getElementById("myCouponEntry");
    if (!el) {
      el = document.createElement("div");
      el.id = "myCouponEntry";
      el.className = "summary";
      host.insertBefore(el, anchor.nextSibling);
    }
    var cohort = (typeof cohortById === "function") ? cohortById(selected) : null;
    if (cohort && parseFloat(cohort.sale_price) === 0) {
      el.innerHTML = '<div class="row"><span>免费课程</span><span>不使用优惠券</span></div>' +
        '<div class="row"><span>报名后直接开始学习</span><span>已领优惠券保留</span></div>';
    } else if (REAL.bestCoupon) {
      var amt = REAL.bestCoupon.coupon_type === "discount" ? "折扣券" : "-" + fmtMoney(REAL.bestCoupon.face_value);
      var cond = (parseFloat(REAL.bestCoupon.min_spend) || 0) > 0 ? "满" + fmtMoney(REAL.bestCoupon.min_spend) + "可用" : "无门槛";
      el.innerHTML =
        '<div class="row"><span>🎟️ 我的可用券</span><span>' + cond + " · 下单自动抵扣</span></div>" +
        '<div class="row total"><span>' + esc(REAL.bestCoupon.coupon_name) + "</span><span>" + amt + "</span></div>" +
        '<div class="row"><span>已自动选用面额最大一张</span><span>实付以服务端重算为准</span></div>';
    } else {
      el.innerHTML = '<div class="row"><span>🎟️ 我的可用券</span><span>暂无可用 · 点上方「领券」领取</span></div>';
    }
  }

  /* ---------- ① 领券弹窗真实化（覆盖静态 bindCoupon，renderBody 重渲时生效）---------- */
  function loadCouponDialog() {
    var box = document.getElementById("couponList");
    if (!box) return;
    box.innerHTML = '<div class="state-fill" style="border:none"><div class="spinner"></div><div class="d">正在加载可领券…</div></div>';
    Promise.allSettled([
      EAPI.get("/api/coupons?series_id=" + REAL.sid),
      EAPI.get("/api/coupons?page=1&page_size=100"),
    ]).then(function (rs) {
      var tpls = (rs[0].status === "fulfilled" && Array.isArray(rs[0].value)) ? rs[0].value : null;
      if (!tpls) {
        box.innerHTML = '<div class="state-fill" style="border:none"><div class="t">优惠券加载失败</div><div class="d">请稍后重试</div></div>';
        return;
      }
      var mine = (rs[1].status === "fulfilled" && rs[1].value && rs[1].value.items) ? rs[1].value.items : [];
      renderCouponDialog(tpls, mine);
    });
  }
  function renderCouponDialog(tpls, mine) {
    var box = document.getElementById("couponList");
    if (!box) return;
    var gotIds = {};
    mine.forEach(function (c) { gotIds[c.coupon_template_id] = true; });
    if (!tpls.length) {
      box.innerHTML = '<div class="state-fill" style="border:none"><div class="t">暂无可领优惠券</div><div class="d">本系列当前没有可领取的券，敬请期待</div></div>';
      return;
    }
    box.innerHTML = tpls.map(function (c) {
      var got = !!gotIds[c.coupon_template_id];
      var amt = c.coupon_type === "discount" ? ((parseFloat(c.face_value) || 0) + " 折") : fmtCouponAmt(c.face_value);
      var cond = (parseFloat(c.min_spend) || 0) > 0 ? "满" + fmtMoney(c.min_spend) + "可用" : "无门槛";
      /* Coupon-Unlimited（Owner 方案 A）：total_count === -1 = 不限量，禁显 "N/-1" */
      var stock = Number(c.total_count) === -1
        ? "不限量 · 已领 " + (c.received_count || 0)
        : "已领 " + (c.received_count || 0) + "/" + (c.total_count || 0);
      return '<div class="coupon' + (got ? " received" : "") + '">' +
        '<div class="amount"><span class="num">' + esc(amt) + '</span><span class="cond">' + esc(cond) + "</span></div>" +
        '<div class="body">' +
        '<span class="name">' + esc(c.coupon_name) + "</span>" +
        '<span class="desc">有效期 ' + esc(fmtDay(c.valid_from)) + " ~ " + esc(fmtDay(c.valid_to)) + " · " + esc(stock) + "</span>" +
        '<span class="get"><button class="g-btn" type="button" data-tpl="' + (c.coupon_template_id || 0) + '"' + (got ? " disabled" : "") + ">" + (got ? "已领取" : "立即领取") + "</button></span>" +
        "</div></div>";
    }).join("");
    box.querySelectorAll("button[data-tpl]").forEach(function (b) {
      b.addEventListener("click", function () {
        if (REAL.couponBusy) return;
        REAL.couponBusy = true;
        var old = b.textContent;
        b.disabled = true; b.textContent = "领取中…";
        EAPI.post("/api/trade/coupon/receive", { coupon_template_id: parseInt(b.getAttribute("data-tpl"), 10) })
          .then(function () {
            REAL.couponBusy = false;
            loadCouponDialog(); /* 刷新列表：received_count+1（服务端数据）+ 已领取态 */
            loadMyCoupons();    /* 新领的券可能成为「我的可用券」自动选用项 */
          })
          .catch(function (e) {
            REAL.couponBusy = false;
            b.disabled = false; b.textContent = old;
            showCouponDlgErr(e && e.message ? e.message : "领取失败，请稍后重试");
          });
      });
    });
  }
  function showCouponDlgErr(msg) {
    var box = document.getElementById("couponList");
    if (!box) return;
    var err = document.getElementById("couponDlgErr");
    if (!err) {
      err = document.createElement("div");
      err.id = "couponDlgErr";
      err.style.cssText = "border:2px dashed var(--candy-red);border-radius:10px;padding:8px 12px;font-size:12px;font-weight:700;color:var(--candy-red);background:var(--ht-fff)";
      box.insertBefore(err, box.firstChild);
    }
    err.textContent = "⚠ " + msg;
  }
  window.bindCoupon = function () { /* 覆盖静态 demo 绑定（全局函数，renderBody 重渲即生效） */
    var btn = document.getElementById("couponOpen");
    if (!btn) return;
    btn.addEventListener("click", function () {
      if (!hasToken()) {
        var box = document.getElementById("couponList");
        if (box) {
          box.innerHTML = '<div class="state-fill" style="border:none"><div class="t">请先登录后领券</div><div class="d">登录后可领取本系列优惠券，下单自动抵扣</div><button class="btn" id="couponLoginBtn" type="button">去登录</button></div>';
          var lb = document.getElementById("couponLoginBtn");
          if (lb) lb.addEventListener("click", loginRedirect);
        }
        openCoupon(true);
        return;
      }
      openCoupon(true);
      loadCouponDialog();
    });
  };

  /* ---------- ② 下单真实化（POST /api/trade/order，Idempotency-Key 头必须 → 原生 fetch）---------- */
  function createOrder(payload) {
    var headers = {
      "Content-Type": "application/json",
      "Idempotency-Key": "enroll-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10),
    };
    var tk = EAPI.store.getToken();
    if (tk) headers.Authorization = "Bearer " + tk;
    return fetch((EAPI.BASE || "http://127.0.0.1:9988") + "/api/trade/order", {
      method: "POST", headers: headers, body: JSON.stringify(payload),
    }).then(function (resp) {
      return resp.text().then(function (text) {
        var json = null;
        try { json = text ? JSON.parse(text) : null; } catch (e) {}
        if (resp.status === 401) { loginRedirect(); throw new Error("登录已过期，请重新登录"); }
        if (!resp.ok || (json && json.code !== 0)) throw new Error((json && json.message) || ("HTTP " + resp.status));
        return json ? json.data : null;
      });
    });
  }
  /* B0-FIX（支付闭环）：下单成功 ≠ 报名。补全 发起支付(mock) → mock 回调结算（事务内写
     student_cohort_rel 报名）→ 支付成功界面。mock 回调仅 ADMIN/MANAGER（学生显示待处理态）。 */
  function authJsonHeaders() {
    var headers = { "Content-Type": "application/json" };
    var tk = EAPI.store.getToken();
    if (tk) headers.Authorization = "Bearer " + tk;
    return headers;
  }
  function apiPost(path, body) {
    return fetch((EAPI.BASE || "http://127.0.0.1:9988") + path, {
      method: "POST", headers: authJsonHeaders(), body: JSON.stringify(body || {}),
    }).then(function (resp) {
      return resp.text().then(function (text) {
        var json = null;
        try { json = text ? JSON.parse(text) : null; } catch (e) {}
        if (!resp.ok || (json && json.code !== 0)) {
          var err = new Error((json && json.message) || ("HTTP " + resp.status));
          err.httpStatus = resp.status;
          throw err;
        }
        return json ? json.data : null;
      });
    });
  }
  function dlgRow(k, v) {
    return '<div style="display:flex;justify-content:space-between;gap:12px;font-size:0.8125rem"><span style="color:var(--ink-muted)">' + k + '</span><span style="font-weight:700;text-align:right;word-break:break-all">' + v + "</span></div>";
  }
  function showPayError(errMsg, orderNo) {
    var ov = openRealDialog("😖 下单/支付失败",
      '<div class="state-fill" style="border:none"><div class="t">失败</div><div class="d">' + esc(errMsg) + "</div>" +
      (orderNo ? '<div class="d" style="margin-top:6px">订单号 ' + esc(orderNo) + "（重试不会重复扣款）</div>" : "") + "</div>",
      '<button class="btn-star" type="button">知道了</button>');
    var eb = ov.querySelector("#realDlgFoot button");
    if (eb) eb.addEventListener("click", closeRealDialog);
  }
  function showPaySuccess(order, pay, cohort) {
    var isFree = Number(order.order_amount) === 0 && Number(pay) === 0;
    var ov = openRealDialog(isFree ? "🎉 报名成功，已完成报名" : "🎉 支付成功，已完成报名",
      '<div style="display:grid;gap:8px;padding:2px">' +
      dlgRow("订单号", esc(order.order_no)) +
      dlgRow("课程", esc(order.series_title || "")) +
      dlgRow("班次", esc(cohort.cohort_name || "")) +
      dlgRow("订单金额", fmtMoney(order.order_amount)) +
      ((order.discount_amount > 0) ? dlgRow("券优惠", "-" + fmtMoney(order.discount_amount)) : "") +
      dlgRow("实付", '<b style="color:var(--candy-orange);font-size:16px">' + fmtMoney(pay) + (Number(pay) === 0 ? (isFree ? "（免费课程）" : "（券后全额抵扣）") : "") + "</b>") +
      dlgRow("报名状态", "✅ 已报名（enroll_status=active）") +
      "</div>",
      '<button class="btn-star" type="button" id="goLearnNow">去学习</button>' +
      '<button class="btn" type="button" id="goMyCohorts" style="margin-left:8px">我的课程</button>');
    var gl = ov.querySelector("#goLearnNow");
    if (gl) gl.addEventListener("click", function () {
      closeRealDialog();
      window.location.href = "learning.html?cohort_id=" + encodeURIComponent(cohort.id) + "&session_id=";
    });
    var mc = ov.querySelector("#goMyCohorts");
    if (mc) mc.addEventListener("click", function () {
      closeRealDialog();
      window.location.href = "my-cohorts.html";
    });
  }
  function showPayPending(order, cohort, reason) {
    var ov = openRealDialog("⏳ 订单已创建，支付处理中",
      '<div style="display:grid;gap:8px;padding:2px">' +
      dlgRow("订单号", esc(order.order_no)) +
      dlgRow("原因", esc(reason || "mock 支付回调需要管理员/教师账号确认")) +
      '</div><p style="font-size:11px;color:var(--ink-muted);margin-top:10px">回调完成后报名自动生效；可用管理员账号重试或联系助教。</p>',
      '<button class="btn-star" type="button">知道了</button>');
    var fb = ov.querySelector("#realDlgFoot button");
    if (fb) fb.addEventListener("click", closeRealDialog);
  }
  window.bindEnroll = function () { /* 覆盖静态 demo 绑定：真实下单 → 支付 → 结算 → 报名 */
    var btn = document.getElementById("enrollBtn");
    if (!btn) return;
    renderMyCouponEntry(); /* 切换班次后同步免费/付费的用券提示 */
    btn.addEventListener("click", function () {
      if (!hasToken()) { loginRedirect(); return; }
      var cohort = (typeof cohortById === "function") ? cohortById(selected) : null;
      if (!cohort) return;
      var payload = {
        series_id: (typeof SERIES !== "undefined" && SERIES.id) ? SERIES.id : parseInt(REAL.sid, 10),
        cohort_id: cohort.id,
      };
      var price = parseFloat(cohort.sale_price) || 0;
      if (price > 0 && REAL.bestCoupon && price >= (parseFloat(REAL.bestCoupon.min_spend) || 0)) {
        payload.coupon_id = REAL.bestCoupon.coupon_id; /* 领券记录 id（coupon_receive_record.id） */
      }
      var label = btn.innerHTML;
      btn.disabled = true; btn.textContent = "下单中…";
      createOrder(payload).then(function (order) {
        /* Zero-Pay 在服务端同事务完成报名；已支付订单无需再创建支付记录。 */
        if (order && order.status === "paid") return { order: order, pay: null };
        btn.textContent = "支付中…";
        return apiPost("/api/trade/payment/" + order.order_no, { pay_channel: "mock" }).then(function (pay) {
          return apiPost("/api/trade/payment/" + pay.payment_no + "/mock-notify", { third_party_trade_no: "WEB-" + pay.payment_no }).then(function () {
            return { order: order, pay: pay };
          });
        }).catch(function (notifyErr) {
          if (notifyErr.httpStatus === 403) {
            showPayPending(order, cohort, "mock 支付回调需管理员/教师账号确认（当前账号权限不足）");
            return null;
          }
          throw notifyErr;
        });
      }).then(function (done) {
        btn.disabled = false; btn.innerHTML = label;
        if (done) {
          loadMyCoupons(); /* 同步券状态；免费报名不核销优惠券 */
          showPaySuccess(done.order, (done.order.pay_amount != null) ? done.order.pay_amount : ((done.pay && done.pay.amount) || 0), cohort);
        }
      }).catch(function (e) {
        btn.disabled = false; btn.innerHTML = label;
        showPayError((e && e.message) || "下单失败，请稍后重试");
      });
    });
  };

  /* ---------- ③ 评价区真实化 ---------- */
  function reviewCtaHtml(total, avg) {
    return '<div class="review-cta"><span class="sum">共 ' + total + " 条评价 · 平均 " + avg + ' 分</span><button class="w-btn" id="writeReviewBtn" type="button">✍️ 写评价</button></div>';
  }
  function bindWriteBtn() {
    var b = document.getElementById("writeReviewBtn");
    if (b) b.addEventListener("click", openReviewForm);
  }
  function renderReviewPanel(data) {
    var panel = document.querySelector("[data-panel=review]");
    if (!panel) return;
    var items = (data && data.items) || [];
    var total = (data && typeof data.total === "number") ? data.total : items.length;
    var avg = items.length ? (items.reduce(function (a, r) { return a + (r.rating || 0); }, 0) / items.length).toFixed(1) : "0.0";
    var list = items.map(function (r) {
      var who = r.nickname || (r.user_id ? "学员" + r.user_id : "匿名学员");
      var stars = Math.max(0, Math.min(5, r.rating || 0));
      return '<div class="review">' +
        '<div class="row"><span class="ava">' + esc(who.charAt(0)) + '</span><span class="who">' + esc(who) + "</span>" +
        '<span class="stars">' + "★".repeat(stars) + "☆".repeat(5 - stars) + "</span></div>" +
        '<p class="txt">' + esc(r.content || "（未填写文字评价）") + "</p>" +
        '<div class="meta">' + esc(fmtDay(r.created_at)) + "</div>" +
        "</div>";
    }).join("");
    panel.innerHTML =
      (list || '<div class="state-fill" style="border:none"><div class="t">暂无评价</div><div class="d">报名学习后，成为第一个评价者吧</div></div>') +
      reviewCtaHtml(total, avg);
    bindWriteBtn();
    var tabBtn = document.querySelector('#tablist .tab[data-tab="review"]');
    if (tabBtn) tabBtn.textContent = "⭐ 课程评价 (" + total + ")";
  }
  function loadReviews() {
    var panel = document.querySelector("[data-panel=review]");
    if (!panel || REAL.reviewBusy) return;
    REAL.reviewBusy = true;
    panel.innerHTML = '<div class="state-fill" style="border:none"><div class="spinner"></div><div class="d">正在加载真实评价…</div></div>';
    function failLogin() { /* 未登录读不到：静默降级为登录提示（不强制跳转） */
      REAL.reviewBusy = false;
      panel.innerHTML =
        '<div class="state-fill"><div class="t">登录后查看课程评价</div><div class="d">评价数据需登录后获取</div><button class="btn" id="rvLoginBtn" type="button">去登录</button></div>' +
        reviewCtaHtml(0, "0.0");
      bindWriteBtn();
      var lb = document.getElementById("rvLoginBtn");
      if (lb) lb.addEventListener("click", loginRedirect);
    }
    function failMsg(msg) {
      REAL.reviewBusy = false;
      panel.innerHTML = '<div class="state-fill"><div class="t">评价加载失败</div><div class="d">' + esc(msg) + "</div></div>" + reviewCtaHtml(0, "0.0");
      bindWriteBtn();
    }
    if (hasToken()) {
      EAPI.get("/api/courses/" + REAL.sid + "/reviews?page=1&page_size=20").then(function (data) {
        REAL.reviewBusy = false;
        renderReviewPanel(data);
      }).catch(function (e) { failMsg((e && e.message) || "请稍后重试"); });
      return;
    }
    /* 未登录：裸 fetch 尝试（DEBUG 虚拟管理员可读；生产 401 → 登录提示，绝不经 EAPI 触发跳转） */
    fetch((EAPI.BASE || "http://127.0.0.1:8000") + "/api/courses/" + REAL.sid + "/reviews?page=1&page_size=20")
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (j) {
        REAL.reviewBusy = false;
        if (j && j.code === 0) renderReviewPanel(j.data);
        else failMsg((j && j.message) || "请稍后重试");
      })
      .catch(function () { failLogin(); });
  }
  function renderStarPick() {
    var host = document.getElementById("starPick");
    if (!host) return;
    var html = "";
    for (var i = 1; i <= 5; i++) {
      var on = i <= REAL.reviewRating;
      html += '<button type="button" data-star="' + i + '" aria-label="' + i + ' 星" style="width:40px;height:40px;border:3px solid var(--ink);border-radius:12px;background:' +
        (on ? "var(--candy-yellow)" : "var(--ht-fff)") + ";color:" + (on ? "var(--ink)" : "var(--htc-31-31-31-025)") + ";font-size:20px;box-shadow:0 3px 0 " +
        (on ? "var(--candy-yellow)" : "var(--htc-31-31-31-014)") + '">★</button>';
    }
    host.innerHTML = html;
    host.querySelectorAll("button[data-star]").forEach(function (b) {
      b.addEventListener("click", function () {
        REAL.reviewRating = parseInt(b.getAttribute("data-star"), 10);
        renderStarPick();
      });
    });
  }
  function openReviewForm() {
    if (!hasToken()) { loginRedirect(); return; }
    REAL.reviewRating = 5;
    var name = (typeof SERIES !== "undefined" && SERIES.series_name) || "本课程";
    openRealDialog("✍️ 写评价",
      '<div style="display:grid;gap:10px;padding:2px">' +
      '<div style="font-size:12px;color:var(--ink-muted)">给「' + esc(name) + '」打分（报名后才可提交，见后端校验）</div>' +
      '<div id="starPick" style="display:flex;gap:6px"></div>' +
      '<textarea id="reviewContent" maxlength="2000" placeholder="分享你的学习体验（可选，最多 2000 字）" style="border:3px solid var(--ink);border-radius:12px;padding:10px 12px;font-size:0.8125rem;min-height:96px;resize:vertical;background:var(--candy-bg);font-family:inherit"></textarea>' +
      '<div id="reviewErr" style="display:none;font-size:12px;font-weight:700;color:var(--candy-red)"></div>' +
      "</div>",
      '<button class="btn-star" id="reviewSubmit" type="button">提交评价</button>');
    renderStarPick();
    var sb = document.getElementById("reviewSubmit");
    if (sb) sb.addEventListener("click", submitReview);
  }
  function submitReview() {
    if (REAL.reviewBusy) return;
    REAL.reviewBusy = true;
    var btn = document.getElementById("reviewSubmit");
    var ta = document.getElementById("reviewContent");
    var err = document.getElementById("reviewErr");
    if (err) err.style.display = "none";
    var content = ta ? String(ta.value || "").trim() : "";
    if (btn) { btn.disabled = true; btn.textContent = "提交中…"; }
    EAPI.post("/api/courses/" + REAL.sid + "/reviews", { rating: REAL.reviewRating, content: content || null })
      .then(function () {
        REAL.reviewBusy = false;
        closeRealDialog();
        loadReviews(); /* 成功后刷新评价列表 */
      })
      .catch(function (e) { /* 未购课 40300 / 重复 409 等：后端 message 透传展示 */
        REAL.reviewBusy = false;
        if (btn) { btn.disabled = false; btn.textContent = "提交评价"; }
        if (err) { err.textContent = "⚠ " + ((e && e.message) || "提交失败，请稍后重试"); err.style.display = "block"; }
      });
  }
  /* 评价 tab 点击 → 加载真实评价（document 级委托，renderBody 重渲不丢） */
  document.addEventListener("click", function (e) {
    if (!e.target || !e.target.closest) return;
    if (e.target.closest('#tablist .tab[data-tab="review"]')) loadReviews();
  });

  /* ---------- ④ 收藏真实化（task04：原静态 bindFav 为本地翻转+alert 的假交互）----------
   * curl 实测（2026-09-06，student token）：
   *   POST /api/favorites {series_id, favorite_source?} → 200，幂等（重复收藏返回同一 favorite_id，不重复落库）
   *   GET  /api/favorites → 分页壳 items[].series_id/favorite_id（用于已收藏回显）
   *   DELETE /api/favorites/{id} 返回 deleted:true 但复查列表记录仍在（实测假删除）→ 取消路径不做假交互，
   *   已收藏态再次点击给出诚实提示。 */
  window.bindFav = function () {
    var btn = document.getElementById("favBtn");
    if (!btn) return;
    btn.addEventListener("click", function () {
      if (!hasToken()) { loginRedirect(); return; }
      if (REAL.favBusy) return;
      if (favorited) {
        openRealDialog("❤️ 已收藏",
          '<div class="state-fill" style="border:none"><div class="t">该课程已在收藏中</div><div class="d">可在「个人中心」查看收藏；取消收藏功能暂未开放</div></div>',
          '<button class="btn-star" type="button">知道了</button>');
        var kb = document.querySelector("#realDlgFoot button");
        if (kb) kb.addEventListener("click", closeRealDialog);
        return;
      }
      REAL.favBusy = true;
      EAPI.post("/api/favorites", { series_id: parseInt(REAL.sid, 10) || SERIES.id, favorite_source: "series_detail" })
        .then(function () {
          REAL.favBusy = false;
          favorited = true;
          btn.setAttribute("aria-pressed", "true");
          btn.innerHTML = "♥";
          openRealDialog("🎉 收藏成功",
            '<div class="state-fill" style="border:none"><div class="t">已加入收藏</div><div class="d">可在「个人中心」查看收藏的课程</div></div>',
            '<button class="btn-star" type="button">知道了</button>');
          var kb2 = document.querySelector("#realDlgFoot button");
          if (kb2) kb2.addEventListener("click", closeRealDialog);
        })
        .catch(function (e) {
          REAL.favBusy = false;
          openRealDialog("😖 收藏失败",
            '<div class="state-fill" style="border:none"><div class="t">收藏失败</div><div class="d">' + esc((e && e.message) || "请稍后重试") + "</div></div>",
            '<button class="btn-star" type="button">知道了</button>');
          var kb3 = document.querySelector("#realDlgFoot button");
          if (kb3) kb3.addEventListener("click", closeRealDialog);
        });
    });
  };
  function loadFavState() { /* 已收藏回显（前 50 条内匹配；更早分页外的旧收藏有漏判可能，登记为已知限制） */
    if (!hasToken()) return;
    EAPI.get("/api/favorites?page=1&page_size=50").then(function (data) {
      var items = (data && data.items) || [];
      var hit = items.some(function (f) { return f && f.series_id != null && String(f.series_id) === String(REAL.sid); });
      if (!hit) return;
      favorited = true;
      var btn = document.getElementById("favBtn");
      if (btn) { btn.setAttribute("aria-pressed", "true"); btn.innerHTML = "♥"; }
    }).catch(function () {});
  }

  /* 登录态只影响旧提示文案；真实操作始终以 hasToken() 为准。 */
  if (hasToken() && typeof authed !== "undefined") {
    authed = true;
  }

  /* ---------- 既有 series/cohorts 真实注入（逻辑不动）+ 渲染后追加我的可用券 ---------- */
  Promise.allSettled([
    EAPI.get("/api/series/" + sid),
    EAPI.get("/api/series/" + sid + "/cohorts"),
  ]).then(function (res) {
    var s = res[0].status === "fulfilled" ? res[0].value : null;
    var cohorts = res[1].status === "fulfilled" ? res[1].value : null;
    if (!s || !(s.series_name || s.name)) { showEmpty(); return; }

    if (typeof SERIES !== "undefined") {
      SERIES.id = s.id;
      SERIES.series_name = s.series_name || s.name || SERIES.series_name;
      SERIES.description = s.description || "";
      SERIES.delivery_mode = s.delivery_mode || SERIES.delivery_mode;
      SERIES.series_code = s.series_code || "";
      SERIES.min_price = s.min_price || SERIES.min_price;
      SERIES.max_price = (s.max_price!=null) ? s.max_price : SERIES.min_price;
      SERIES.categories = (s.categories && s.categories.length) ? s.categories : (s.category_names||[]).map(function(n){ return { category_name: n }; });
      SERIES.cohort_count = (typeof s.cohort_count === "number") ? s.cohort_count : 0;
    }
    var t = document.querySelector("h1.title,.title");
    if (t) t.textContent = s.series_name || s.name;
    /* task04：面包屑真实回填（原硬编码"编程/通用编程入门班"对其它课程是错误信息） */
    try {
      var crumbCur = document.querySelector(".breadcrumb .cur");
      if (crumbCur) crumbCur.textContent = s.series_name || s.name || "课程详情";
      var crumbCat = document.getElementById("crumbCat");
      var firstCat = (s.categories && s.categories.length && s.categories[0].category_name) || (s.category_names && s.category_names[0]) || "";
      if (crumbCat && firstCat) crumbCat.textContent = firstCat;
    } catch (e) {}

    var items = cohorts && cohorts.items ? cohorts.items : (Array.isArray(cohorts) ? cohorts : []);
    if (items.length && typeof COHORTS !== "undefined") {
      /* task04 P0 修复：原 COHORTS = items.map(...) 对 const 赋值抛 TypeError，
       * 异常被下方 .catch(showEmpty) 吞掉 → 真实存在的课程（如 id=1）被误报"课程不存在"空态
       * （hero 连同 h1 被顶掉，即"h1 空缺"缺陷根因）。改为 const 兼容的原地替换。 */
      var mapped = items.map(function (c) {
        return { id: c.id, cohort_code: c.cohort_code, cohort_name: c.cohort_name, sale_price: c.sale_price || "0", max_student_count: c.max_student_count || 0, current_student_count: c.current_student_count || 0, yn: c.yn != null ? c.yn : 1, start_date: c.start_date || "", end_date: c.end_date || "", teacher: c.head_teacher_id ? ("教师"+c.head_teacher_id) : "" };
      });
      COHORTS.splice(0, COHORTS.length);
      for (var _ci = 0; _ci < mapped.length; _ci++) COHORTS.push(mapped[_ci]);
    }
    /* task04：班次选中重算不再依赖 items 非空——空/失败路径同样收敛（selected=0 → 各渲染函数走无班次守卫） */
    if (typeof COHORTS !== "undefined") {
      var seatable = COHORTS.filter(function(c){ return c.current_student_count < c.max_student_count; }).sort(function(a,b){ return parseFloat(a.sale_price)-parseFloat(b.sale_price); });
      if (seatable.length) selected = seatable[0].id; else if (COHORTS[0]) selected = COHORTS[0].id; else selected = 0;
    }
    /* task04：先切回 success 态再重渲（本接线在开工处已收敛为 loading 态，直接 renderBody 会短路渲染 loading） */
    try {
      if (typeof applyState === "function") applyState("success");
      else if (typeof renderBody === "function") renderBody();
    } catch (e) {}
    loadMyCoupons(); /* 登录态：渲染「我的可用券」入口（未登录静默跳过） */
    loadFavState();  /* task04：登录态回显已收藏心形 */
  }).catch(function(){ showEmpty(); });
})();
</script>
</body>
</html>
