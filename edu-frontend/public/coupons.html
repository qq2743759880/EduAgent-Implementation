:root{

  --ink-faint:var(--text-muted);

  --border-chip:rgba(46,42,63,.14); --line:rgba(46,42,63,.12);
  --gray-300:rgba(46,42,63,.12);

  --candy-purple-soft:#EFE9FF; --candy-purple:#5B4FC4;
  --candy-orange:var(--cta-coral); --candy-orange-deep:#D65246;
  --candy-red:var(--status-danger); --candy-red-deep:var(--status-danger);
  --candy-blue:var(--focus-ring); --candy-blue-deep:#2B2E6E;
  --candy-blue-soft:rgba(158,201,240,.35); --candy-green-soft:rgba(125,212,168,.22); --candy-orange-soft:rgba(255,181,158,.30);

  --radius-md:0.9rem; --radius-lg:var(--radius-card); --radius-xl:var(--radius-card);
  --htc-31-31-31-014:rgba(78,126,66,.14); --htc-31-31-31-018:rgba(78,126,66,.18);
  --htc-31-31-31-045:rgba(46,42,63,.45); --htc-255-200-0-022:rgba(214,82,70,.22);

*{box-sizing:border-box;margin:0;padding:0}

/* ===== 全局导航（黏土；44px 点击区清偿 G6 存量债）===== */
.gnav-toggle{display:none;position:fixed;top:12px;right:12px;z-index:140;width:44px;height:44px;border:0;background:var(--bg-raised);border-radius:var(--radius-btn);font-size:.875rem;font-weight:900;place-items:center;box-shadow:var(--clay-shadow-light);cursor:pointer;color:var(--text-strong)}

.glayout{display:block;max-width:1180px;margin:0 auto;padding:0}
.gnav{position:sticky;top:0;z-index:130;display:flex;flex-direction:row;align-items:center;gap:12px;width:auto;max-height:none;overflow:visible;background:var(--bg-raised);border:0;border-bottom:2px solid rgba(184,166,255,.28);border-radius:0;box-shadow:0 2px 12px rgba(78,126,66,.10);padding:10px 18px}

.gnav-item{display:inline-flex;align-items:center;justify-content:center;width:auto;min-height:44px;white-space:nowrap;font-size:.8125rem;font-weight:800;color:var(--text-strong);padding:0 14px;border-radius:var(--radius-pill);border:2px solid transparent;transition:background var(--motion-fast) var(--ease-clay),color var(--motion-fast) var(--ease-clay);text-decoration:none}

.gnav-foot{margin-left:auto;margin-top:0;border:0;padding:0;font-size:.6875rem;color:var(--text-muted);font-weight:700;white-space:nowrap}

}

.cp-list{display:flex;flex-direction:column;gap:12px}
.cp-card{position:relative;display:flex;align-items:stretch;gap:0;background:var(--bg-raised);border:0;border-radius:var(--radius-card);box-shadow:var(--clay-shadow-light);overflow:hidden}

.pager{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}

.pager .pg-info{font-size:13px;color:var(--text-muted);font-weight:700}

/* ===== 加载骨架 ===== */
.sk{display:flex;flex-direction:column;gap:12px}
.sk-card{border:2px solid var(--border-chip);border-radius:var(--radius-card);padding:16px;display:flex;gap:14px}
.sk-line{height:14px;border-radius:7px;background:linear-gradient(90deg,#ECE9F4 25%,#F7F5FB 50%,#ECE9F4 75%);background-size:400% 100%;animation:shimmer 1.2s infinite}
.sk-line.w60{width:60%}.sk-line.w90{width:90%}.sk-line.w40{width:40%}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}

/* ===== 分区标题 / 卡片操作区（task05，仅复用既有 token）===== */
.tpl-sec{margin-top:6px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sec-head h2{font-size:16.5px;font-weight:900;color:var(--text-strong);display:flex;align-items:center;gap:8px}

.cp-btn{border:0;border-radius:var(--radius-btn);background:var(--cta-coral);color:var(--cta-text);font-weight:900;font-size:13px;min-height:44px;padding:8px 18px;box-shadow:var(--clay-shadow-coral);white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}

<script>
/* ===== 我的优惠券：GET /api/coupons 真实数据 ===== */
(function () {
  if (!window.EAPI) return;
  if (!EAPI.store.getToken()) { location.replace(EAPI.buildLoginUrl("/coupons.html")); return; }

  var PAGE_SIZE = 20;
  var stage = document.getElementById("cpStage");
  var pager = document.getElementById("cpPager");
  var pgInfo = document.getElementById("pgInfo");
  var pgPrev = document.getElementById("pgPrev");
  var pgNext = document.getElementById("pgNext");
  var curStatus = "unused";
  var curPage = 1;
  var totalPages = 1;

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function showSkeleton() {
    stage.innerHTML = "";
    var box = el("div", "sk");
    for (var i = 0; i < 3; i++) {
      var c = el("div", "sk-card");
      c.appendChild(el("div", "sk-line w40"));
      var r = el("div", "");
      r.style.cssText = "flex:1;display:flex;flex-direction:column;gap:8px;justify-content:center";
      r.appendChild(el("div", "sk-line w90"));
      r.appendChild(el("div", "sk-line w60"));
      c.appendChild(r);
      box.appendChild(c);
    }
    stage.appendChild(box);
    pager.style.display = "none";
  }
  function showError(retry) {
    stage.innerHTML = "";
    var s = el("div", "state");
    var ic = el("div", "st-emoji"); ic.innerHTML = '<svg class="ic" aria-hidden="true"><use href="/assets/icons/icons.svg#ic-warning"/></svg>';
    s.appendChild(ic);
    s.appendChild(el("h3", "", "优惠券加载失败"));
    s.appendChild(el("p", "", "网络开小差了，请稍后重试"));
    var b = el("button", "btn", "重试");
    b.addEventListener("click", retry);
    s.appendChild(b);
    stage.appendChild(s);
    pager.style.display = "none";
  }
  function showEmpty() {
    stage.innerHTML = "";
    var s = el("div", "state");
    var label = curStatus === "unused" ? "可使用" : curStatus === "used" ? "已使用" : "已过期";
    var ic = el("div", "st-emoji"); ic.innerHTML = '<svg class="ic" aria-hidden="true"><use href="/assets/icons/icons.svg#ic-info"/></svg>';

    s.appendChild(a);
    stage.appendChild(s);
    pager.style.display = "none";
  }

  /* face_value 语义：cash=金额(元)；discount=折扣率(0.8→8折)；trial/gift=兑换类 */
  function faceText(c) {
    var v = Number(c.face_value) || 0;
    if (c.coupon_type === "discount") {
      var zhe = Math.round(v * 1000) / 100; // 0.85 → 8.5
      return (zhe % 1 === 0 ? zhe.toFixed(0) : zhe.toFixed(1)) + "折";
    }
    if (c.coupon_type === "trial") return "试用";
    if (c.coupon_type === "gift") return "赠券";
    return "¥" + v.toLocaleString("zh-CN", { maximumFractionDigits: 2 });
  }
  function minText(c) {
    var m = Number(c.min_spend) || 0;
    return m > 0 ? "满 ¥" + m.toLocaleString("zh-CN", { maximumFractionDigits: 2 }) + " 可用" : "无门槛";
  }
  function d10(s) { return s ? String(s).slice(0, 10) : ""; }

  var STATUS_LABEL = { unused: "可使用", used: "已使用", expired: "已过期" };
  var TYPE_LABEL = { cash: "现金券", discount: "折扣券", trial: "试用券", gift: "赠券" };

  function renderList(data) {
    stage.innerHTML = "";
    var list = el("div", "cp-list");
    (data.items || []).forEach(function (c) {

      body.appendChild(m1);

      } else {

        act.appendChild(ob);
        card.appendChild(act);
      }
      list.appendChild(card);

  function updatePager(total) {
    totalPages = Math.max(1, Math.ceil((total || 0) / PAGE_SIZE));
    pager.style.display = totalPages > 1 ? "flex" : "none";
    pgPrev.disabled = curPage <= 1;
    pgNext.disabled = curPage >= totalPages;
    pgInfo.textContent = "第 " + curPage + " / " + totalPages + " 页 · 共 " + (total || 0) + " 张";
  }
  function setTabBadge(status, total) {
    var btn = document.querySelector('.tab[data-status="' + status + '"]');
    if (!btn) return;
    var old = btn.querySelector(".cnt");
    if (old) old.remove();
    var s = el("span", "cnt", String(total));
    btn.appendChild(s);
  }

  function load(status, page) {
    curStatus = status;
    curPage = page;
    showSkeleton();
    EAPI.get("/api/coupons?status=" + encodeURIComponent(status) + "&page=" + page + "&page_size=" + PAGE_SIZE)
      .then(function (data) {
        if (!data) { showError(function () { load(status, page); }); return; }
        setTabBadge(status, data.total);
        if (!data.items || !data.items.length) { showEmpty(); updatePager(data.total); return; }
        renderList(data);
        updatePager(data.total);
      })
      .catch(function () { showError(function () { load(status, page); }); });
  }

  document.querySelectorAll(".tab").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll(".tab").forEach(function (b) {
        b.classList.remove("on");

      });
      btn.classList.add("on");
      btn.setAttribute("aria-selected", "true");
      load(btn.getAttribute("data-status"), 1);
    });
  });
  pgPrev.addEventListener("click", function () { if (curPage > 1) load(curStatus, curPage - 1); });
  pgNext.addEventListener("click", function () { if (curPage < totalPages) load(curStatus, curPage + 1); });

  /* task05：领券/下单成功后由领券区/下单弹窗广播 cp:refresh，静默刷新当前 tab 与角标 */
  window.addEventListener("cp:refresh", function () { load(curStatus, 1); });

  load("unused", 1);
})();
</script>
<script>
/* ===== task05：领券中心（GET /api/coupons/templates + POST /api/trade/coupon/receive）
   + 下单真实闭环（GET /api/series → GET /api/series/{id}/cohorts → POST /api/trade/order，
   必带 Idempotency-Key 请求头，成功展示 order_no）。
   注：EAPI.post 不支持自定义请求头 → 下单走页面内 postWithHeaders（shell 解包/401 语义与 EAPI 对齐）。
   重复领取：服务端幂等（code=0 返回原券记录，非错误码）→ 以已持券集合做诚实提示。 ===== */
(function () {
  if (!window.EAPI) return;
  if (!EAPI.store.getToken()) return; // 未登录跳转由主 IIFE 处理

  /* ---------- 小工具 ---------- */
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function fmt(v) { return (Number(v) || 0).toLocaleString("zh-CN", { maximumFractionDigits: 2 }); }
  function d10(s) { return s ? String(s).slice(0, 10) : ""; }
  var TYPE_LABEL = { cash: "现金券", discount: "折扣券", trial: "试用券", gift: "赠券" };
  var ORDER_STATUS_LABEL = { pending: "待支付", paid: "已支付", completed: "已完成", cancelled: "已取消", partial_refunded: "部分退款", refunded: "已退款" };
  function faceText(c) {
    var v = Number(c.face_value) || 0;
    if (c.coupon_type === "discount") {
      var zhe = Math.round(v * 1000) / 100;
      return (zhe % 1 === 0 ? zhe.toFixed(0) : zhe.toFixed(1)) + "折";
    }
    if (c.coupon_type === "trial") return "试用";
    if (c.coupon_type === "gift") return "赠券";
    return "¥" + fmt(v);
  }
  function minText(c) {
    var m = Number(c.min_spend) || 0;
    return m > 0 ? "满 ¥" + fmt(m) + " 可用" : "无门槛";
  }
  function isExpired(t) {
    try { return t.valid_to ? (new Date(t.valid_to).getTime() < Date.now()) : false; } catch (e) { return false; }
  }

  /* 本地 toast：仅正向/信息提示；接口错误由 EAPI 全局 toast 或弹窗内 msg 承担，避免重复 */
  var toastEl = null, toastTimer = null;
  function toast(msg) {
    if (!toastEl) {
      toastEl = el("div", "cp-toast");
      toastEl.setAttribute("role", "status");
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 3200);
  }

  /* ---------- 领券中心 ---------- */
  var tplStage = document.getElementById("tplStage");

  function tplSkeleton() {
    tplStage.innerHTML = "";
    var box = el("div", "sk");
    for (var i = 0; i < 2; i++) {
      var c = el("div", "sk-card");
      c.appendChild(el("div", "sk-line w40"));
      var r = el("div", "");
      r.style.cssText = "flex:1;display:flex;flex-direction:column;gap:8px;justify-content:center";
      r.appendChild(el("div", "sk-line w90"));
      r.appendChild(el("div", "sk-line w60"));
      c.appendChild(r);
      box.appendChild(c);
    }
    tplStage.appendChild(box);
  }
  function tplError(retry) {
    tplStage.innerHTML = "";
    var s = el("div", "state");
    var ic = el("div", "st-emoji"); ic.innerHTML = '<svg class="ic" aria-hidden="true"><use href="/assets/icons/icons.svg#ic-warning"/></svg>';
    s.appendChild(ic);
    s.appendChild(el("h3", "", "可领券列表加载失败"));
    s.appendChild(el("p", "", "网络开小差了，请稍后重试"));
    var b = el("button", "btn", "重试");
    b.addEventListener("click", retry);
    s.appendChild(b);
    tplStage.appendChild(s);
  }
  function tplEmpty() {
    tplStage.innerHTML = "";
    var s = el("div", "state");
    var ic = el("div", "st-emoji"); ic.innerHTML = '<svg class="ic" aria-hidden="true"><use href="/assets/icons/icons.svg#ic-info"/></svg>';
    s.appendChild(ic);
    s.appendChild(el("h3", "", "暂无可领的优惠券"));
    s.appendChild(el("p", "", "新券上线后会第一时间出现在这里"));
    tplStage.appendChild(s);
  }

  function renderTemplates(list) {
    tplStage.innerHTML = "";
    var wrap = el("div", "cp-list");
    (list || []).forEach(function (t) {
      var card = el("article", "cp-card");
      card.setAttribute("data-type", t.coupon_type || "cash");
      var left = el("div", "cp-left");
      left.appendChild(el("div", "cp-val", faceText(t)));
      left.appendChild(el("div", "cp-min", minText(t)));
      var body = el("div", "cp-body");
      body.appendChild(el("div", "cp-name", t.coupon_name || "未命名优惠券"));
      var m1 = el("div", "cp-meta");
      m1.appendChild(document.createTextNode("类型 " + (TYPE_LABEL[t.coupon_type] || t.coupon_type || "—") + " · 有效期 " + d10(t.valid_from) + " ~ " + d10(t.valid_to)));
      body.appendChild(m1);
      var total = Number(t.total_count) || 0;
      var remain = Math.max(0, total - (Number(t.received_count) || 0));
      var m2 = el("div", "cp-meta");
      m2.appendChild(document.createTextNode("剩余 " + remain + " / " + total + " 张 · 每人限领 " + (t.per_user_limit != null ? t.per_user_limit : 1) + " 张"));
      body.appendChild(m2);
      var act = el("div", "cp-actions");
      var btn;
      if (remain <= 0) {
        btn = el("button", "cp-btn", "已领完");
        btn.disabled = true;
      } else if (isExpired(t)) {
        btn = el("button", "cp-btn", "已过期");
        btn.disabled = true;
      } else {
        btn = el("button", "cp-btn", "立即领取");
        btn.setAttribute("aria-label", "领取优惠券「" + (t.coupon_name || "") + "」");
        btn.addEventListener("click", function () { onReceive(t, btn); });
      }
      act.appendChild(btn);
      card.appendChild(left);
      card.appendChild(body);
      card.appendChild(act);
      wrap.appendChild(card);
    });
    tplStage.appendChild(wrap);
  }

  /* 已持券模板集合（ coupon_template_id → true ）：重复领取的诚实提示依据。
     必须在领券 POST 之前取快照（否则新领记录会污染判重）；预取失败置空缓存允许重试。 */
  var heldPromise = null;
  function ensureHeld() {
    if (heldPromise) return heldPromise;
    heldPromise = (function () {
      var set = {}, page = 1;
      function step() {
        return EAPI.get("/api/coupons?page=" + page + "&page_size=100").then(function (data) {
          (data && data.items ? data.items : []).forEach(function (c) { set[c.coupon_template_id] = true; });
          var total = (data && data.total) || 0;
          if (page * 100 < total && page < 10) { page += 1; return step(); }
          return set;
        });
      }
      return step();
    })().catch(function () { heldPromise = null; return null; }); // 预取失败不阻塞领取（POST 本身幂等），仅退化为无法预判重复
    return heldPromise;
  }

  function refreshAfterChange() {
    try { window.dispatchEvent(new CustomEvent("cp:refresh")); } catch (e) {}
    loadTemplates(false);
  }

  function loadTemplates(showSkeleton) {
    if (showSkeleton) tplSkeleton();
    EAPI.get("/api/coupons/templates")
      .then(function (data) {
        if (!data || !data.length) { tplEmpty(); return; }
        renderTemplates(data);
      })
      .catch(function () { tplError(function () { loadTemplates(true); }); });
  }

  function onReceive(t, btn) {
    var old = btn.textContent;
    btn.disabled = true;
    btn.textContent = "领取中…";
    ensureHeld().then(function (setBefore) {
      /* setBefore = 领取前的已持券快照（POST 前解析完成），dup 判定才诚实 */
      return EAPI.post("/api/trade/coupon/receive", { coupon_template_id: t.coupon_template_id }).then(function (coupon) {
        var dup = !!(setBefore && setBefore[t.coupon_template_id]);
        if (setBefore) setBefore[t.coupon_template_id] = true;
        btn.textContent = "已领取";
        var no = coupon && coupon.coupon_id != null ? "#" + coupon.coupon_id : "";
        toast(dup
          ? "该券已领取过：服务端幂等返回原券记录 " + no
          : "领取成功 " + no + "，可在「可使用」中查看");
        refreshAfterChange();
      });
    }).catch(function () {
      /* 错误提示由 EAPI 全局 toast（含 40920 已领完等真实错误码文案），这里只还原按钮 */
      btn.disabled = false;
      btn.textContent = old;
    });
  }

  /* ---------- 下单弹窗 ---------- */
  var overlay = document.getElementById("omOverlay");
  var omBody = document.getElementById("omBody");
  var omTitle = document.getElementById("omTitle");
  var omClose = document.getElementById("omClose");
  var flow = null;

  function newIdemKey() {
    try { if (window.crypto && typeof window.crypto.randomUUID === "function") return "web-" + window.crypto.randomUUID(); } catch (e) {}
    return "web-" + Date.now() + "-" + String(Math.floor(Math.random() * 1e8));
  }
  function mkErr(status, message, payload) {
    var e = new Error(message || "请求失败");
    e.status = status;
    e.body = payload;
    return e;
  }
  function errCode(err) { return err && err.body && err.body.code != null ? String(err.body.code) : ""; }

  /* 带自定义头的 POST（下单必须 Idempotency-Key；EAPI.post 不支持额外头）。
     shell 解包 / 401 语义与 EAPI.parseResponse 对齐；401 → EAPI.logout() 跳登录。 */
  function postWithHeaders(path, payload, extra) {
    var headers = { "Content-Type": "application/json" };
    var k;
    for (k in (extra || {})) { if (Object.prototype.hasOwnProperty.call(extra, k)) headers[k] = extra[k]; }
    var t = EAPI.store.getToken();
    if (t) headers.Authorization = "Bearer " + t;
    var ctrl = (typeof AbortController === "function") ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, 20000) : null;
    return fetch((EAPI.BASE || "") + path, {
      method: "POST",
      headers: headers,
      body: JSON.stringify(payload),
      signal: ctrl ? ctrl.signal : undefined,
    }).then(function (resp) {
      if (timer !== null) clearTimeout(timer);
      return resp.text().then(function (text) {
        var json = null;
        try { json = text ? JSON.parse(text) : null; } catch (e) {}
        if (resp.status === 401) { EAPI.logout(); throw mkErr(resp.status, "登录已过期，请重新登录", json); }
        if (!resp.ok) throw mkErr(resp.status, (json && json.message) || ("HTTP " + resp.status), json);
        if (json && typeof json === "object" && !Array.isArray(json) && json.code !== undefined) {
          if (json.code === 0) return json.data;
          throw mkErr(resp.status, json.message || ("请求失败（code=" + json.code + "）"), json);
        }
        return json;
      });
    }, function (e) {
      if (timer !== null) clearTimeout(timer);
      if (ctrl && ctrl.signal && ctrl.signal.aborted) throw mkErr(0, "下单请求超时（20s），请重试");
      throw mkErr(0, "网络错误，请稍后重试");
    });
  }

  function miniSkeleton() {
    var box = el("div", "om-mini");
    for (var i = 0; i < 3; i++) box.appendChild(el("div", "sk-line"));
    return box;
  }
  function miniState(iconHtml, title, sub, retry) {
    var box = el("div", "om-mini");
    var ic = el("div", "");
    ic.innerHTML = iconHtml;
    box.appendChild(ic);
    box.appendChild(el("div", "", title));
    if (sub) box.appendChild(el("div", "", sub));
    if (retry) {
      var b = el("button", "cp-btn ghost", "重试");
      b.addEventListener("click", retry);
      box.appendChild(b);
    }
    return box;
  }
  function couponChip(c) { return el("span", "om-chip", (c.coupon_name || "优惠券") + " · " + faceText(c) + " · " + minText(c)); }

  function openModal(coupon) {
    if (!EAPI.store.getToken()) { location.replace(EAPI.buildLoginUrl("/coupons.html")); return; }
    flow = { coupon: coupon, step: "series", kw: "", page: 1, series: null, cohort: null, order: null, submitting: false, idemKey: newIdemKey() };
    overlay.classList.add("open");
    renderModal();
  }
  function closeModal() {
    if (flow && flow.submitting) return; // 提交中禁止关闭（防重复下单：幂等键随弹窗会话持有）
    overlay.classList.remove("open");
    omBody.innerHTML = "";
    flow = null;
  }

  /* 前端抵扣预估（与服务端 _compute_discount 同语义；仅展示用，实付以服务端核算为准） */
  function estimate(price, c) {
    if (!c) return 0;
    var v = Number(c.face_value) || 0;
    if (c.coupon_type === "discount") return v > 0 ? Math.round(price * (1 - v) * 100) / 100 : 0;
    if (c.coupon_type === "trial" || c.coupon_type === "gift") return 0;
    return v;
  }

  function renderModal() {
    if (!flow) return;
    omTitle.textContent = "使用优惠券下单 · " + (flow.coupon.coupon_name || "优惠券");
    omBody.innerHTML = "";
    if (flow.step === "series") renderSeriesStep();
    else if (flow.step === "cohorts") renderCohortsStep();
    else if (flow.step === "confirm") renderConfirmStep();
    else renderSuccessStep();
  }

  /* step 1：选课程系列（GET /api/series，仅展示 on_sale） */
  function renderSeriesStep() {
    omBody.appendChild(couponChip(flow.coupon));
    var search = el("div", "om-search");
    var inp = el("input");
    inp.type = "search";
    inp.placeholder = "输入课程系列关键词（如：编程）";
    inp.setAttribute("aria-label", "课程系列关键词");
    inp.value = flow.kw;
    var sb = el("button", "cp-btn", "搜索");
    search.appendChild(inp);
    search.appendChild(sb);
    omBody.appendChild(search);
    var box = el("div", "");
    omBody.appendChild(box);
    function doSearch() { flow.kw = inp.value.trim(); flow.page = 1; loadSeries(box); }
    sb.addEventListener("click", doSearch);
    inp.addEventListener("keydown", function (e) { if ((e.key || "") === "Enter") doSearch(); });
    loadSeries(box);
  }
  function loadSeries(box) {
    box.innerHTML = "";
    box.appendChild(miniSkeleton());
    var q = "?page=" + flow.page + "&page_size=8" + (flow.kw ? "&keyword=" + encodeURIComponent(flow.kw) : "");
    EAPI.get("/api/series" + q).then(function (data) {
      var items = (data && data.items ? data.items : []).filter(function (s) { return (s.sale_status || "") === "on_sale"; });
      var total = (data && data.total) || 0;
      box.innerHTML = "";
      if (!items.length) {
        box.appendChild(miniState('<svg class="ic" aria-hidden="true"><use href="/assets/icons/icons.svg#ic-magnifying-glass"/></svg>', "没有可下单的课程系列", flow.kw ? "换个关键词试试" : "课程系列暂未上架在售"));
        return;
      }
      var list = el("div", "pick-list");
      items.forEach(function (s) {
        var it = el("button", "pick-item");
        it.type = "button";
        var main = el("div", "pk-main");
        main.appendChild(el("div", "pk-name", s.series_name || ("系列 #" + s.id)));
        main.appendChild(el("div", "pk-sub", "在售 · 班次价 " + fmt(s.min_price) + " 元起"));
        it.appendChild(main);
        it.appendChild(el("span", "pk-price", "¥" + fmt(s.min_price)));
        it.addEventListener("click", function () {
          flow.series = s;
          flow.cohort = null;
          flow.step = "cohorts";
          renderModal();
        });
        list.appendChild(it);
      });
      box.appendChild(list);
      if (total > 8) {
        var pg = el("div", "om-pager");
        var prev = el("button", "", "‹ 上一页"); prev.type = "button";
        var info = el("span", "pg-info", "第 " + flow.page + " 页 · 共 " + total + " 个系列");
        var next = el("button", "", "下一页 ›"); next.type = "button";
        prev.disabled = flow.page <= 1;
        next.disabled = flow.page * 8 >= total;
        prev.addEventListener("click", function () { if (flow.page > 1) { flow.page -= 1; loadSeries(box); } });
        next.addEventListener("click", function () { if (flow.page * 8 < total) { flow.page += 1; loadSeries(box); } });
        pg.appendChild(prev); pg.appendChild(info); pg.appendChild(next);
        box.appendChild(pg);
      }
    }).catch(function (err) {
      box.innerHTML = "";
      box.appendChild(miniState('<svg class="ic" aria-hidden="true"><use href="/assets/icons/icons.svg#ic-warning"/></svg>', "课程系列加载失败", (err && err.message) || "网络错误", function () { loadSeries(box); }));
    });
  }

  /* step 2：选班次（GET /api/series/{id}/cohorts，yn=1 且未满员可选） */
  function renderCohortsStep() {
    omBody.appendChild(couponChip(flow.coupon));
    var back = el("button", "om-back", "‹ 重选课程系列");
    back.type = "button";
    back.addEventListener("click", function () { flow.step = "series"; renderModal(); });
    omBody.appendChild(back);
    omBody.appendChild(el("div", "om-chip", (flow.series.series_name || ("系列 #" + flow.series.id))));
    var box = el("div", "");
    omBody.appendChild(box);
    loadCohorts(box);
  }
  function loadCohorts(box) {
    box.innerHTML = "";
    box.appendChild(miniSkeleton());
    EAPI.get("/api/series/" + encodeURIComponent(flow.series.id) + "/cohorts").then(function (data) {
      var items = (data && data.items ? data.items : []).filter(function (c) { return Number(c.yn) === 1; });
      box.innerHTML = "";
      if (!items.length) {
        box.appendChild(miniState('<svg class="ic" aria-hidden="true"><use href="/assets/icons/icons.svg#ic-info"/></svg>', "该系列暂无可报名班次", "可返回重选其它课程系列"));
        return;
      }
      var list = el("div", "pick-list");
      items.forEach(function (c) {
        var full = Number(c.current_student_count) >= Number(c.max_student_count);
        var it = el("button", "pick-item");
        it.type = "button";
        if (full) it.disabled = true;
        var seats = Math.max(0, Number(c.max_student_count) - Number(c.current_student_count));
        var main = el("div", "pk-main");
        main.appendChild(el("div", "pk-name", c.cohort_name || c.cohort_code || ("班次 #" + c.id)));
        main.appendChild(el("div", "pk-sub", (c.cohort_code || "—") + " · " + d10(c.start_date) + " 开班 · 余位 " + seats + (full ? "（已满员）" : "")));
        it.appendChild(main);
        it.appendChild(el("span", "pk-price", "¥" + fmt(c.sale_price)));
        it.addEventListener("click", function () {
          if (full) return;
          flow.cohort = c;
          flow.step = "confirm";
          renderModal();
        });
        list.appendChild(it);
      });
      box.appendChild(list);
    }).catch(function (err) {
      box.innerHTML = "";
      box.appendChild(miniState('<svg class="ic" aria-hidden="true"><use href="/assets/icons/icons.svg#ic-warning"/></svg>', "班次加载失败", (err && err.message) || "网络错误", function () { loadCohorts(box); }));
    });
  }

  /* step 3：确认 + 提交订单（POST /api/trade/order，Idempotency-Key） */
  function renderConfirmStep() {
    omBody.appendChild(couponChip(flow.coupon));
    var back = el("button", "om-back", "‹ 重选班次");
    back.type = "button";
    back.addEventListener("click", function () { flow.step = "cohorts"; renderModal(); });
    omBody.appendChild(back);

    var price = Number(flow.cohort.sale_price) || 0;
    var cp = flow.coupon;
    var est = estimate(price, cp);
    var minSpend = Number(cp.min_spend) || 0;
    var belowMin = minSpend > 0 && price < minSpend;
    var payable = Math.max(0, price - est);

    var rows = el("div", "om-rows");
    function row(label, val, cls) {
      var r = el("div", "om-row" + (cls ? " " + cls : ""));
      r.appendChild(el("span", "", label));
      r.appendChild(el("b", "", val));
      return r;
    }
    rows.appendChild(row("课程系列", flow.series.series_name || ("系列 #" + flow.series.id)));
    rows.appendChild(row("班次", (flow.cohort.cohort_name || flow.cohort.cohort_code || ("班次 #" + flow.cohort.id))));
    rows.appendChild(row("班次价格", "¥" + fmt(price)));
    rows.appendChild(row("优惠券抵扣（预估）", "-" + fmt(est) + "（" + (TYPE_LABEL[cp.coupon_type] || cp.coupon_type || "—") + "）"));
    rows.appendChild(row("预估实付", "¥" + fmt(payable), "total"));
    omBody.appendChild(rows);

    if (belowMin) {
      var warn = el("div", "om-msg warn");
      warn.textContent = "该券满 ¥" + fmt(minSpend) + " 可用，当前班次 ¥" + fmt(price) + " 未达门槛，请返回选择价格更高的班次";
      omBody.appendChild(warn);
    }
    var note = el("div", "om-note");
    note.textContent = "抵扣金额为页面预估，以下单接口服务端核算为准（金额服务端重算，防篡改）。下单成功后优惠券立即核销。";
    omBody.appendChild(note);

    var msg = el("div", "om-msg");
    omBody.appendChild(msg);

    var submit = el("button", "cp-btn", belowMin ? "提交订单" : "提交订单（预估实付 ¥" + fmt(payable) + "）");
    submit.style.alignSelf = "center";
    if (belowMin) submit.disabled = true;
    submit.addEventListener("click", function () {
      if (flow.submitting) return;
      flow.submitting = true;
      var old = submit.textContent;
      submit.disabled = true;
      submit.textContent = "提交中…";
      postWithHeaders(
        "/api/trade/order",
        { series_id: flow.series.id, cohort_id: flow.cohort.id, coupon_id: flow.coupon.coupon_id },
        { "Idempotency-Key": flow.idemKey }
      ).then(function (order) {
        flow.order = order;
        flow.submitting = false;
        flow.step = "success";
        refreshAfterChange(); // 券已核销：静默刷新我的券列表与角标
        renderModal();
      }).catch(function (err) {
        flow.submitting = false;
        submit.disabled = false;
        submit.textContent = old;
        msg.className = "om-msg err";
        msg.textContent = ((err && err.message) || "下单失败，请稍后重试") + (errCode(err) ? "（错误码 " + errCode(err) + "）" : "");
      });
    });
    omBody.appendChild(submit);
  }

  /* step 4：成功（展示真实订单号） */
  function renderSuccessStep() {
    var o = flow.order || {};
    var box = el("div", "om-success");
    var okIc = el("div", "");
    okIc.innerHTML = '<svg class="ic" aria-hidden="true" style="width:34px;height:34px"><use href="/assets/icons/icons.svg#ic-check-circle"/></svg>';
    box.appendChild(okIc);
    box.appendChild(el("h3", "", "下单成功"));
    var no = el("div", "om-no", o.order_no || "—");
    no.setAttribute("aria-label", "订单号");
    box.appendChild(no);
    var rows = el("div", "om-rows");
    function row(label, val) {
      var r = el("div", "om-row");
      r.appendChild(el("span", "", label));
      r.appendChild(el("b", "", val));
      return r;
    }
    rows.appendChild(row("课程系列", flow.series.series_name || "—"));
    rows.appendChild(row("班次", flow.cohort.cohort_name || flow.cohort.cohort_code || "—"));
    rows.appendChild(row("订单金额", "¥" + fmt(o.order_amount)));
    rows.appendChild(row("券抵扣", "-" + fmt(o.discount_amount)));
    rows.appendChild(row("实付金额", "¥" + fmt(o.pay_amount)));
    rows.appendChild(row("订单状态", ORDER_STATUS_LABEL[o.status] || o.status || "—"));
    box.appendChild(rows);
    box.appendChild(el("div", "om-note", "优惠券已核销（可在「已使用」查看）；订单可在「个人中心 → 我的订单」跟进支付与售后。"));
    var acts = el("div", "om-actions");
    var go = el("a", "btn", "查看我的订单");
    go.href = "me.html";
    var done = el("button", "cp-btn ghost", "完成");
    done.addEventListener("click", closeModal);
    acts.appendChild(go);
    acts.appendChild(done);
    box.appendChild(acts);
    omBody.appendChild(box);
  }

  omClose.addEventListener("click", closeModal);
  overlay.addEventListener("click", function (e) { if (e.target === overlay) closeModal(); });
  document.addEventListener("keydown", function (e) {
    var k = e.key || "";
    if ((k === "Escape" || k === "Esc") && overlay.classList.contains("open")) closeModal();
  });

  window.couponsOrder = { open: openModal };
  ensureHeld(); // 页面加载即预热已持券快照（重复领取判重依据）
  loadTemplates(true);
})();
</script>
<script>
/* admin 角色显示管理后台入口（对齐 me.html） */
(function () {
  if (!window.EAPI) return;
  var el = document.getElementById("adminEntry");
  if (!el || !EAPI.store.getToken()) return;
  EAPI.get("/api/users/me").then(function (u) {
    if (u && (u.role === "admin" || u.role === "manager")) el.style.display = "";
  }).catch(function () {});
})();
</script>
</body>
