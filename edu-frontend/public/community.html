*{box-sizing:border-box;margin:0;padding:0}
html{height:auto;min-height:100dvh}
/* App 壳：body flex column + container-type:inline-size（演示切视口与真实拖窗口同源生效，对齐 chat.html） */
body{min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden;container-type:inline-size;container-name:app;font-family:var(--font);color:var(--ink);background:var(--candy-bg);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
/* a11y：统一键盘焦点环 + 屏幕阅读器仅读文本 */
*:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px;border-radius:4px}
.visually-hidden{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.page{width:100%;max-width:1080px;margin:0 auto;padding:14px 16px 28px;display:flex;flex-direction:column;gap:14px}

/* respbar 演示工具条样式已移除（critique C4）；demo-note 元素已随 T3B-B-G4 演示清理删除 */

/* ===== Hero 横幅（糖果渐变底 + 白字 + emoji 装饰）===== */
.hero{position:relative;overflow:hidden;border-radius:var(--radius-xl);border:3px solid var(--ink);box-shadow:var(--shadow-3d);background:linear-gradient(120deg,var(--candy-purple) 0%,var(--candy-blue) 55%,var(--candy-pink) 100%);color:var(--ht-fff);padding:26px 24px}
.hero .h-emoji{position:absolute;right:18px;top:8px;font-size:64px;opacity:.9;transform:rotate(8deg)}
.hero .h-eyebrow{display:inline-flex;align-items:center;gap:6px;background:var(--htc-255-255-255-022);border:2px solid var(--htc-255-255-255-006);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:800;letter-spacing:.02em}
.hero h1{font-size:28px;font-weight:900;letter-spacing:-.01em;margin-top:10px;line-height:1.15;text-shadow:0 2px 0 var(--htc-31-31-31-018)}
.hero p{font-size:14px;opacity:.95;margin-top:6px;max-width:60%}

/* ===== 筛选行（FilterBar C9：版块按钮 + 排序 Select + 关键词搜索）===== */
.filter{display:flex;align-items:center;flex-wrap:wrap;gap:10px;background:var(--white);border:3px solid var(--ink);box-shadow:var(--shadow-3d);border-radius:var(--radius-lg);padding:12px 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--ink);background:var(--white);color:var(--ink);font-weight:700;font-size:0.8125rem;border-radius:999px;padding:6px 14px;box-shadow:var(--shadow-s);transition:transform .08s,box-shadow .08s;cursor:pointer}
.chip:hover{transform:translateY(-1px)}
.chip:active{transform:translateY(1px);box-shadow:none}
.chip.on{background:var(--candy-green);color:var(--ht-fff);border-color:var(--ink)}
.chip.on[data-color="orange"]{background:var(--candy-orange);color:var(--ht-fff)}
.chip.on[data-color="purple"]{background:var(--candy-purple);color:var(--ht-fff)}
.chip.on[data-color="blue"]{background:var(--candy-blue);color:var(--ht-fff)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:currentColor;vertical-align:middle}
.filter-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sort-select{appearance:none;-webkit-appearance:none;border:2px solid var(--ink);background:var(--white);border-radius:999px;padding:6px 34px 6px 14px;font-size:0.8125rem;font-weight:700;color:var(--ink);box-shadow:var(--shadow-s);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%231f1f1f'/></svg>");background-repeat:no-repeat;background-position:right 12px center;cursor:pointer}
.search{display:flex;align-items:center;gap:0;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--white);box-shadow:var(--shadow-s)}
.search input{border:none;outline:none;background:transparent;padding:6px 12px;font-size:0.8125rem;color:var(--ink);min-width:120px}
.search .go{display:grid;place-items:center;width:30px;align-self:stretch;border:none;background:var(--candy-yellow);border-left:2px solid var(--ink);font-size:14px}
.search .go:active{background:var(--candy-yellow-deep)}

/* ===== 列表工具行：我的帖子计数 + 发新帖 CTA ===== */
.toolbar{display:flex;align-items:center;gap:10px}
.mine{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--ink-strong);background:var(--candy-purple-soft);border:2px solid var(--tint-purple-35);border-radius:999px;padding:5px 12px}
.mine b{color:var(--candy-purple-deep)}
.post-new{display:inline-flex;align-items:center;gap:7px;margin-left:auto;border:3px solid var(--ink);background:var(--candy-orange);color:var(--ht-fff);font-weight:800;font-size:14px;border-radius:14px;padding:8px 16px;box-shadow:0 4px 0 var(--candy-orange-deep);transition:transform .1s,box-shadow .1s}
.post-new:hover{background:var(--candy-orange-hover);transform:translateY(-1px)}
.post-new:active{transform:translateY(2px);box-shadow:none}

/* ===== 帖子列表 ===== */
.boards{display:flex;flex-direction:column;gap:12px}
.board-sec{display:flex;flex-direction:column;gap:10px}
.sec-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:900;color:var(--ink)}
.sec-title .pill{font-size:11px;font-weight:800;color:var(--ink-strong);background:var(--candy-yellow);border:2px solid var(--ink);border-radius:999px;padding:2px 9px}
/* 帖子卡（C24 PostCard） */
.post{display:flex;flex-direction:column;gap:10px;background:var(--white);border:3px solid var(--ink);border-radius:var(--radius-lg);box-shadow:var(--shadow-3d);padding:14px 16px;cursor:pointer;transition:transform .1s,box-shadow .1s,border-color .1s;text-align:left;color:var(--ink)}
.post:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--htc-31-31-31-014);border-color:var(--candy-purple)}
.post:active{transform:translateY(1px);box-shadow:none}
.post .p-top{display:flex;align-items:center;gap:8px}
.pin{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--ink);background:var(--candy-yellow);border:2px solid var(--ink);border-radius:8px;padding:2px 8px}
.lock{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--ink-muted);border:2px solid var(--border-chip);border-radius:8px;padding:2px 8px}
.board-tag{font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;border:2px solid var(--ink);color:var(--ht-fff)}
.board-tag.en{background:var(--candy-blue)} .board-tag.math{background:var(--candy-purple)}
.board-tag.prog{background:var(--candy-green)} .board-tag.gen{background:var(--candy-orange)}
.post h3{font-size:17px;font-weight:800;line-height:1.3;letter-spacing:-.01em;color:var(--ink)}
.post h3:hover{color:var(--candy-purple-deep)}
.post .p-sum{font-size:14px;line-height:1.55;color:var(--ink-muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post .p-tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;font-weight:700;color:var(--candy-purple-deep);background:var(--candy-purple-soft);border:1px solid var(--tint-purple-25);border-radius:999px;padding:2px 9px}
.post .p-meta{display:flex;align-items:center;flex-wrap:wrap;gap:5px 12px;font-size:12px;color:var(--ink-faint)}
.post .p-meta .who{font-weight:800;color:var(--ink-strong)}
.post .p-meta .sep-dot{color:var(--gray-300)}
.post .p-meta .cmt i{font-style:normal;margin-right:2px}
/* 锁定帖：只读，弱化可点暗示（同普通帖纯信息展示） */
.post.locked{cursor:default}
.post.locked:hover{transform:none;box-shadow:var(--shadow-3d);border-color:var(--ink)}
.post.locked h3:hover{color:var(--ink)}

/* ===== 分页（C2 Pagination）===== */
.pager{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:2px}
.pager-btn{min-width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--ink);background:var(--white);border-radius:12px;font-size:0.8125rem;font-weight:800;color:var(--ink);box-shadow:var(--shadow-s);padding:0 10px;transition:transform .08s,box-shadow .08s}
.pager-btn:hover{transform:translateY(-1px)}
.pager-btn:active{transform:translateY(1px);box-shadow:none}
.pager-btn.on{background:var(--candy-green);color:var(--ht-fff)}
.pager-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.pager .total{font-size:12px;color:var(--ink-faint);font-weight:700;margin-left:6px}

/* ===== 状态：loading 骨架 ===== */
.sk{display:flex;flex-direction:column;gap:12px}
.sk-card{border:3px solid var(--gray-300);border-radius:var(--radius-lg);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.sk-line{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--ht-eee) 25%,var(--ht-f7f1e6) 50%,var(--ht-eee) 75%);background-size:400% 100%;animation:shimmer 1.2s infinite}
.sk-line.w60{width:60%}.sk-line.w40{width:40%}.sk-line.w90{width:90%}.sk-line.w25{width:25%}.sk-line.w70{width:70%}
.sk-h{height:18px;border-radius:6px;background:linear-gradient(90deg,var(--ht-e6e6e6) 25%,var(--ht-f4f4f4) 50%,var(--ht-e6e6e6) 75%);background-size:400% 100%;animation:shimmer 1.2s infinite;width:45%}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}

/* ===== 状态：empty / error ===== */
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:48px 20px;background:var(--white);border:3px solid var(--ink);border-radius:var(--radius-lg);box-shadow:var(--shadow-3d)}
.state .st-emoji{font-size:46px}
.state h3{font-size:1.125rem;font-weight:800;color:var(--ink)}
.state p{font-size:14px;color:var(--ink-muted);line-height:1.6;max-width:340px}
.retry{display:inline-flex;align-items:center;gap:7px;border:3px solid var(--ink);background:var(--candy-red);color:var(--ht-fff);font-weight:800;font-size:0.8125rem;border-radius:12px;padding:7px 16px;box-shadow:0 3px 0 var(--candy-red-deep)}
.retry:active{transform:translateY(1px);box-shadow:none}
.state-cta{display:inline-flex;align-items:center;gap:7px;margin-top:4px;border:3px solid var(--ink);background:var(--candy-green);color:var(--ht-fff);font-weight:800;font-size:0.8125rem;border-radius:12px;padding:7px 16px;box-shadow:0 3px 0 var(--candy-green-deep)}
.state-cta:active{transform:translateY(1px);box-shadow:none}

/* ===== 移动 FAB（发布，<@container 820 显示 / 桌面隐藏）===== */
.fab{position:fixed;right:16px;bottom:18px;z-index:40;display:none;align-items:center;gap:7px;border:3px solid var(--ink);background:var(--candy-orange);color:var(--ht-fff);font-weight:900;font-size:0.9375rem;border-radius:999px;padding:13px 20px;box-shadow:0 5px 0 var(--candy-orange-deep);transition:transform .1s,box-shadow .1s}
.fab:active{transform:translateY(2px);box-shadow:none}

/* ===== 响应式断点（对齐 P21 §6.1；@container 以 body 宽度驱动 → 演示切视口与真实拖窗口同源生效）===== */
@container app (max-width:820px){
  .post-new{display:none}              /* 桌面 CTA 隐藏 → 移动 FAB 接管 */
  .fab{display:inline-flex}
  .hero h1{font-size:1.5rem}
  .hero .h-emoji{font-size:52px}
  .filter{flex-direction:column;align-items:stretch}
  .filter-right{margin-left:0;justify-content:space-between}
  .search input{flex:1}
}
@container app (max-width:520px){
  .hero h1{font-size:22px}
  .hero p{max-width:90%}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
  .chips::-webkit-scrollbar{display:none}
  .post h3{font-size:1rem}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}
</style>

     task08 实测列表返回 mine_react_like → 优先后端字段，刷新可持续）
   - 发帖：POST /posts（实测字段 content_md 而非 content；tags 数组；成功后回第 1 页真实重载）
   - 未登录点互动按钮 → EAPI.buildLoginUrl 跳登录，不发请求（实测未带 token 点赞仍返回 200，故必须前端先拦）

task118/task08 仅改本页，不重定义全局 $ / renderSides。 */
(function () {

  var currentBoard = "";

  var LK = "edu:community:liked";

  function noToken() { return !EAPI.store.getToken(); }
  function goLogin() { try { location.href = EAPI.buildLoginUrl(location.href); } catch (e) { location.href = "/login-register.html"; } }

  document.head.insertAdjacentHTML("beforeend",
    "<style>#boards .like-btn{border:2px solid var(--ink,#1f1f1f);background:#fff;color:#1f1f1f;border-radius:999px;padding:2px 9px;font:inherit;font-size:12px;font-weight:800;cursor:pointer;box-shadow:0 2px 0 var(--htc-31-31-31-014,rgba(31,31,31,.14))}#boards .like-btn.on{background:var(--candy-green,#58cc02);color:#fff;border-color:var(--ink,#1f1f1f)}#boards .like-btn:active{transform:translateY(1px);box-shadow:none}.post .p-meta{row-gap:6px}" +
    "#postModal{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:16px}#postModal.open{display:flex}.pm-mask{position:absolute;inset:0;background:rgba(31,31,31,.5)}.pm-card{position:relative;width:min(520px,94vw);background:var(--candy-bg,#fff9f0);border:3px solid var(--ink,#1f1f1f);border-radius:18px;box-shadow:0 6px 24px rgba(31,31,31,.25);padding:18px 20px;max-height:88vh;overflow:auto}.pm-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:16px}.pm-x{border:2px solid var(--ink,#1f1f1f);background:#fff;border-radius:999px;width:30px;height:30px;font-weight:800;cursor:pointer}.pm-field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.pm-field label{font-size:12px;font-weight:800;color:var(--ink-strong,#4a4a4a)}.pm-field input,.pm-field textarea{border:2px solid var(--ink,#1f1f1f);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px;resize:vertical;outline:none}.pm-field input:focus,.pm-field textarea:focus{border-color:var(--candy-purple,#7c3aed)}.pm-board{display:flex;flex-wrap:wrap;gap:8px}.pm-chip{border:2px solid var(--ink,#1f1f1f);background:#fff;border-radius:999px;padding:5px 14px;font-weight:800;font-size:13px;cursor:pointer}.pm-chip.on{background:var(--candy-green,#58cc02);color:#fff}.pm-err{min-height:18px;font-size:12px;color:var(--candy-red-deep,#d63e3e);margin-bottom:8px}.pm-foot{display:flex;justify-content:flex-end;gap:8px}.pm-cancel{border:2px solid var(--ink,#1f1f1f);background:#fff;border-radius:10px;padding:8px 16px;font-weight:800;cursor:pointer}.pm-submit{border:3px solid var(--ink,#1f1f1f);background:var(--candy-orange,#ff4d00);color:#fff;border-radius:10px;padding:8px 18px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 var(--candy-orange-deep,#c74000)}.pm-submit:disabled{opacity:.5;cursor:not-allowed}#boards .post.locked .like-btn{opacity:.5;pointer-events:none;cursor:not-allowed}#boards .post .lock{font-size:11px;font-weight:800;color:var(--candy-red-deep,#d63e3e)}</style>");

  function setLiked(btn, liked) { btn.classList.toggle("on", !!liked); btn.setAttribute("aria-pressed", liked ? "true" : "false"); }

  function renderPosts(items) {
    if (!items || !items.length) {
      boards.innerHTML = '<div class="state" role="status"><span class="st-emoji">🏝️</span><h3>暂无帖子</h3><p>这个版块还没有人发过帖，来当第一个分享的人吧～</p></div>';
      return;

    /* B-G4：同一帖 post_id 只渲染 1 次（防重复渲染；跨页重复由 LIMIT/OFFSET 保证不发生，curl 实测附 T3B 报告） */
    var seen = {};
    var uniq = [];
    for (var i = 0; i < items.length; i++) {
      var pid = items[i].post_id;

      if (liked) likedMap[p.post_id] = 1;

    }).join("");
    bindBoards();
  }

  function bindBoards() {
    if (boards.dataset.task118Bound) return;   // 只绑定一次（prependPost 复用会重复绑定 → 已改容器级委托，防重复 POST）

  function likePost(btn) {
    if (noToken()) { goLogin(); return; }
    if (btn.dataset.busy) return;   // 双击防抖（与详情页 bindReact 一致）
    var pid = btn.dataset.post;
    var wasOn = btn.classList.contains("on");
    var num = btn.querySelector("i");
    var old = parseInt((num ? num.textContent : "0"), 10) || 0;
    var next = !wasOn;
    btn.dataset.busy = "1";
    setLiked(btn, next); if (num) num.textContent = next ? old + 1 : old - 1;   // 乐观更新
    EAPI.post("/api/community/posts/" + pid + "/like").then(function (d) {
      var active = d ? !!d.active : next;
      var total = (d && d.total_count != null) ? d.total_count : (next ? old + 1 : old - 1);
      setLiked(btn, active); if (num) num.textContent = total;
      if (active) likedMap[pid] = 1; else delete likedMap[pid];
      try { localStorage.setItem(LK, JSON.stringify(likedMap)); } catch (e2) {}
    }).catch(function () { setLiked(btn, wasOn); if (num) num.textContent = old; })   // 失败回滚
      .finally(function () { delete btn.dataset.busy; });
  }

  /* task08：prependPost 已移除——发帖成功改为回第 1 页真实重载（0 计数伪造卡片属 MOCK，且 HOT 排序下位置失真） */

  function load() {
    /* task08：三态齐全——loading 骨架 → success/empty；失败渲染错误态+重试（原 .catch 静默吞） */
    boards.innerHTML = (function(){ var s=""; for (var i=0;i<4;i++) s+='<div class="sk-card"><div class="sk-h"></div><div class="sk-line w90"></div><div class="sk-line w70"></div><div class="sk-line w40"></div></div>';
      return '<div class="sk" role="status"><span class="visually-hidden">正在加载帖子…</span>'+s+'</div>'; })();
    var kw = (document.getElementById("kw") || {}).value || "";
    var sortSel = document.getElementById("sort");
    var sort = sortSel ? String(sortSel.value || "").trim() : "";
    var url = "/api/community/posts?page=" + curPage + "&page_size=" + PAGE_SIZE;
    if (currentBoard) url += "&board_code=" + encodeURIComponent(currentBoard);
    if (kw) url += "&keyword=" + encodeURIComponent(kw);
    if (sort) url += "&sort=" + encodeURIComponent(sort);
    EAPI.get(url).then(function (d) {
      var data = d && d.items ? d : { items: [], total: 0 };
      lastTotal = data.total || 0;
      renderPosts(data.items);
      renderPager(lastTotal);
      var mineEl = document.querySelector(".mine b");          /* 实测返回 mine_total_posts */
      if (mineEl && data.mine_total_posts != null) mineEl.textContent = " " + data.mine_total_posts;
    }).catch(function (e) {
      lastTotal = 0;
      var msg = (e && e.message) || "网络开小差了，请稍后重试。";
      boards.innerHTML = '<div class="state" role="alert"><span class="st-emoji">😵</span><h3>帖子加载失败</h3>'
        + '<p>' + esc(msg) + '</p><button type="button" class="retry" id="retryLoad">🔄 重试</button></div>';
      var rb = document.getElementById("retryLoad");
      if (rb) rb.addEventListener("click", function () { load(); });
      renderPager(0);
    });
  }

  /* ---- task08：真实分页（curl 实测裸分页壳 {total,page,page_size,items,mine_total_posts}）---- */
  var PAGE_SIZE = 10, curPage = 1, lastTotal = 0;
  function renderPager(total) {
    var pager = document.getElementById("pager");
    if (!pager) return;
    if (!total) { pager.style.display = "none"; return; }
    pager.style.display = "";
    var pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    var start = Math.max(1, Math.min(curPage - 2, pages - 4));
    var end = Math.min(pages, start + 4);
    if (end - start + 1 < 5) start = Math.max(1, end - 4);
    var html = '<button type="button" class="pager-btn" data-pg="prev"' + (curPage <= 1 ? " disabled" : "") + '>‹</button>';
    for (var i = start; i <= end; i++) html += '<button type="button" class="pager-btn' + (i === curPage ? " on" : "") + '" data-pg="' + i + '">' + i + '</button>';
    html += '<button type="button" class="pager-btn" data-pg="next"' + (curPage >= pages ? " disabled" : "") + '>›</button>';
    html += '<span class="total" id="total">共 ' + total + ' 条</span>';
    pager.innerHTML = html;
    if (totalEl) totalEl = document.getElementById("total");
    pager.querySelectorAll(".pager-btn").forEach(function (b) {
      b.addEventListener("click", function () {
        var v = b.dataset.pg, pages2 = Math.max(1, Math.ceil(lastTotal / PAGE_SIZE));
        if (v === "prev") { if (curPage > 1) { curPage--; load(); } }
        else if (v === "next") { if (curPage < pages2) { curPage++; load(); } }
        else { var p = parseInt(v, 10); if (p && p !== curPage) { curPage = p; load(); } }
      });
    });
  }

  /* ---- 版块 chips 筛选（board_code 实测）；切换筛选/排序/搜索都回到第 1 页 ---- */
  (function initChips() {
    var cEls = Array.prototype.slice.call(document.querySelectorAll("#chips .chip"));
    function activate(node) { cEls.forEach(function (x) { x.classList.remove("on"); x.setAttribute("aria-pressed", "false"); }); node.classList.add("on"); node.setAttribute("aria-pressed", "true"); }
    cEls.forEach(function (c) { if (c.dataset.b === "all") activate(c); });   // 默认全部
    cEls.forEach(function (c) {
      c.addEventListener("click", function () { activate(c); currentBoard = CODE[c.dataset.b] || ""; curPage = 1; load(); });
    });
  })();

  /* ---- 发帖弹窗（替换 prompt()）---- */
  var modal = null, mTitle, mContent, mTags, mErr, mSubmit, selBoard = "general";
  var toast = null;
  function flashNote(msg) {
    if (!toast) { toast = document.createElement("div"); toast.style.cssText = "position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:999;background:var(--candy-green,#58cc02);color:#fff;font-weight:800;padding:10px 18px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.25);transition:opacity .3s"; document.body.appendChild(toast); }
    toast.textContent = msg; toast.style.opacity = "1";
    clearTimeout(flashNote.__t); flashNote.__t = setTimeout(function () { toast.style.opacity = "0"; }, 2000);
  }
  function ensureModal() {
    if (modal) return;
    modal = document.createElement("div"); modal.id = "postModal";
    modal.innerHTML = '<div class="pm-mask"></div><div class="pm-card" role="dialog" aria-modal="true" aria-label="发新帖"><div class="pm-head"><b>＋ 发新帖</b><button type="button" class="pm-x" aria-label="关闭">✕</button></div>'
      + '<div class="pm-field"><label for="pmTitle">标题</label><input id="pmTitle" maxlength="80" placeholder="一句话说清你的问题/分享"></div>'
      + '<div class="pm-field"><label>版块</label><div class="pm-board" role="group" aria-label="选择版块">'
      + ['english:英语:en', 'math:数学:math', 'programming:编程:prog', 'general:综合:gen'].map(function (s) { var p = s.split(":"); return '<button type="button" class="pm-chip" data-bc="' + p[0] + '">' + p[1] + '</button>'; }).join("")
      + '</div></div>'
      + '<div class="pm-field"><label for="pmContent">内容（Markdown 支持）</label><textarea id="pmContent" rows="6" placeholder="写正文…"></textarea></div>'
      + '<div class="pm-field"><label for="pmTags">标签（逗号分隔，最多 8 个）</label><input id="pmTags" maxlength="80" placeholder="高数, 错题"></div>'
      + '<div class="pm-err" id="pmErr"></div>'
      + '<div class="pm-foot"><button type="button" class="pm-cancel">取消</button><button type="button" class="pm-submit">发布</button></div></div>';
    document.body.appendChild(modal);
    mTitle = document.getElementById("pmTitle"); mContent = document.getElementById("pmContent");
    mTags = document.getElementById("pmTags"); mErr = document.getElementById("pmErr"); mSubmit = modal.querySelector(".pm-submit");
    function closeM() { modal.classList.remove("open"); }
    modal.querySelector(".pm-mask").addEventListener("click", closeM);
    modal.querySelector(".pm-cancel").addEventListener("click", closeM);
    modal.querySelector(".pm-x").addEventListener("click", closeM);
    modal.querySelectorAll(".pm-chip").forEach(function (c) {
      c.addEventListener("click", function () {
        modal.querySelectorAll(".pm-chip").forEach(function (x) { x.classList.remove("on"); });
        c.classList.add("on"); selBoard = c.dataset.bc;
      });
    });
    mSubmit.onclick = function () {
      var title = (mTitle.value || "").trim(), content = (mContent.value || "").trim();
      if (!title) { mErr.textContent = "请输入标题"; mTitle.focus(); return; }
      if (!content) { mErr.textContent = "请输入内容"; mContent.focus(); return; }
      var tags = (mTags.value || "").split(/[,，]/).map(function (x) { return x.trim(); }).filter(Boolean).slice(0, 8);
      mSubmit.disabled = true; mErr.textContent = "";
      EAPI.post("/api/community/posts", { board_code: selBoard, title: title, content_md: content, tags: tags }).then(function (d) {
        modal.classList.remove("open");
        /* task08：发帖成功 → 回第 1 页真实重载（原 prependPost 用 0 计数伪造卡片，HOT 排序下位置也失真） */
        curPage = 1;
        load();
        flashNote("发帖成功 ✨" + (d && d.points_awarded ? "（+" + d.points_awarded + " 积分）" : ""));
      }).catch(function (e) { mErr.textContent = "发布失败：" + ((e && e.message) || "网络错误"); }).finally(function () { mSubmit.disabled = false; });
    };
  }
  function openNew() {
    if (noToken()) { goLogin(); return; }
    ensureModal();
    mTitle.value = ""; mContent.value = ""; mTags.value = ""; mErr.textContent = "";
    var def = BOARD[currentBoard] ? currentBoard : "general";
    modal.querySelectorAll(".pm-chip").forEach(function (c) { c.classList.toggle("on", c.dataset.bc === def); });
    selBoard = def;
    modal.classList.add("open"); mTitle.focus();
  }
  ["postNewDesktop", "fab"].forEach(function (id) { var b = document.getElementById(id); if (b) b.addEventListener("click", openNew); });
  var go = document.getElementById("go"); if (go) go.addEventListener("click", function () { curPage = 1; load(); });
  var sortSelEl = document.getElementById("sort"); if (sortSelEl) sortSelEl.addEventListener("change", function () { curPage = 1; load(); });
  var kwEl = document.getElementById("kw"); if (kwEl) kwEl.addEventListener("keydown", function (e) { if (e.key === "Enter") { curPage = 1; load(); } });

  load();
})();
</script>
</body></html>
