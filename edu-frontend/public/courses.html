<style>
  /* ===== 设计 tokens（效果图「学中玩」糖果色板；React 实现时映射项目 tokens 或新增 candy 色板）===== */
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap');
  :root{ --htc-124-58-237-0.28: rgba(124,58,237,0.28); --htc-124-58-237-0.35: rgba(124,58,237,0.35); --htc-255-255-255-0.12: rgba(255,255,255,0.12); --htc-255-255-255-0.25: rgba(255,255,255,0.25); --htc-255-255-255-0.9: rgba(255,255,255,0.9); --htc-255-75-75-0.08: rgba(255,75,75,0.08); --htc-255-75-75-0.35: rgba(255,75,75,0.35); --htc-255-77-0-0.25: rgba(255,77,0,0.25); --htc-255-77-0-0.3: rgba(255,77,0,0.3); --htc-31-31-31-0.08: rgba(31,31,31,0.08); --htc-31-31-31-0.12: rgba(31,31,31,0.12); --htc-31-31-31-0.15: rgba(31,31,31,0.15); --htc-31-31-31-0.18: rgba(31,31,31,0.18); --htc-31-31-31-0.35: rgba(31,31,31,0.35); --htc-31-31-31-0.45: rgba(31,31,31,0.45); --htc-88-204-2-0.18: rgba(88,204,2,0.18); --htc-88-204-2-0.4: rgba(88,204,2,0.4);  --ht-1cb0f6: #1cb0f6; --ht-58cc02: #58cc02; --ht-7c3aed: #7c3aed; --ht-a5e8ff: #a5e8ff; --ht-a5f36a: #a5f36a; --ht-c4b5fd: #c4b5fd; --ht-d8c4fb: #d8c4fb; --ht-e4d5f5: #e4d5f5; --ht-e8e8e8: #e8e8e8; --ht-f1e8ff: #f1e8ff; --ht-faf5ff: #faf5ff; --ht-ff4d00: #ff4d00; --ht-ffb199: #ffb199; --ht-ffc800: #ffc800; --ht-ffc80066: #ffc80066; --ht-ffe58a: #ffe58a; --ht-ffe8dc: #ffe8dc; --ht-fff: #fff; --ht-fff0f0: #fff0f0; --ht-fff3e0: #fff3e0; 
    /* 糖果色主色（用户指定 Duolingo 系） */
    --candy-orange:#FF4D00; --candy-green:#58CC02; --candy-purple:#7C3AED;
    --candy-yellow:#FFC800; --candy-blue:#1CB0F6; --candy-pink:#FF86D0; --candy-red:#FF4B4B;
    /* 语义映射（对齐项目 tokens 结构：primary/secondary/accent/status） */
    --primary:var(--candy-green);        /* 主行动（学习/打卡） */
    --primary-strong:#46A302;            /* 绿深端 */
    --primary-soft:#E9FBD8;              /* 绿浅底 */
    --accent:var(--candy-orange);        /* 强调（价格/CTA） */
    --accent-strong:#E04400;
    --accent-soft:#FFE8DC;
    --secondary:var(--candy-purple);     /* 次级品牌（学科导航） */
    --secondary-soft:#F1E8FF;
    --success:var(--candy-green); --warning:var(--candy-yellow); --destructive:var(--candy-red);
    /* 中性（对齐 slate 语义） */
    --ink:#3C3C3C; --ink-strong:#1F1F1F; --ink-soft:#6B6B6B; --ink-faint:#9A9A9A;
    --bg:#FFF9F0; --card:#FFFFFF; --line:#F0E6DA; --line-strong:#E4D5C4;
    /* 圆角（学中玩：超大圆角 20px+） */
    --radius:1.5rem; --radius-lg:1.25rem; --radius-md:0.9rem; --radius-pill:999px;
    /* 字体：标题 Baloo 2 圆润粗体；正文系统圆体回退 */
    --font-head:"Baloo 2","PingFang SC","Microsoft YaHei",sans-serif;
    --font: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    /* 粗描边（Claymorphism 参考） */
    --stroke:3px solid var(--ink);
    --shadow-pop:0 6px 0 var(--htc-31-31-31-012); --htc-31-31-31-012: rgba(31, 31, 31, 0.012); --htc-31-31-31-008: rgba(31, 31, 31, 0.008); --htc-88-204-2-018: rgba(88, 204, 2, 0.018); --htc-124-58-237-035: rgba(124, 58, 237, 0.035); --htc-255-77-0-003: rgba(255, 77, 0, 0.003); --htc-255-75-75-008: rgba(255, 75, 75, 0.008); --htc-124-58-237-028: rgba(124, 58, 237, 0.028); --htc-31-31-31-035: rgba(31, 31, 31, 0.035); --htc-31-31-31-018: rgba(31, 31, 31, 0.018); --htc-31-31-31-045: rgba(31, 31, 31, 0.045); --htc-255-77-0-025: rgba(255, 77, 0, 0.025); --htc-255-255-255-009: rgba(255, 255, 255, 0.009); --htc-88-204-2-004: rgba(88, 204, 2, 0.004); --htc-255-75-75-035: rgba(255, 75, 75, 0.035); --htc-255-255-255-025: rgba(255, 255, 255, 0.025); --htc-255-255-255-012: rgba(255, 255, 255, 0.012); --htc-31-31-31-015: rgba(31, 31, 31, 0.015); --p: 0; --candy-bg: #fff9f0; --r: 12px; --shadow: 0 4px 16px rgba(31,31,31,0.08); --muted: #8a8f98;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  input{font-family:inherit}

  /* ===== 整页容器 ===== */
  .page{max-width:1200px;margin:0 auto;padding:24px 20px 64px}
  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:4px;flex-wrap:wrap}
  .page-title{font-family:var(--font-head);font-size:28px;font-weight:800;letter-spacing:-.01em;color:var(--ink-strong)}

  .subtitle{font-size:0.8125rem;color:var(--ink-soft);margin-bottom:18px}

  /* ===== Hero（学中玩：吉祥物 + 口号 + 打卡/等级/XP 社交证明）===== */
  .hero{display:flex;align-items:center;gap:22px;background:linear-gradient(135deg,var(--ht-fff3e0) 0%,var(--ht-ffe8dc) 45%,var(--ht-f1e8ff) 100%);border:var(--stroke);border-radius:calc(var(--radius) + 6px);padding:22px 24px;margin-bottom:20px;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,var(--ht-ffc80066) 0%,transparent 70%)}
  .hero-mascot{font-size:64px;line-height:1;filter:drop-shadow(0 6px 0 var(--htc-31-31-31-012));animation:float 3.2s ease-in-out infinite;flex-shrink:0}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
  .hero-copy{flex:1;min-width:0}
  .hero-slogan{font-family:var(--font-head);font-size:26px;font-weight:800;color:var(--ink-strong);line-height:1.2}
  .hero-slogan b{color:var(--candy-orange)}
  .hero-sub{font-size:0.8125rem;color:var(--ink-soft);margin-top:4px}
  .hero-stats{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .stat-card{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line-strong);border-radius:var(--radius-md);padding:8px 12px;font-size:12px;color:var(--ink);box-shadow:0 3px 0 var(--htc-31-31-31-008)}
  .stat-icon{font-size:1.125rem}
  .stat-card b{font-family:var(--font-head);font-size:1rem;font-weight:800;color:var(--candy-orange)}
  .level-row{display:flex;align-items:center;gap:6px;font-weight:600}
  .xp-bar{width:72px;height:10px;background:var(--line);border-radius:999px;overflow:hidden;display:inline-block;vertical-align:middle}
  .xp-fill{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--candy-green),var(--ht-a5f36a));border-radius:999px;transition:width 1.4s cubic-bezier(.34,1.56,.64,1)}
  .xp-text{font-size:11px;color:var(--ink-soft);font-weight:600}

  /* ===== SearchInput（防抖 400ms）===== */
  .search-wrap{position:relative;max-width:420px;margin-bottom:18px}
  .search-wrap svg{position:absolute;left:14px;top:11px;color:var(--ink-faint);pointer-events:none}
  .search-input{width:100%;height:44px;border-radius:999px;border:2px solid var(--line-strong);background:var(--card);padding:0 44px;font-size:14px;color:var(--ink);transition:border .15s,box-shadow .15s;outline:none}
  .search-input:focus{border-color:var(--candy-green);box-shadow:0 0 0 4px var(--htc-88-204-2-018)}
  .search-input::placeholder{color:var(--ink-faint)}
  .clear-x{position:absolute;right:12px;top:10px;width:24px;height:24px;border:none;border-radius:50%;background:var(--line);color:var(--ink-soft);font-size:14px;line-height:1;display:grid;place-items:center;transition:background .15s}
  .clear-x:hover{background:var(--line-strong)}

  /* ===== FilterBar（两级导航：一级学科大类 + 二级课程方向）===== */
  .filterbar{background:var(--card);border:2px solid var(--line-strong);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:20px}
  .fb-rows{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px}
  .fb-toggle{display:none;align-items:center;gap:8px;width:100%;background:var(--bg);border:2px solid var(--line-strong);border-radius:12px;padding:10px 14px;font-size:0.8125rem;color:var(--ink);font-weight:700}
  .fb-toggle .fb-summary{color:var(--candy-orange);font-weight:700;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:58%;margin-left:auto;text-align:right}
  .fb-toggle svg{transition:transform .18s ease;margin-left:auto}
  .f-group{display:flex;align-items:flex-start;gap:8px;min-width:0}
  .f-label{font-size:12px;color:var(--ink-soft);font-weight:700;flex-shrink:0;padding-top:7px}
  .chip-row{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:0.8125rem;color:var(--ink);background:var(--bg);border:2px solid var(--line-strong);border-radius:999px;padding:6px 14px;font-weight:600;transition:all .15s}
  .chip:hover{border-color:var(--candy-purple);color:var(--candy-purple);transform:translateY(-1px)}
  .chip:active{transform:scale(.94)}
  .chip.active{background:var(--candy-purple);border-color:var(--candy-purple);color:var(--ht-fff);font-weight:700;box-shadow:0 3px 0 var(--htc-124-58-237-035)}
  /* 二级方向行：浅紫底，选中为橙色 */
  #subGroup{width:100%;padding-top:10px;border-top:2px dashed var(--line-strong)}
  #subGroup .f-label{color:var(--candy-purple)}
  #subGroup .chip{background:var(--ht-faf5ff);border-color:var(--ht-e4d5f5)}
  #subGroup .chip.active{background:var(--candy-orange);border-color:var(--candy-orange);box-shadow:0 3px 0 var(--htc-255-77-0-003)}
  .f-divider{width:1px;height:30px;background:var(--line-strong);margin:2px 2px 0}
  .select{position:relative}
  .select select{appearance:none;height:36px;padding:0 32px 0 12px;font-size:0.8125rem;border:2px solid var(--line-strong);border-radius:10px;background:var(--card);color:var(--ink);outline:none;transition:border .15s;font-weight:600}
  .select select:focus{border-color:var(--candy-green);box-shadow:0 0 0 4px var(--htc-88-204-2-018)}
  .select::after{content:"";position:absolute;right:12px;top:15px;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--ink-faint);pointer-events:none}
  .reset-btn{font-size:0.8125rem;color:var(--ink-soft);background:none;border:none;padding:8px 10px;border-radius:10px;font-weight:600;transition:all .15s}
  .reset-btn:hover{color:var(--candy-red);background:var(--htc-255-75-75-008)}
  /* <768px：折叠式（默认收起，点击展开）*/
  @media(max-width:767px){
    .fb-toggle{display:flex}
    .fb-rows{display:none;flex-direction:column;align-items:stretch;gap:12px;margin-top:12px}
    .filterbar.open .fb-rows{display:flex}
    .filterbar.open .fb-toggle svg{transform:rotate(180deg)}
    .fb-rows .f-group{flex-wrap:wrap;gap:8px 10px}
    .fb-rows .f-group .chip-row{flex:1 1 100%}
    .fb-rows .f-group .select{flex:1 1 100%}
    .fb-rows .f-group .select select{width:100%}
    .f-divider{display:none}
  }

  /* ===== 结果条 + Skeleton ===== */
  .resultbar{display:flex;align-items:center;gap:10px;font-size:0.8125rem;color:var(--ink-soft);margin-bottom:14px}
  .resultbar b{color:var(--ink-strong);font-weight:700}
  .spin{width:14px;height:14px;border:2px solid var(--line-strong);border-top-color:var(--candy-green);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ===== Grid lg:3 CourseCard（学中玩：圆角卡片 + 粗描边 + XP 徽章 + 进度环）===== */
  .grid{display:grid;grid-template-columns:repeat(1,1fr);gap:20px}
  @media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(min-width:1024px){.grid{grid-template-columns:repeat(3,1fr)}}
  .card{background:var(--card);border:2px solid var(--line-strong);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s ease,border-color .18s ease;cursor:pointer}
  .card:hover{border-color:var(--candy-purple);box-shadow:0 10px 24px -10px var(--htc-124-58-237-028);transform:translateY(-4px) rotate(-.4deg)}
  .card:active{transform:scale(.97)}
  .card-link{display:block;height:100%;color:inherit;text-decoration:none}
  .card-link .card{height:100%}
  /* 封面：糖果色渐变族 × 学科 emoji 图标 × 几何图案（参考「脚本与自动化编程」封面：渐变+图标+斜线） */
  .cover{position:relative;aspect-ratio:16/9;overflow:hidden}
  .cover--t1{background:linear-gradient(135deg,var(--ht-ff4d00),var(--ht-ffb199))}   /* 橙 */
  .cover--t2{background:linear-gradient(135deg,var(--ht-58cc02),var(--ht-a5f36a))}   /* 绿 */
  .cover--t3{background:linear-gradient(135deg,var(--ht-7c3aed),var(--ht-c4b5fd))}   /* 紫 */
  .cover--t4{background:linear-gradient(135deg,var(--ht-1cb0f6),var(--ht-a5e8ff))}   /* 蓝 */
  .cover--t5{background:linear-gradient(135deg,var(--ht-ffc800),var(--ht-ffe58a))}   /* 黄 */
  .cover .pattern{position:absolute;inset:0;background-image:repeating-linear-gradient(45deg,var(--ht-fff) 0 2px,transparent 2px 18px);opacity:.14}
  .cover--p2 .pattern{background-image:radial-gradient(circle at 25% 30%,var(--ht-fff) 2px,transparent 3px),radial-gradient(circle at 75% 65%,var(--ht-fff) 2px,transparent 3px);background-size:26px 26px;opacity:.2}
  .cover--p3 .pattern{background-image:linear-gradient(var(--ht-fff) 1px,transparent 1px),linear-gradient(90deg,var(--ht-fff) 1px,transparent 1px);background-size:28px 28px;opacity:.1}
  .cover--p4 .pattern{background-image:conic-gradient(from 90deg,var(--ht-fff) 0 40deg,transparent 40deg 360deg);background-size:48px 48px;opacity:.12}
  .cover--p5 .pattern{background-image:radial-gradient(circle at center,var(--ht-fff) 0 3px,transparent 4px);background-size:38px 38px;opacity:.16}
  .cover .cov{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  /* 封面标题（参考「脚本与自动化编程」封面：居中粗体白字，字体用当前 Baloo 2 圆润粗体） */
  .cover-title{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--font-head);font-size:22px;font-weight:800;color:var(--ht-fff);text-align:center;line-height:1.3;width:82%;z-index:2;text-shadow:0 2px 6px var(--htc-31-31-31-035);letter-spacing:.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cover .subject-emoji{position:absolute;right:14px;bottom:12px;font-size:44px;line-height:1;filter:drop-shadow(0 3px 0 var(--htc-31-31-31-018));z-index:2}
  .cover .delivery{position:absolute;top:12px;left:12px;font-size:11px;font-weight:700;color:var(--ht-fff);background:var(--htc-31-31-31-045);backdrop-filter:blur(4px);padding:4px 10px;border-radius:999px;z-index:2}
  .cover .xp-badge{position:absolute;top:12px;right:12px;font-size:11px;font-weight:800;color:var(--candy-orange);background:var(--ht-fff);border:2px solid var(--candy-orange);padding:3px 9px;border-radius:999px;z-index:2;box-shadow:0 2px 0 var(--htc-255-77-0-025)}
  .cover .code{position:absolute;bottom:10px;left:12px;font-size:0.625rem;color:var(--htc-255-255-255-009);font-family:ui-monospace,Menlo,monospace;z-index:2;background:var(--htc-31-31-31-035);padding:2px 7px;border-radius:6px}
  .card-body{padding:14px 14px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
  .card-title{font-family:var(--font-head);font-size:1rem;font-weight:700;color:var(--ink-strong);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:44px}
  .cat-row{display:flex;flex-wrap:wrap;gap:6px}
  .cat{font-size:11px;color:var(--candy-purple);background:var(--secondary-soft);border:1px solid var(--ht-d8c4fb);padding:2px 9px;border-radius:999px;font-weight:700}
  .meta-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft);margin-top:auto;flex-wrap:wrap}
  .meta-row .dot{width:4px;height:4px;border-radius:50%;background:var(--line-strong)}
  .meta-row .hot{color:var(--candy-orange);font-weight:700}
  .price-row{display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:2px dashed var(--line)}
  .price{font-size:19px;font-weight:800;color:var(--candy-orange);font-variant-numeric:tabular-nums;letter-spacing:-.01em;font-family:var(--font-head)}
  .price .cny{font-size:12px;font-weight:700}
  .price .qi{font-size:11px;font-weight:600;color:var(--ink-soft);margin-left:2px}
  .price-empty{font-size:12px;color:var(--ink-faint)}
  /* 学习进度环（学中玩社交证明，装饰性） */
  .ring-wrap{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-soft);font-weight:600}
  .ring{width:26px;height:26px;border-radius:50%;background:conic-gradient(var(--candy-green) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;position:relative}
  .ring::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--card)}
  .ring b{position:relative;z-index:1;font-size:8px;color:var(--candy-green)}

/* ---- 刷新：task103 接真 —— 从后端真实请求分页，翻页/筛选/关键词都发真实 ?page=n ---- */
function buildQuery(){
  const q=new URLSearchParams();
  q.set("page", page); q.set("page_size", PAGE_SIZE);
  if (filters.category && filters.category!=="全部") q.set("category", filters.category);
  if (filters.sub) q.set("category", filters.sub);          // 二级方向覆盖共享 category 参数
  if (filters.delivery) q.set("delivery_mode", filters.delivery);
  if (filters.keyword) q.set("keyword", filters.keyword);
  if (filters.price){ const r=filters.price.split("-"); if(r[0]) q.set("price_min", r[0]); if(r[1]) q.set("price_max", r[1]); }
  if (filters.sort && filters.sort!=="default") q.set("sort", filters.sort);
  return q.toString();
}
function fetchPage(){
  renderLoading();
  const hasApi = !!(window.EAPI && EAPI.get);
  if (!hasApi) {  // 无 EAPI 时降级演示数据，保证静态页可开
    const list=[...ALL].slice((page-1)*PAGE_SIZE, page*PAGE_SIZE);
    const total=ALL.length, tPages=Math.max(1,Math.ceil(total/PAGE_SIZE));
    renderSuccess(list, total, tPages);
    return;
  }
  EAPI.get("/api/series?"+buildQuery()).then(function(d){
    const items = (d && d.items) ? d.items : (Array.isArray(d) ? d : []);
    /* C2：后端只保留外层分页 triple {total,page,page_size,items}，弃分页兼容冗余字段 */
    const total = (d && typeof d.total==="number") ? d.total : items.length;
    const tPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    totalCount = total; totalPages = tPages;
    renderSuccess(items, total, tPages);
  }).catch(function(){
    renderError();
  });
}
function refresh(){ fetchPage(); }

/* task03 回归修复：非负模取色——末页存在小 id（实测 id=1/2/3），原 i%5 产生负索引 → cover--undefined 封面丢样式 */
function coverClass(id){ const i=id-1001; const t=((i%5)+5)%5, p=((Math.floor(i/5)%5)+5)%5; return `cover--${TONES[t]} cover--${PATTERNS[p]}`; }
function cardHtml(s){
  const url = `course-detail.html?id=${s.id}`;
  const price = (s.min_price!==null && s.min_price!==undefined) ? s.min_price : null;
  const cov = coverSrc(s);   // task103：真实非假域名封面才用图，否则首字母色块占位
  const coverImg = cov ? `<img class="cov" src="${cov}" alt="${s.series_name}封面" loading="lazy" onerror="this.remove()" />` : "";
  const emoji = SUB_EMOJI[s.sub_category] || CAT_EMOJI[(s.category_names||[])[0]] || "📚";
  // 元信息：真实列表项无 cohort_count/learners/xp/进度字段（curl 实测 2026-09-06），
  // 不渲染假进度环/假"人学过"——mock 百分比属数据欺骗，task03 移除
  const metas = [];
  if (s.cohort_count != null) metas.push(`<span>${s.cohort_count} 个班次</span>`);
  else if (s.delivery_mode) metas.push(`<span>${DM[s.delivery_mode]||"在线课程"}</span>`);
  if (s.learners != null) metas.push(`<span class="dot"></span><span class="hot">🔥 ${(s.learners/1000>=1)?((s.learners/1000).toFixed(1)+"k"):s.learners} 人学过</span>`);
  return `
  <a class="card-link" href="${url}" aria-label="${s.series_name}">
  <article class="card" tabindex="0">
    <div class="cover ${coverClass(s.id)}">
      <div class="pattern"></div>
      ${coverImg}
      <h3 class="cover-title">${s.series_name.replace(/·(直播|录播|面授)$/,"")}</h3>
      <span class="delivery">${DM[s.delivery_mode]||"在线课程"}</span>
      ${s.xp!=null ? `<span class="xp-badge">+${s.xp} XP</span>` : ""}
      <span class="subject-emoji">${emoji}</span>
      <span class="code">${s.series_code}</span>
    </div>
    <div class="card-body">
      <h3 class="card-title">${s.series_name}</h3>
      <div class="cat-row"><span class="cat">${emoji} ${s.sub_category||(s.category_names||[])[0]||"课程"}</span></div>
      <div class="meta-row">
        ${metas.join("")}
      </div>
      <div class="price-row">
        ${price!==null ? `<span class="price"><span class="cny">¥</span>${formatPrice(price)}<span class="qi">起</span></span>` : `<span class="price-empty">-</span>`}
      </div>
    </div>
  </article>
  </a>`;
}
function formatPrice(p){ const n=parseFloat(p); return n.toLocaleString("zh-CN",{minimumFractionDigits:0,maximumFractionDigits:0}); }

/* ---- 结果条 ---- */
function renderResultBar(kind, total){
  const el=document.getElementById("resText"); if(!el) return;
  if(kind==="loading"){ el.innerHTML='<span class="spin"></span> 查询中…'; }
  else if(kind==="success"){ el.innerHTML=`共 <b>${total}</b> 门课程`; }
  else if(kind==="empty"){ el.innerHTML='共 <b>0</b> 门课程'; }
  else { el.textContent=""; }
}

/* ---- 成功态：渲染后端返回的当前页 items + 真实分页（task103 接真）---- */
function renderSuccess(pageItems, total, tPages){
  const area=document.getElementById("contentArea");
  if(pageItems.length===0){
    const catEmoji = filters.category!=="全部" ? (CAT_EMOJI[filters.category]||"📚") : "🔍";

  } else {
    area.innerHTML = `<div class="grid">${pageItems.map(cardHtml).join("")}</div>`;
  }
  renderPagination(total, tPages);
  renderResultBar(pageItems.length===0?"empty":"success", total);
}

/* ---- 各状态渲染 ---- */
function renderLoading(){
  const s="<div class='shape' style='width:100%;height:148px'></div><div class='shape' style='width:75%;height:16px;margin:12px 12px 0'></div><div class='shape' style='width:50%;height:14px;margin:8px 12px 0'></div><div class='shape' style='width:30%;height:12px;margin:8px 12px 0'></div>";
  document.getElementById("contentArea").innerHTML = `<div class="grid">${Array.from({length:6}).map(()=>`<div class="card skeleton">${s}</div>`).join("")}</div>`;
  document.getElementById("pgPages").innerHTML="";
  document.getElementById("pgInfo").textContent="";
  renderResultBar("loading");
}
function renderError(){
  document.getElementById("contentArea").innerHTML = `<div class="error"><div class="t">加载失败</div><div class="d">网络似乎开小差了，请稍后重试</div><button class="btn" onclick="applyState('success')">重新加载</button></div>`;
  document.getElementById("pgPages").innerHTML="";
  document.getElementById("pgInfo").textContent="";
  renderResultBar("error");
}
function applyState(s){
  state=s; storedState=s;
  if(s==="success") fetchPage();
  else if(s==="loading") renderLoading();
  else if(s==="empty"){ document.getElementById("contentArea").innerHTML = `<div class="empty"><div class="icon">🔍</div><div class="t">没有符合条件的课程</div><div class="d">换一个关键词或筛选条件再试试</div><button class="btn" onclick="resetAll()">查看全部课程</button></div>`;
    document.getElementById("pgInfo").textContent=""; document.getElementById("pgPages").innerHTML=""; renderResultBar("empty"); }
  else if(s==="error") renderError();
}

/* ---- Pagination（v4：从左到右水平排列；支持真实 176 页省略号；默认态翻页为静态演示）---- */
function renderPagination(total, totalPages){
  const pg=document.getElementById("pgPages");
  let html="";
  for(let i=1;i<=totalPages;i++){
    if(totalPages>7 && (i>3 && i<totalPages-2)){ if(i===4) html+=`<span class="pg-ellipsis">⋯</span>`; continue; }
    html+=`<button class="pg-btn ${i===page?'active':''}" onclick="goPage(${i})">${i}</button>`;
  }
  pg.innerHTML=html;
  document.getElementById("pgPrev").disabled=(page<=1);
  document.getElementById("pgNext").disabled=(page>=totalPages);
  document.getElementById("pgInfo").textContent=`共 ${total} 门 · 第 ${page}/${totalPages} 页`;
}
function goPage(p){ page=p; refresh(); }
document.getElementById("pgPrev").addEventListener("click",()=>{ if(page>1){page--; refresh();} });
document.getElementById("pgNext").addEventListener("click",()=>{ if(page<totalPages){page++; refresh();} });

document.getElementById("clearBtn").addEventListener("click",()=>{ document.getElementById("searchInput").value=""; document.getElementById("clearBtn").style.display="none"; applyFilter("keyword",""); });
function resetAll(){
  filters={category:"全部",sub:"",delivery:"",price:"",sort:"default",keyword:""}; page=1;
  document.querySelectorAll("#categoryRow .chip").forEach(c=>c.classList.toggle("active",c.dataset.v==="全部"));
  document.querySelectorAll("#deliveryRow .chip").forEach(c=>c.classList.toggle("active",c.dataset.v===""));
  document.querySelectorAll("#sortRow .chip").forEach(c=>c.classList.toggle("active",c.dataset.v==="default"));
  document.getElementById("priceSelect").value=""; document.getElementById("searchInput").value=""; document.getElementById("clearBtn").style.display="none";
  renderSubs(); fbSummary();
  applyState("success");
}
document.getElementById("resetBtn").addEventListener("click",resetAll);

/* ---- 初始渲染：两级导航 + Hero 真实数据 + 列表（respbar 状态/视口演示已移除，critique C4）---- */
renderCats();
renderSubs();

refresh();
/* B-G2：Hero 等级/积分/连续打卡接真实端点（gamification/me/points + progress/dashboard）；
 * 未登录或请求失败时保持占位「–」，不造演示数据 */
function loadHero(){
  if (!window.EAPI || !EAPI.store || !EAPI.store.getToken()) return;
  function setText(id, v){ var el=document.getElementById(id); if (el) el.textContent = v; }
  EAPI.get("/api/gamification/me/points?page=1&page_size=1").then(function (d) {
    if (!d) return;
    if (typeof d.level_no === "number") setText("heroLevel", d.level_no);
    if (typeof d.total_points === "number") {
      var s = d.total_points.toLocaleString("zh-CN");
      setText("heroTotalXp", s); setText("heroXp", s + " XP");
    }
    if (typeof d.level_progress_pct === "number") {
      var f = document.getElementById("xpFill");
      if (f) f.style.width = Math.min(100, Math.max(0, d.level_progress_pct)) + "%";
    }
  }).catch(function(){});
  EAPI.get("/api/progress/dashboard?days=14").then(function (d) {
    if (d && typeof d.latest_streak_days === "number") setText("heroStreak", d.latest_streak_days);
  }).catch(function(){});
}
loadHero();
</script>
