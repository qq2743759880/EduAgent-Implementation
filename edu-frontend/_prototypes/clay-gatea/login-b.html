<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EduAgent 登录原型 B - 标准粉彩</title>
  <style>
    :root {
      --bg-app: #F7F5FB;
      --bg-raised: #FFFFFF;
      --clay-lavender: #B8A6FF;
      --clay-sky: #9EC9F0;
      --clay-mint: #7DD4A8;
      --clay-peach: #FFB59E;
      --clay-pink: #F5B8D0;
      --clay-lemon: #F5D77A;
      --cta-coral: #FF7A6B;
      --status-active: #7DD4A8;
      --status-pending: #F5D77A;
      --status-archived: #C9B5FF;
      --text-strong: #2E2A3F;
      --text-muted: #6B6580;
      --cta-text: #2E2A3F; /* 5.43:1 against #FF7A6B */
      --radius-card: 28px;
      --radius-btn: 18px;
      --radius-input: 16px;
      --radius-pill: 999px;
      --radius-icon-tile: 20px;
      --clay-shadow-lavender: 8px 8px 24px rgba(122,100,220,.35), inset -6px -6px 16px rgba(122,100,220,.25), inset 6px 6px 16px rgba(255,255,255,.55);
      --clay-shadow-sky: 8px 8px 24px rgba(80,142,196,.34), inset -6px -6px 16px rgba(80,142,196,.25), inset 6px 6px 16px rgba(255,255,255,.55);
      --clay-shadow-peach: 8px 8px 24px rgba(218,111,82,.32), inset -6px -6px 16px rgba(218,111,82,.24), inset 6px 6px 16px rgba(255,255,255,.52);
      --clay-shadow-coral: 8px 8px 24px rgba(214,82,70,.34), inset -6px -6px 16px rgba(214,82,70,.26), inset 6px 6px 16px rgba(255,255,255,.45);
    }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100dvh; margin: 0; overflow-x: hidden; color: var(--text-strong); background: var(--bg-app); font: 500 16px/1.55 "PingFang SC", "Microsoft YaHei", sans-serif; }
    button, input { font: inherit; }
    :focus-visible { outline: 3px solid var(--text-strong); outline-offset: 3px; }
    .page { position: relative; isolation: isolate; width: min(1180px, calc(100% - 32px)); min-height: 100dvh; margin: auto; display: grid; place-items: center; padding: 32px 0; }
    .orb { position: fixed; z-index: -1; border-radius: 50%; filter: blur(2px); }
    .orb.one { width: 250px; height: 250px; top: -80px; left: -70px; background: var(--clay-sky); box-shadow: var(--clay-shadow-sky); }
    .orb.two { width: 210px; height: 210px; right: -64px; bottom: -60px; background: var(--clay-peach); box-shadow: var(--clay-shadow-peach); }
    .auth { width: 100%; display: grid; grid-template-columns: minmax(0, .9fr) minmax(420px, 1.1fr); overflow: hidden; border-radius: 36px; background: var(--bg-raised); box-shadow: 12px 12px 34px rgba(122,100,220,.22); }
    .story { position: relative; display: flex; flex-direction: column; justify-content: space-between; min-height: 650px; padding: clamp(32px, 6vw, 68px); background: var(--clay-lavender); box-shadow: var(--clay-shadow-lavender); }
    .story::after { content: ""; position: absolute; inset: auto 42px 44px auto; width: 160px; height: 160px; border-radius: 46% 54% 52% 48%; background: var(--clay-pink); box-shadow: 8px 8px 24px rgba(188,99,137,.32), inset -6px -6px 16px rgba(188,99,137,.24), inset 6px 6px 16px rgba(255,255,255,.52); transform: rotate(12deg); }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 950; font-size: 18px; }
    .brand i { display: grid; place-items: center; width: 48px; height: 48px; border-radius: var(--radius-icon-tile); background: var(--clay-lemon); box-shadow: 6px 6px 18px rgba(190,149,35,.30), inset -4px -4px 12px rgba(190,149,35,.22), inset 4px 4px 12px rgba(255,255,255,.5); font-style: normal; }
    .story-copy { position: relative; z-index: 1; max-width: 440px; margin-bottom: 128px; }
    .eyebrow { display: inline-flex; min-height: 44px; align-items: center; padding: 7px 15px; border-radius: var(--radius-pill); background: rgba(255,255,255,.48); font-size: 13px; font-weight: 900; }
    h1 { margin: 22px 0 16px; font-size: clamp(44px, 5vw, 68px); line-height: 1.04; letter-spacing: -.05em; }
    .story p { max-width: 31ch; margin: 0; color: var(--text-strong); font-size: 18px; }
    .panel { padding: clamp(32px, 5vw, 68px); display: flex; flex-direction: column; justify-content: center; }
    .tabs { display: inline-flex; align-self: flex-start; gap: 6px; padding: 5px; border-radius: var(--radius-pill); background: color-mix(in srgb, var(--clay-sky) 30%, white); }
    .tab { min-width: 96px; min-height: 44px; border: 0; border-radius: var(--radius-pill); color: var(--text-muted); background: transparent; font-weight: 900; cursor: pointer; }
    .tab.active { color: var(--text-strong); background: var(--clay-sky); box-shadow: var(--clay-shadow-sky); }
    h2 { margin: 34px 0 8px; font-size: 34px; }
    .sub { margin: 0 0 28px; color: var(--text-muted); }
    .field { display: grid; gap: 8px; margin-bottom: 18px; }
    label { font-size: 14px; font-weight: 900; }
    input { height: 54px; width: 100%; border: 0; border-radius: var(--radius-input); padding: 0 16px; color: var(--text-strong); background: color-mix(in srgb, var(--clay-lavender) 12%, white); box-shadow: inset 3px 3px 8px rgba(122,100,220,.18), inset -3px -3px 8px rgba(255,255,255,.85); }
    input::placeholder { color: var(--text-muted); }
    .tools { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 4px 0 24px; font-size: 13px; }
    .remember { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; cursor: pointer; }
    .remember input { width: 18px; height: 18px; accent-color: var(--cta-coral); box-shadow: none; }
    a { display: inline-flex; min-height: 44px; align-items: center; color: var(--text-strong); font-weight: 900; }
    .cta { width: 100%; min-height: 56px; border: 0; border-radius: var(--radius-btn); color: var(--cta-text); background: var(--cta-coral); box-shadow: var(--clay-shadow-coral); font-weight: 950; cursor: pointer; transition: transform 140ms ease; }
    .cta:hover { transform: translateY(-2px); }
    .cta:active { transform: scale(.97); box-shadow: 4px 4px 12px rgba(214,82,70,.28), inset -3px -3px 8px rgba(214,82,70,.20), inset 3px 3px 8px rgba(255,255,255,.38); }
    .legal { margin: 22px 0 0; color: var(--text-muted); font-size: 13px; text-align: center; }
    @media (max-width: 880px) { .auth { grid-template-columns: 1fr; max-width: 620px; } .story { min-height: 360px; } .story-copy { margin: 48px 0 0; } .story::after { width: 118px; height: 118px; } }
    @media (max-width: 560px) { .page { width: min(100% - 20px, 1180px); padding: 10px 0; } .story { min-height: 320px; padding: 26px 22px; } .story-copy { margin-top: 36px; } h1 { font-size: 42px; } .story p { font-size: 16px; } .panel { padding: 28px 20px 34px; } .tabs { width: 100%; } .tab { flex: 1; } }
    @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } .cta:hover, .cta:active { transform: none; } }
  </style>
</head>
<body>
  <main class="page">
    <span class="orb one" aria-hidden="true"></span><span class="orb two" aria-hidden="true"></span>
    <div class="auth">
      <section class="story" aria-labelledby="headline-b">
        <div class="brand"><i aria-hidden="true">EA</i> EduAgent</div>
        <div class="story-copy"><span class="eyebrow">标准粉彩 · 平衡活力</span><h1 id="headline-b">今天想学<br>什么？</h1><p>让课程、练习与 AI 问答自然地接在一起。</p></div>
      </section>
      <section class="panel" aria-labelledby="login-b-title">
        <div class="tabs" aria-label="登录注册选择"><button class="tab active" type="button">登录</button><button class="tab" type="button">注册</button></div>
        <h2 id="login-b-title">继续你的学习计划</h2><p class="sub">用账号或邮箱登录 EduAgent。</p>
        <form>
          <div class="field"><label for="account-b">账号或邮箱</label><input id="account-b" autocomplete="username" placeholder="例如 user000001"></div>
          <div class="field"><label for="password-b">密码</label><input id="password-b" type="password" autocomplete="current-password" placeholder="请输入密码"></div>
          <div class="tools"><label class="remember"><input type="checkbox" checked>记住我</label><a href="#">找回密码</a></div>
          <button class="cta" type="submit">登录</button>
        </form>
        <p class="legal">登录即代表你同意服务条款与隐私政策。</p>
      </section>
    </div>
  </main>
  <!-- variant: login-b axis: 配色浓度-标准粉彩 -->
</body>
</html>
