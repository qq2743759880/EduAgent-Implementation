<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EduAgent 登录原型 A - 云朵奶昔</title>
  <style>
    :root {
      --bg-app: #F7F5FB;
      --bg-raised: #FFFFFF;
      --clay-lavender: #B8A6FF;
      --clay-sky: #9EC9F0;
      --clay-mint: #7DD4A8;
      --clay-peach: #FFB59E;
      --clay-pink: #F5B8D0;
      --clay-lemon: #F5D77A;
      --cta-coral: #FF7A6B;
      --status-active: #7DD4A8;
      --status-pending: #F5D77A;
      --status-archived: #C9B5FF;
      --text-strong: #2E2A3F;
      --text-muted: #6B6580;
      --cta-text: #2E2A3F; /* 5.43:1 against #FF7A6B */
      --radius-card: 28px;
      --radius-btn: 18px;
      --radius-input: 16px;
      --radius-pill: 999px;
      --radius-icon-tile: 20px;
      --clay-shadow-lavender:
        8px 8px 24px rgba(122,100,220,.35),
        inset -6px -6px 16px rgba(122,100,220,.25),
        inset 6px 6px 16px rgba(255,255,255,.55);
      --clay-shadow-sky:
        8px 8px 24px rgba(80,142,196,.26),
        inset -6px -6px 16px rgba(80,142,196,.20),
        inset 6px 6px 16px rgba(255,255,255,.58);
      --clay-shadow-coral:
        8px 8px 24px rgba(214,82,70,.28),
        inset -6px -6px 16px rgba(214,82,70,.22),
        inset 6px 6px 16px rgba(255,255,255,.46);
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--bg-app); }
    body {
      min-height: 100dvh;
      margin: 0;
      overflow-x: hidden;
      color: var(--text-strong);
      background:
        radial-gradient(circle at 8% 8%, color-mix(in srgb, var(--clay-mint) 28%, transparent), transparent 24rem),
        radial-gradient(circle at 92% 88%, color-mix(in srgb, var(--clay-pink) 30%, transparent), transparent 25rem),
        var(--bg-app);
      font: 500 16px/1.55 "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button, input { font: inherit; }
    button, a, input { -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 3px solid var(--text-strong); outline-offset: 3px; }
    .shell { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 24px 0; }
    .topbar { display: flex; align-items: center; justify-content: space-between; min-height: 52px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; font-weight: 900; }
    .brand-mark { display: grid; place-items: center; width: 44px; height: 44px; border-radius: var(--radius-icon-tile); background: color-mix(in srgb, var(--clay-lavender) 40%, white); box-shadow: var(--clay-shadow-lavender); }
    .status { padding: 8px 14px; border-radius: var(--radius-pill); color: var(--text-strong); background: color-mix(in srgb, var(--clay-mint) 34%, white); font-size: 13px; font-weight: 800; }
    .auth-stage { min-height: calc(100dvh - 100px); display: grid; grid-template-columns: 1.05fr .95fr; align-items: center; gap: clamp(32px, 7vw, 88px); padding: 36px clamp(0px, 3vw, 32px) 64px; }
    .intro { max-width: 520px; }
    .axis { display: inline-flex; align-items: center; min-height: 44px; padding: 8px 16px; border-radius: var(--radius-pill); background: color-mix(in srgb, var(--clay-lemon) 30%, white); color: var(--text-strong); font-size: 13px; font-weight: 900; }
    h1 { margin: 22px 0 14px; font-size: clamp(42px, 6vw, 74px); line-height: 1.02; letter-spacing: -.055em; }
    .lead { max-width: 38ch; margin: 0; color: var(--text-muted); font-size: 18px; }
    .benefits { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 36px; }
    .benefit { min-height: 118px; padding: 18px; border-radius: var(--radius-card); background: color-mix(in srgb, var(--tone) 22%, white); box-shadow: 6px 6px 20px color-mix(in srgb, var(--tone) 26%, transparent), inset 4px 4px 12px rgba(255,255,255,.64); }
    .benefit b { display: block; margin-top: 12px; font-size: 14px; }
    .benefit span { font-size: 26px; }
    .auth-card { position: relative; padding: clamp(24px, 4vw, 42px); border-radius: var(--radius-card); background: color-mix(in srgb, var(--clay-lavender) 20%, white); box-shadow: var(--clay-shadow-lavender); }
    .auth-card::before { content: ""; position: absolute; width: 82px; height: 34px; top: -12px; right: 42px; border-radius: var(--radius-pill); background: color-mix(in srgb, var(--clay-sky) 58%, white); box-shadow: var(--clay-shadow-sky); transform: rotate(4deg); }
    .card-head { margin-bottom: 24px; }
    .card-head h2 { margin: 0 0 8px; font-size: 30px; line-height: 1.15; }
    .card-head p { margin: 0; color: var(--text-muted); }
    .field { display: grid; gap: 8px; margin-bottom: 18px; }
    label { font-size: 14px; font-weight: 900; }
    input { width: 100%; height: 52px; border: 0; border-radius: var(--radius-input); padding: 0 16px; color: var(--text-strong); background: rgba(255,255,255,.72); box-shadow: inset 3px 3px 8px rgba(122,100,220,.18), inset -3px -3px 8px rgba(255,255,255,.82); }
    input::placeholder { color: var(--text-muted); opacity: .86; }
    input:focus { outline: 3px solid var(--text-strong); outline-offset: 2px; }
    .form-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 2px 0 22px; color: var(--text-muted); font-size: 13px; }
    .remember { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: var(--text-strong); cursor: pointer; }
    .remember input { width: 18px; height: 18px; accent-color: var(--cta-coral); box-shadow: none; }
    .link, .signup a { display: inline-flex; min-height: 44px; align-items: center; color: var(--text-strong); font-weight: 900; }
    .cta { width: 100%; min-height: 54px; border: 0; border-radius: var(--radius-btn); background: var(--cta-coral); color: var(--cta-text); box-shadow: var(--clay-shadow-coral); cursor: pointer; font-weight: 950; transition: transform 140ms ease, filter 140ms ease; }
    .cta:hover { transform: translateY(-2px); filter: saturate(1.04); }
    .cta:active { transform: scale(.97); box-shadow: 4px 4px 12px rgba(214,82,70,.24), inset -3px -3px 8px rgba(214,82,70,.18), inset 3px 3px 8px rgba(255,255,255,.38); }
    .signup { margin: 24px 0 0; text-align: center; color: var(--text-muted); }
    @media (max-width: 860px) {
      .auth-stage { grid-template-columns: 1fr; min-height: auto; }
      .intro { max-width: none; text-align: center; }
      .lead { margin-inline: auto; }
      .benefits { max-width: 620px; margin-inline: auto; }
      .auth-card { width: min(520px, 100%); margin-inline: auto; }
    }
    @media (max-width: 560px) {
      .shell { width: min(100% - 24px, 1120px); padding-top: 12px; }
      .status { display: none; }
      .auth-stage { gap: 28px; padding: 28px 0 40px; }
      h1 { font-size: 44px; }
      .benefits { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
      .benefit { min-height: 92px; padding: 12px 8px; text-align: center; }
      .benefit b { font-size: 12px; }
      .auth-card { padding: 24px 18px; }
      .form-row { align-items: flex-start; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      .cta:hover, .cta:active { transform: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#"><span class="brand-mark" aria-hidden="true">EA</span><span>EduAgent</span></a>
      <span class="status">专注学习，轻松成长</span>
    </header>
    <main class="auth-stage">
      <section class="intro" aria-labelledby="page-title">
        <span class="axis">奶昔淡 · 轻柔低浓度</span>
        <h1 id="page-title">把学习捏成<br>喜欢的样子</h1>
        <p class="lead">课程、练习与 AI 辅导都在这里。每天进步一点，学习更有回应。</p>
        <div class="benefits" aria-label="平台能力">
          <div class="benefit" style="--tone:var(--clay-sky)"><span aria-hidden="true">📚</span><b>课程进度</b></div>
          <div class="benefit" style="--tone:var(--clay-mint)"><span aria-hidden="true">🤖</span><b>AI 辅导</b></div>
          <div class="benefit" style="--tone:var(--clay-lemon)"><span aria-hidden="true">🏅</span><b>成长记录</b></div>
        </div>
      </section>
      <section class="auth-card" aria-labelledby="login-title">
        <div class="card-head"><h2 id="login-title">欢迎回来</h2><p>登录后继续今天的学习计划。</p></div>
        <form>
          <div class="field"><label for="account-a">账号或邮箱</label><input id="account-a" autocomplete="username" placeholder="请输入账号或邮箱"></div>
          <div class="field"><label for="password-a">密码</label><input id="password-a" type="password" autocomplete="current-password" placeholder="至少 6 位"></div>
          <div class="form-row"><label class="remember"><input type="checkbox" checked>记住我</label><a class="link" href="#">忘记密码</a></div>
          <button class="cta" type="submit">登录并继续学习</button>
        </form>
        <p class="signup">第一次来？ <a href="#">创建学习账号</a></p>
      </section>
    </main>
  </div>
  <!-- variant: login-a axis: 配色浓度-奶昔淡 -->
</body>
</html>
