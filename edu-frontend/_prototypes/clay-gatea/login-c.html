<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EduAgent 登录原型 C - 高饱和糖果</title>
  <style>
    :root {
      --bg-app: #F7F5FB;
      --bg-raised: #FFFFFF;
      --clay-lavender: #B8A6FF;
      --clay-sky: #9EC9F0;
      --clay-mint: #7DD4A8;
      --clay-peach: #FFB59E;
      --clay-pink: #F5B8D0;
      --clay-lemon: #F5D77A;
      --cta-coral: #FF7A6B;
      --status-active: #7DD4A8;
      --status-pending: #F5D77A;
      --status-archived: #C9B5FF;
      --text-strong: #2E2A3F;
      --text-muted: #6B6580;
      --cta-text: #2E2A3F; /* 5.43:1 against #FF7A6B */
      --radius-card: 28px;
      --radius-btn: 18px;
      --radius-input: 16px;
      --radius-pill: 999px;
      --radius-icon-tile: 20px;
      --clay-shadow-lavender: 8px 8px 24px rgba(122,100,220,.35), inset -6px -6px 16px rgba(122,100,220,.25), inset 6px 6px 16px rgba(255,255,255,.55);
      --clay-shadow-mint: 8px 8px 24px rgba(43,153,103,.36), inset -6px -6px 16px rgba(43,153,103,.26), inset 6px 6px 16px rgba(255,255,255,.52);
      --clay-shadow-pink: 8px 8px 24px rgba(188,99,137,.36), inset -6px -6px 16px rgba(188,99,137,.26), inset 6px 6px 16px rgba(255,255,255,.50);
      --clay-shadow-lemon: 8px 8px 24px rgba(190,149,35,.34), inset -6px -6px 16px rgba(190,149,35,.26), inset 6px 6px 16px rgba(255,255,255,.48);
      --clay-shadow-coral: 8px 8px 24px rgba(214,82,70,.38), inset -6px -6px 16px rgba(214,82,70,.28), inset 6px 6px 16px rgba(255,255,255,.44);
    }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100dvh; margin: 0; overflow-x: hidden; color: var(--text-strong); background: var(--clay-lavender); font: 500 16px/1.55 "PingFang SC", "Microsoft YaHei", sans-serif; }
    button, input { font: inherit; }
    :focus-visible { outline: 3px solid var(--text-strong); outline-offset: 3px; }
    .page { position: relative; isolation: isolate; width: min(1160px, calc(100% - 32px)); min-height: 100dvh; margin: auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(420px, .82fr); align-items: center; gap: clamp(28px, 6vw, 76px); padding: 40px 0; }
    .shape { position: fixed; z-index: -1; border-radius: 42% 58% 48% 52%; }
    .shape.s1 { width: 260px; height: 260px; top: -78px; right: 12%; background: var(--clay-lemon); box-shadow: var(--clay-shadow-lemon); transform: rotate(18deg); }
    .shape.s2 { width: 220px; height: 220px; left: -70px; bottom: -60px; background: var(--clay-mint); box-shadow: var(--clay-shadow-mint); transform: rotate(-14deg); }
    .hero { padding: clamp(8px, 3vw, 36px); }
    .brand { display: inline-flex; align-items: center; gap: 12px; font-weight: 950; font-size: 20px; }
    .brand-mark { display: grid; place-items: center; width: 52px; height: 52px; border-radius: var(--radius-icon-tile); background: var(--clay-pink); box-shadow: var(--clay-shadow-pink); }
    .axis { display: inline-flex; min-height: 44px; align-items: center; margin-top: 56px; padding: 8px 16px; border-radius: var(--radius-pill); background: var(--clay-lemon); box-shadow: var(--clay-shadow-lemon); font-size: 13px; font-weight: 950; }
    h1 { max-width: 8ch; margin: 26px 0 18px; font-size: clamp(54px, 8vw, 94px); line-height: .94; letter-spacing: -.07em; }
    .lead { max-width: 31ch; margin: 0; color: #433D5B; font-size: 19px; font-weight: 700; }
    .streak { display: inline-flex; align-items: center; gap: 10px; min-height: 52px; margin-top: 30px; padding: 8px 18px; border-radius: var(--radius-btn); background: var(--clay-mint); box-shadow: var(--clay-shadow-mint); font-weight: 900; }
    .card { padding: clamp(26px, 4vw, 46px); border-radius: 36px; background: var(--bg-raised); box-shadow: 12px 12px 34px rgba(122,100,220,.34), inset -6px -6px 18px rgba(184,166,255,.20), inset 6px 6px 18px rgba(255,255,255,.70); }
    .switch { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 6px; border-radius: var(--radius-btn); background: color-mix(in srgb, var(--clay-lavender) 26%, white); }
    .switch button { min-height: 44px; border: 0; border-radius: 14px; background: transparent; color: var(--text-muted); font-weight: 950; cursor: pointer; }
    .switch .active { background: var(--clay-pink); color: var(--text-strong); box-shadow: var(--clay-shadow-pink); }
    h2 { margin: 32px 0 6px; font-size: 32px; }
    .sub { margin: 0 0 26px; color: var(--text-muted); }
    .field { display: grid; gap: 8px; margin-bottom: 17px; }
    label { font-size: 14px; font-weight: 950; }
    input { width: 100%; height: 54px; border: 0; border-radius: var(--radius-input); padding: 0 16px; color: var(--text-strong); background: color-mix(in srgb, var(--clay-lavender) 16%, white); box-shadow: inset 3px 3px 8px rgba(122,100,220,.22), inset -3px -3px 8px rgba(255,255,255,.9); }
    input::placeholder { color: var(--text-muted); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 22px; font-size: 13px; }
    .remember { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; cursor: pointer; }
    .remember input { width: 18px; height: 18px; accent-color: var(--cta-coral); box-shadow: none; }
    a { display: inline-flex; min-height: 44px; align-items: center; color: var(--text-strong); font-weight: 950; }
    .cta { width: 100%; min-height: 56px; border: 0; border-radius: var(--radius-btn); color: var(--cta-text); background: var(--cta-coral); box-shadow: var(--clay-shadow-coral); font-weight: 950; cursor: pointer; transition: transform 140ms ease; }
    .cta:hover { transform: translateY(-2px); }
    .cta:active { transform: scale(.97); box-shadow: 4px 4px 12px rgba(214,82,70,.28), inset -3px -3px 8px rgba(214,82,70,.22), inset 3px 3px 8px rgba(255,255,255,.36); }
    .join { margin: 24px 0 0; text-align: center; color: var(--text-muted); }
    @media (max-width: 860px) { body { background: color-mix(in srgb, var(--clay-lavender) 72%, white); } .page { grid-template-columns: 1fr; } .hero { text-align: center; } .axis { margin-top: 32px; } h1 { margin-inline: auto; } .lead { margin-inline: auto; } .card { width: min(560px, 100%); margin-inline: auto; } }
    @media (max-width: 560px) { .page { width: min(100% - 20px, 1160px); padding: 24px 0; gap: 28px; } .brand { justify-content: center; } h1 { font-size: 54px; } .card { padding: 24px 18px; } .shape.s1 { width: 170px; height: 170px; } }
    @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } .cta:hover, .cta:active { transform: none; } }
  </style>
</head>
<body>
  <main class="page">
    <span class="shape s1" aria-hidden="true"></span><span class="shape s2" aria-hidden="true"></span>
    <section class="hero" aria-labelledby="headline-c">
      <div class="brand"><span class="brand-mark" aria-hidden="true">EA</span> EduAgent</div>
      <span class="axis">高饱和糖果 · 明快能量</span>
      <h1 id="headline-c">学习，<br>开动！</h1>
      <p class="lead">进入专属学习空间，把问题变成下一次进步。</p>
      <div class="streak"><span aria-hidden="true">🔥</span> 今日学习目标：20 分钟</div>
    </section>
    <section class="card" aria-labelledby="login-c-title">
      <div class="switch" aria-label="登录注册选择"><button class="active" type="button">登录</button><button type="button">注册</button></div>
      <h2 id="login-c-title">欢迎回来</h2><p class="sub">你的课程和 AI 助教都准备好了。</p>
      <form>
        <div class="field"><label for="account-c">账号或邮箱</label><input id="account-c" autocomplete="username" placeholder="请输入账号或邮箱"></div>
        <div class="field"><label for="password-c">密码</label><input id="password-c" type="password" autocomplete="current-password" placeholder="请输入密码"></div>
        <div class="row"><label class="remember"><input type="checkbox" checked>记住我</label><a href="#">忘记密码</a></div>
        <button class="cta" type="submit">开始学习</button>
      </form>
      <p class="join">还没有账号？ <a href="#">立即注册</a></p>
    </section>
  </main>
  <!-- variant: login-c axis: 配色浓度-高饱和糖果 -->
</body>
</html>
