# ============================================================
# EduAgent 生产部署 —— docker compose 一键起全套
#
# 用法：
#   1) 复制环境变量模板并填写
#        cp edu-agent/.env.production.example .env.production
#        # 编辑必填项（JWT_SECRET / 各密码）
#   2) 启动
#        docker compose -f deploy/docker-compose.yml --env-file .env.production up -d
#   3) 查看状态
#        docker compose -f deploy/docker-compose.yml ps
#
# 说明：
#   - 后端在 backend 容器内跑迁移/建表？当前项目用启动时建表（无 Alembic），
#     首次启动由 backend 的 lifespan init_mysql 建表。若需初始化种子数据另行处理。
#   - 各存储均为单机版（非集群），足够 demo / 小规模部署。
# ============================================================
name: eduagent

services:
  # ===================== 存储层 =====================
  mysql:
    image: mysql:8.0
    container_name: edu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?请在 .env.production 设置 MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-edu}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - edu-mysql-data:/var/lib/mysql
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: edu-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - edu-minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: edu-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - edu-etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  milvus:
    image: milvusdb/milvus:v2.5.5
    container_name: edu-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - edu-milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9091/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  mongodb:
    image: mongo:7
    container_name: edu-mongodb
    restart: unless-stopped
    volumes:
      - edu-mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  neo4j:
    image: neo4j:5-community
    container_name: edu-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?请在 .env.production 设置 NEO4J_PASSWORD}
      NEO4J_dbms_connectors_default__listen__address: 0.0.0.0
    volumes:
      - edu-neo4j-data:/data
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Redis 缓存（Phase 1：限流 + 热点数据缓存）
  redis:
    image: redis:7-alpine
    container_name: edu-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly yes
    volumes:
      - edu-redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ===================== 应用层 =====================
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    image: eduagent-backend:latest
    container_name: edu-backend
    restart: unless-stopped
    environment:
      DEBUG: "false"
      JWT_SECRET: ${JWT_SECRET:?请在 .env.production 设置 JWT_SECRET}
      API_TOKEN: ${API_TOKEN:?请在 .env.production 设置 API_TOKEN}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LLM_API_KEY: ${LLM_API_KEY:?请在 .env.production 设置 LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL_FAST: ${LLM_MODEL_FAST:-deepseek-v4-flash}
      LLM_MODEL_STRONG: ${LLM_MODEL_STRONG:-deepseek-v4-flash}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      # 存储连接（compose 内网）
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-edu}
      MILVUS_URI: http://milvus:19530
      MONGO_URI: mongodb://mongodb:27017
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?}
      NEO4J_CONNECT_TIMEOUT: "5.0"
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      milvus:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        # Next.js 的 NEXT_PUBLIC_* 在 build 时内联，故用 build arg 注入后端地址。
        # 浏览器会直接访问该地址（由后端 CORS_ORIGINS 放行）。默认 localhost（本机部署）。
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        # F-1：/media 同源代理是服务端回源，走 compose 内网 backend:8000（不经浏览器）
        MEDIA_PROXY_TARGET: ${MEDIA_PROXY_TARGET:-http://backend:8000}
    image: eduagent-frontend:latest
    container_name: edu-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  edu-mysql-data:
  edu-minio-data:
  edu-etcd-data:
  edu-milvus-data:
  edu-mongo-data:
  edu-neo4j-data:
  edu-redis-data:
